<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14293d">
<title>NYC 2026 · JP & Thais</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f5f1; --card:#fff; --ink:#16202b; --mut:#66707d; --line:#e3ddd4;
  --navy:#14293d; --accent:#c1440e; --gold:#c8891b; --green:#2e7d4f; --red:#b8283a;
  --sh:0 1px 2px rgba(20,41,61,.06),0 4px 14px rgba(20,41,61,.06);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:88px;overscroll-behavior-y:none}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ── header ── */
header{position:sticky;top:0;z-index:900;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 18px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.brand{font-weight:750;font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.72;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.24)}

/* ── tabs ── */
nav.tabs{position:sticky;top:0;z-index:880;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabsin{display:flex;gap:2px;padding:0 10px;max-width:1180px;margin:0 auto;min-width:max-content}
body{max-width:100%;overflow-x:clip}
.tab{padding:13px 13px 11px;font-size:13.5px;font-weight:600;color:var(--mut);
  border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.view{display:none}.view.on{display:block}

/* ── generic ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.muted{color:var(--mut)}
.sm{font-size:13px}.xs{font-size:11.5px}
.b{font-weight:650}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:11.5px;font-weight:650;background:#eee9e1;color:#4a5460;white-space:nowrap;max-width:100%}
.chip.wrap,.chip.o,.chip.g{white-space:normal;text-align:left;line-height:1.4}
.chip.g{background:#dff0e4;color:#1e6b41}
.chip.o{background:#fdeadb;color:#9c4a13}
.chip.r{background:#fbe3e6;color:#8f2230}
.chip.b{background:#e0e9f3;color:#1c4a72}
.chip.p{background:#ece4f6;color:#5b3690}
.chip.wrap{white-space:normal;text-align:left;line-height:1.45;font-weight:500}
.notebtn{font-size:11px;font-weight:650;color:var(--mut);border:1px dashed var(--line);
  border-radius:8px;padding:3px 8px;margin-top:6px}
.notebtn:hover{color:var(--accent);border-color:#f0d0bd}

.sect{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin:26px 0 10px}
.sect:first-child{margin-top:0}

.banner{border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
#planSheet .psBack{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:70}
#planSheet .psBox{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,560px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#planSheet textarea{width:100%;height:min(38vh,240px);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--ink);resize:vertical}
/* Los tiles de OSM son más coloridos que el estilo gris anterior: los apagamos un poco
   para que los pines de categoría sigan siendo lo que más resalta. */
.leaflet-tile-pane{filter:grayscale(.62) brightness(1.06) contrast(.94)}
#toast{position:fixed;left:50%;transform:translate(-50%,140%);bottom:76px;z-index:60;max-width:min(92vw,460px);
  background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;line-height:1.45;
  box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.banner.warn{background:#fff4e2;border:1px solid #f0d6a8;color:#7a4c07}
.banner.info{background:#e8f0f8;border:1px solid #c6d8ea;color:#1c4a72}
.banner.ok{background:#e4f2e8;border:1px solid #b9ddc6;color:#1e6b41}

/* ── día selector ── */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.days::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;text-align:left;min-width:96px;box-shadow:var(--sh);transition:.15s}
.dbtn .dn{font-size:10.5px;font-weight:750;letter-spacing:.07em;color:var(--mut);text-transform:uppercase}
.dbtn .dd{font-size:15px;font-weight:750;margin:1px 0}
.dbtn .dw{font-size:10.5px;font-weight:600}
.dbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dbtn.on .dn,.dbtn.on .dw{color:rgba(255,255,255,.78)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}

/* ── bloques ── */
.blk{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.blk:last-child{border-bottom:0}
.blk.hi{background:#f2f9f4}
.blk.done{opacity:.42}
.blk.done .btxt{text-decoration:line-through}
/* bloque que NO le toca a quien está mirando el día: se atenúa para que no se confunda */
.blk.ajeno{background:#faf8f4;border-left:3px solid #d9cfc0}
.blk.ajeno .btxt{color:#6b6459}
.tmw{flex:0 0 52px}
.tm{font-size:13px;font-weight:750;color:var(--navy);padding-top:1px;
  background:none;border:0;width:100%;text-align:left}
.tmend{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap}
.trav{padding:5px 14px 5px 62px;font-size:11.5px;color:var(--mut);
  border-bottom:1px dashed var(--line);background:#fbf9f5}
.bbody{flex:1;min-width:0}
.btxt{font-size:14px;line-height:1.5}
.bmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bnote{margin-top:7px;width:100%;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;
  font-size:12.5px;background:#fcfbf9;resize:vertical;min-height:34px}
.bact{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:center}
.ck{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:transparent;background:#fff}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.mini{font-size:14px;opacity:.32;padding:2px 4px;line-height:1}
.mini:hover{opacity:.85}

/* ── lugares ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:190px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);box-shadow:var(--sh)}
select.f{padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  box-shadow:var(--sh);font-size:13.5px;max-width:170px}
.tg{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:13px;font-weight:600;box-shadow:var(--sh)}
.tg.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.plistbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow h3{font-size:13.5px;margin:0;cursor:pointer;flex:1;min-width:130px;line-height:1.3}
.prow .pdot{width:9px;height:9px;border-radius:50%;flex:none}
.prow .pmeta{font-size:11px;color:#8a8378;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.prow .ints{margin:0;padding:0;border:0;display:flex;gap:6px;align-items:center}
.prow .ib{width:22px;height:22px;font-size:11px;border-radius:6px}
.prow .addbtn{margin-left:2px}
@media(max-width:600px){.prow{flex-wrap:wrap}.prow .pmeta{max-width:100%;order:5;width:100%}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.pc h3{font-size:15.5px;font-weight:700}
.pc .why{font-size:13px;color:#3d4854;line-height:1.5}
.cbar{height:3px;border-radius:3px;margin:-14px -14px 2px;border-radius:var(--r) var(--r) 0 0}
.ints{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
.iw{display:flex;align-items:center;gap:5px}
.ilab{font-size:10.5px;font-weight:750;letter-spacing:.05em;color:var(--mut)}
.ib{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;
  font-weight:750;background:#fff;display:grid;place-items:center;transition:.12s}
.ib.v0{background:#f3f0eb;color:#a8a49d}
.ib.v1{background:#fdf0d9;color:#96631a;border-color:#eccf9b}
.ib.v2{background:#dff0e4;color:#1e6b41;border-color:#a9d6ba}
.mustbtn{font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);
  color:#8a8378;border-radius:8px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mustbtn.on{background:#fff3d4;border-color:#e8c46a;color:#8a6008}
.mustbtn.off{background:#efebe5;border-color:#d8d0c4;color:#7b7268}
.prow .mustbtn{padding:2px 6px;flex:none}
.addbtn{margin-left:auto;max-width:100%;font-size:11.5px;font-weight:700;color:var(--accent);
  border:1.5px solid #f0d0bd;border-radius:9px;padding:5px 9px;background:#fdf1eb}

/* ── mapa ── */
#map{height:min(66vh,560px);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);
  background:#e8e4dd;z-index:1}
.mk{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mnum{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:11px 13px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.leaflet-popup-content h4{margin:0 0 5px;font-size:14.5px}

/* ── tablas ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--sh);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:11.5px;
  font-weight:700;letter-spacing:.03em;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
tr.hl td{background:#f2f9f4}
tr.bad td{background:#fdf0eb}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(16,26,36,.55);z-index:1200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:86vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;max-height:82vh}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;font-size:14px;background:#fff}
.opt:hover{background:#f7f5f1}
.opt b{display:block;font-size:12px;color:var(--mut);font-weight:650;margin-top:2px}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;left:0;width:100vw;max-width:100vw;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:950;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;min-width:0}
.barin>.stat{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin>.spacer{flex:0 1 auto}
.barin .btn{flex:0 0 auto}
@media(max-width:420px){.barin{gap:6px}.barin .btn{padding:9px 11px;font-size:12.5px}}
.btn{padding:9px 14px;border-radius:11px;font-size:13px;font-weight:650;
  background:var(--navy);color:#fff}
.btn.ghost{background:#eee9e1;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px}
.stat{font-size:11.5px;color:var(--mut);line-height:1.35}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{font-weight:700;color:var(--navy);white-space:nowrap}
.kv dd{margin:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
summary{padding:13px 15px;font-weight:680;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent);font-weight:800}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 15px 15px}
@media print{header,nav.tabs,.bar,.tools,.days,.bact,.addbtn{display:none!important}
  .view{display:block!important}body{padding:0;background:#fff}}
</style>
</head>
<body>

<header>
 <div class="hrow">
  <div class="brand">NYC 2026<small id="hsub">29 ago – 6 sep · Juan Pablo &amp; Thais</small></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="bWho" title="Filtrar por persona">👥</button>
  <button class="iconbtn" id="bMenu" title="Datos">⋯</button>
 </div>
</header>

<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>

<main>
 <section class="view on" id="v-itin"></section>
 <section class="view" id="v-places"></section>
 <section class="view" id="v-map"></section>
 <section class="view" id="v-costs"></section>
 <section class="view" id="v-trans"></section>
 <section class="view" id="v-res"></section>
</main>

<div class="bar"><div class="barin">
  <div class="stat" id="stat"></div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="bExp">Exportar</button>
  <button class="btn sm" id="bSave">Guardado ✓</button>
</div></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══════════ DATOS ═══════════ */
const DATA = /*__DATA__*/;
const PLACES = DATA.places, BASE_ITIN = DATA.itinerary, EX = DATA.extras;
const PBY = Object.fromEntries(PLACES.map(p => [p.id, p]));
/* subcategorías agrupadas por categoría, para los <optgroup> de los filtros */
const SUBS = DATA.subs || {};

const CAT = {
  mirador:{n:'Mirador',c:'#0b7285'}, museo:{n:'Museo',c:'#6741d9'},
  barrio:{n:'Barrio',c:'#e8590c'},  comida:{n:'Comida',c:'#c2255c'},
  musica:{n:'Música',c:'#2b8a3e'},  arq:{n:'Arquitectura',c:'#1864ab'},
  parque:{n:'Parque',c:'#5c940d'},  evento:{n:'Evento',c:'#ae3ec9'},
  teatro:{n:'Teatro',c:'#9c36b5'},  transporte:{n:'Logística',c:'#495057'}
};
const WHO = {both:'Ambos', jp:'Solo JP', th:'Thais'};
const DOW_IDX = {'Lunes':0,'Martes':1,'Miércoles':2,'Jueves':3,'Viernes':4,'Sábado':5,'Domingo':6};
const KEY = 'nyc2026.v1';

/* ═══════════ ESTADO ═══════════ */
let S = load();
function fresh(){
  const it = JSON.parse(JSON.stringify(BASE_ITIN));
  it.forEach(d => d.blocks.forEach((b,i) => { b.id = 'd'+d.n+'b'+i; b.done = false; b.mynote = ''; }));
  return { itin: it, interest: {}, must: {}, mv: 2, res: {}, day: 1, tab: 'itin', whoF: 'all', pv: 'cards', v: 1,
           baseHash: DATA.itinHash };
}
/* El itinerario base cambió desde que este navegador guardó su plan: adoptar el NUEVO
   conservando lo del usuario — tildes y notas (matcheadas por texto o por lugar+hora),
   bloques agregados a mano, intereses JP/TH, reservas marcadas y filtros. */
var MIGRATED;   // var sin inicializar: load() corre antes y puede ponerla en true — un '= false' acá la pisaría
function migrate(old){
  const ns = fresh();
  ns.interest = old.interest || {};
  ns.res = old.res || {};
  ns.whoF = old.whoF || 'all';
  ns.pv = old.pv || 'cards';
  normMarks(old); ns.must = old.must; ns.mv = 2;
  ns.tab = old.tab || 'itin';
  ns.day = old.day || 1;
  for (const nd of ns.itin){
    const od = (old.itin || []).find(d => d.n === nd.n);
    if (!od) continue;
    for (const nb of nd.blocks){
      const ob = od.blocks.find(b => b.txt === nb.txt) ||
                 (nb.pid ? od.blocks.find(b => b.pid === nb.pid && b.t === nb.t) : null);
      if (ob){ nb.done = !!ob.done; nb.mynote = ob.mynote || ''; }
    }
    od.blocks.filter(b => String(b.id).startsWith('x')).forEach(b => nd.blocks.push(b));
  }
  try { localStorage.setItem(KEY, JSON.stringify(ns)); } catch(e){}
  MIGRATED = true;
  return ns;
}
/* Completa un estado guardado con las claves que agregamos después de que se guardó.
   Sin esto, una versión nueva de la app rompía la vista Lugares en el navegador de alguien
   que ya tenía plan guardado y cuyo itinerario no había cambiado (no se disparaba migrate). */
function hydrate(s){
  normMarks(s);
  const base = fresh();
  for (const k of Object.keys(base)){
    if (s[k] === undefined || s[k] === null) s[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])
             && (typeof s[k] !== 'object' || Array.isArray(s[k]))) s[k] = base[k];
  }
  if (!Array.isArray(s.itin) || !s.itin.length) return base;
  return s;
}
function load(){
  try { const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw);
      if (s && s.v === 1 && s.itin)
        return s.baseHash === DATA.itinHash ? hydrate(s) : migrate(s);
    } } catch(e){}
  return fresh();
}
let saveT = null, dirty = false;
function save(){
  dirty = true; setStat();
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); dirty = false; }
    catch(e){ console.warn('localStorage no disponible', e); }
    setStat();
  }, 250);
}
function interest(id){
  const p = PBY[id]; if (!p) return {jp:0, th:0};
  const o = (S.interest || (S.interest = {}))[id];
  return { jp: o ? o.jp : p.jp, th: o ? o.th : p.th };
}
function setInterest(id, who, val){
  if (!S.interest) S.interest = {};
  if (!S.interest[id]) { const p = PBY[id]; S.interest[id] = {jp:p.jp, th:p.th}; }
  S.interest[id][who] = val; save();
}

/* IMPRESCINDIBLE: marca sí / vacío. Igual que el interés, el default sale del catálogo
   (editable desde el Excel) y lo que toques acá lo pisa y queda guardado en este navegador. */
/* La marca de un lugar tiene TRES estados:
     1  ★ imprescindible  · tiene que entrar en el itinerario
    -1  ✕ no imprescindible · lo descartaste a proposito
     0  sin marcar        · todavia no lo decidiste
   Si el navegador no tiene nada guardado, manda el valor del catalogo (lo que ve Thais).
   Compatibilidad: la version anterior guardaba 0 al DES-marcar una estrella, o sea
   "esto no es imprescindible" — que es exactamente el nuevo -1. Por eso 0 guardado = -1. */
function markOf(id){
  const s = S.must || (S.must = {});
  if (!(id in s)){ const d = PBY[id] && PBY[id].must; return d === -1 ? -1 : d ? 1 : 0; }
  const v = s[id];
  return v > 0 ? 1 : v < 0 ? -1 : 0;
}
function cycleMark(id){
  const m = markOf(id);
  (S.must || (S.must = {}))[id] = m === 0 ? 1 : m === 1 ? -1 : 0;   // ☆ → ★ → ✕ → ☆
  save();
}
/* La version anterior guardaba 0 al DES-marcar una estrella, o sea "esto NO es
   imprescindible" — que hoy es -1. Ahora 0 significa "sin marcar". Esta conversion
   corre una sola vez por navegador (la marca S.mv) para no dar vuelta el sentido. */
function normMarks(s){
  if (s.mv === 2) return s;
  const mm = (s.must && typeof s.must === 'object' && !Array.isArray(s.must)) ? s.must : {};
  for (const k of Object.keys(mm)) if (!mm[k]) mm[k] = -1;
  s.must = mm; s.mv = 2;
  return s;
}
const isMust  = id => markOf(id) === 1;
const isOut   = id => markOf(id) === -1;
const mustCount = () => PLACES.filter(p => isMust(p.id)).length;
const outCount  = () => PLACES.filter(p => isOut(p.id)).length;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>

/* Origen del lugar: de dónde salió. Tres estados, con el mismo código en tarjeta y en fila. */
const SRC = {
  ambas:     {t:'lista google', bg:'#efe7fb', fg:'#5b3a91', d:'Está en la lista de Google guardada — y además lo habíamos propuesto nosotros'},
  lista:     {t:'lista google', bg:'#efe7fb', fg:'#5b3a91', d:'Salió de la lista de Google Maps'},
  propuesta: {t:'otros',        bg:'#f0efec', fg:'#7a736a', d:'Salió de nuestro trabajo conjunto'},
};
function srcChip(p, mini){
  const c = SRC[p.src] || SRC.propuesta;
  const tip = c.d + (p.gname ? ' — en la lista figura como “' + p.gname + '”' : '');
  return `<span class="chip" style="background:${c.bg};color:${c.fg};flex:none" title="${esc(tip)}">${mini ? (p.src === 'propuesta' ? '·' : '★') : c.t}</span>`;
}
const VER = DATA.ver || '—', VERID = DATA.verId || '';
const gmaps = p => 'https://www.google.com/maps/search/?api=1&query=' +
  encodeURIComponent(p.n + (p.addr ? ', ' + p.addr : '') + ', New York');
/* ── Apple Maps ────────────────────────────────────────────────────────────────
   maps.apple.com/directions, el formato unificado de iOS 18.4 / watchOS 11.4:
   source, waypoint (se repite, una por parada intermedia), destination y mode.
   SIN source, Maps arranca desde donde esté parado el que abre el link — que es
   justo el punto: seguir la ruta desde donde estés. Iniciada la navegación en el
   iPhone, el Watch la toma solo y va dando los taps en la muñeca.
   Ojo con dos cosas: ?daddr=lat,lng (el formato viejo) dejó de andar en 18.4, y
   pasarle nombre + dirección en vez de coordenadas hace que Maps muestre el lugar
   por su nombre en vez de un pin mudo. */
const AM_CIUDAD = {Manhattan:'New York, NY', Brooklyn:'Brooklyn, NY', Queens:'Queens, NY',
  Bronx:'Bronx, NY', 'Staten Island':'Staten Island, NY', 'New Jersey':'NJ'};
const AM_MAX = 15;   /* tope de paradas de una ruta en Maps: destino + 14 waypoints */
/* El nombre del catálogo lleva aclaraciones que a Maps le sobran y le empeoran la
   búsqueda: "Hotel Ink48 (29-31 ago)" encuentra peor que "Hotel Ink48". */
const amNombre = p => String(p.n || '').split(/\s+[—·(]/)[0].trim();
function amPunto(p){
  if (!p) return '';
  const ciudad = AM_CIUDAD[p.boro] || '';
  /* aprox = la dirección no se pudo verificar y el pin es del barrio: ahí el nombre
     manda, que lo busque Maps. Con dirección verificada, nombre + dirección. */
  const partes = (!p.aprox && p.addr) ? [amNombre(p), p.addr, ciudad]
                                      : [amNombre(p), p.hood, ciudad];
  return partes.filter(Boolean).join(', ') || (p.lat ? p.lat + ',' + p.lng : '');
}
/* Una ruta con todas las paradas en orden. La última es el destino, el resto van
   como waypoint. Sin source: Maps usa la ubicación actual. */
function amRuta(places, mode){
  const pts = places.map(amPunto).filter(Boolean).slice(0, AM_MAX);
  if (!pts.length) return '';
  const q = pts.slice(0, -1).map(t => 'waypoint=' + encodeURIComponent(t));
  q.push('destination=' + encodeURIComponent(pts[pts.length - 1]));
  q.push('mode=' + mode);
  if (mode === 'transit') q.push('transit-preferences=subway,bus');
  return 'https://maps.apple.com/directions?' + q.join('&');
}
/* Las paradas de un día, en orden, sin repetir la misma dos bloques seguidos
   (el hotel al salir y al volver son dos paradas distintas; el mismo lugar en
   bloques pegados, una sola). */
function paradasDe(d){
  const out = [];
  d.blocks.forEach(b => {
    const p = b.pid ? PBY[b.pid] : null;
    if (!p || !amPunto(p)) return;
    if (out.length && out[out.length - 1].p.id === p.id) return;
    out.push({b, p});
  });
  return out;
}
const money = n => n === 0 ? 'gratis' : '$' + n;
const DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
/* Horario del lugar para un día de la semana (0=lunes). Devuelve null si no hay dato. */
function horario(p, wd){
  if (!p.hrs) return null;
  const w = p.hrs[wd];
  return w ? `${w[0]}–${w[1]}` : 'CERRADO';
}
/* Texto compacto de la semana entera, agrupando días con el mismo horario. */
function horarioSemana(p){
  if (!p.hrs) return '';
  const out = []; let ini = 0;
  for (let i = 1; i <= 6; i++){
    const a = JSON.stringify(p.hrs[i]), b = JSON.stringify(p.hrs[i-1]);
    if (a !== b){ out.push([ini, i-1]); ini = i; }
  }
  out.push([ini, 6]);
  return out.map(([a,b]) => {
    const w = p.hrs[a], r = a === b ? DIAS[a] : `${DIAS[a]} a ${DIAS[b]}`;
    return `${r}: ${w ? w[0]+'–'+w[1] : 'cerrado'}`;
  }).join(' · ');
}

/* Delegación ÚNICA: los contenedores nunca se reemplazan, solo su innerHTML.
   Registrarla dentro de las funciones de render acumularía un listener por render
   y cada click se dispararía N veces. */
$('#v-itin').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = e.target.closest('.blk')?.dataset.b; if (!id) return;
  const act = el.dataset.act;
  const day = S.itin.find(x => x.n === S.day), i = day.blocks.findIndex(b => b.id === id);
  if (i < 0) return; const b = day.blocks[i];
  if (act === 'done'){ b.done = !b.done; save(); rItin(); }
  if (act === 'del'){ day.blocks.splice(i,1); save(); rItin(); }
  if (act === 'up' && i > 0){ day.blocks.splice(i-1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'down' && i < day.blocks.length-1){ day.blocks.splice(i+1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'info' && b.pid) showPlace(b.pid);
  if (act === 'opennote'){ OPEN_NOTES.add(b.id); rItin();
    const ta = document.querySelector(`.blk[data-b="${b.id}"] .bnote`); if (ta) ta.focus(); }
});

/* Sin conexión el mapa no puede dibujarse. En vez de romperse, listamos los lugares
   con su link a Google Maps, que es lo único que hace falta para navegar. */
function svgMap(items, conRuta){
  const pts = items.filter(x => x.p.lat && x.p.lng);
  if (pts.length < 2) return '';
  const la = pts.map(x => x.p.lat), lo = pts.map(x => x.p.lng);
  const la0 = (Math.min(...la) + Math.max(...la)) / 2;
  const k = Math.cos(la0 * Math.PI / 180);                 // 1° de longitud mide menos que uno de latitud
  const X = x => x.p.lng * k, Y = x => -x.p.lat;
  const xs = pts.map(X), ys = pts.map(Y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 1000, pad = 46;
  const span = Math.max(x1 - x0, y1 - y0, 1e-4);           // cuadrado: no deforma distancias
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  x0 = cx - span / 2; y0 = cy - span / 2;
  const sc = (W - pad * 2) / span;
  const px = x => pad + (X(x) - x0) * sc, py = x => pad + (Y(x) - y0) * sc;
  // escala: cuánto mide en pantalla 1 km real
  const kmPx = sc * (1 / 111.32) * 1;                      // 1 km en grados de latitud → px
  const kmRot = Math.max(1, Math.round(span * 111.32 / 4)); // barra de referencia redondeada
  const ruta = conRuta && pts.length > 1
    ? `<polyline points="${pts.map(x => px(x).toFixed(1) + ',' + py(x).toFixed(1)).join(' ')}"
        fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="7 5" opacity=".55"/>` : '';
  const marcas = pts.map((x, i) => {
    const c = CAT[x.p.cat].c, X0 = px(x).toFixed(1), Y0 = py(x).toFixed(1);
    return `<g><title>${esc((x.t ? x.t + ' · ' : '') + x.p.n + ' — ' + x.p.hood)}</title>
      <circle cx="${X0}" cy="${Y0}" r="${conRuta ? 13 : 6.5}" fill="${c}" fill-opacity="${conRuta ? 1 : .8}"
        stroke="#fff" stroke-width="${conRuta ? 2.5 : 1.5}"/>
      ${conRuta ? `<text x="${X0}" y="${Y0}" text-anchor="middle" dominant-baseline="central"
        font-size="12" font-weight="700" fill="#fff">${i + 1}</text>` : ''}</g>`;
  }).join('');
  const etiquetas = conRuta ? pts.map((x, i) => {
    const X0 = +px(x), Y0 = +py(x);
    return `<text x="${(X0 + 17).toFixed(1)}" y="${(Y0 + 4).toFixed(1)}" font-size="12.5"
      fill="var(--ink)" style="paint-order:stroke;stroke:var(--card);stroke-width:3.5px">${esc(x.p.n.slice(0, 30))}</text>`;
  }).join('') : '';
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px">
    <svg viewBox="0 0 ${W} ${W}" width="100%" style="display:block;max-height:74vh" role="img"
      aria-label="Esquema de posiciones relativas de los lugares">
      <defs><pattern id="gr" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M50 0H0V50" fill="none" stroke="var(--line)" stroke-width="1" opacity=".55"/></pattern></defs>
      <rect width="${W}" height="${W}" fill="url(#gr)"/>
      ${ruta}${marcas}${etiquetas}
      <g transform="translate(${pad},${W - 22})">
        <line x1="0" y1="0" x2="${(kmPx * kmRot).toFixed(1)}" y2="0" stroke="var(--ink)" stroke-width="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <line x1="${(kmPx * kmRot).toFixed(1)}" y1="-5" x2="${(kmPx * kmRot).toFixed(1)}" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <text x="${(kmPx * kmRot / 2).toFixed(1)}" y="-9" text-anchor="middle" font-size="13" fill="var(--ink)">${kmRot} km</text>
      </g>
      <text x="${W - pad}" y="${pad - 16}" text-anchor="end" font-size="13" fill="var(--mut)">↑ norte</text>
    </svg></div>`;
}
function mapFallback(){
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value;
  let items;
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  if (dsel){ const d = S.itin.find(x => x.n === +dsel);
    items = d.blocks.filter(b => b.pid && PBY[b.pid]).map(b => ({p:PBY[b.pid], t:b.t})); }
  else items = PLACES.filter(matchSel).map(p => ({p, t:''}));
  $('#map').outerHTML = `<div id="map" style="height:auto;padding:0;background:transparent">
    ${svgMap(items, !!dsel)}
    <div class="banner warn" style="margin:12px 0">Este es un <b>esquema de posiciones reales</b>
      (norte arriba, con escala), no un mapa de calles: acá el mapa callejero no puede cargarse.
      ${dsel ? 'Los números siguen el orden del día.' : 'Elegí un día arriba para ver el recorrido numerado.'}
      Para navegar, cada lugar tiene su <b>link a Google Maps</b>.</div>
    ${items.map(({p,t}) => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="b">${t ? t + ' · ' : ''}${esc(p.n)}</div>
      <div class="xs muted">${esc(p.typ)} · ${esc(p.hood)} · ${money(p.cost)} · 🚇 ${esc(p.sub)}</div>
      <a class="chip b" style="margin-top:5px" href="${gmaps(p)}" target="_blank" rel="noopener">↗ Google Maps</a>
    </div>`).join('')}</div>`;
  const s = $('#mday'); if (s) s.onchange = e => { S.mapDay = e.target.value ? +e.target.value : null; mapFallback(); };
  const c = $('#mcat'); if (c) c.onchange = mapFallback;
}
function drawMap(){
  if (!MAP || typeof L === 'undefined') return;
  if (LAYER) MAP.removeLayer(LAYER);
  LAYER = L.layerGroup().addTo(MAP);
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value, fsel = $('#mfree')?.classList.contains('on');
  // csel viene como "c:<categoría>" o "s:<tipo>"
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  let items = [];
  if (dsel){
    const d = S.itin.find(x => x.n === +dsel);
    d.blocks.forEach(b => { if (b.pid && PBY[b.pid]) items.push({p:PBY[b.pid], num:items.length+1, t:b.t}); });
  } else {
    items = PLACES.filter(p => matchSel(p) && (!fsel || p.cost === 0 || p.free)).map(p => ({p, num:null}));
  }
  const pts = [];
  items.forEach(({p,num,t}) => {
    if (!p.lat) return;
    pts.push([p.lat, p.lng]);
    const c = CAT[p.cat].c;
    const icon = num
      ? L.divIcon({className:'', html:`<div class="mnum" style="background:${c};width:27px;height:27px">${num}</div>`,
                   iconSize:[27,27], iconAnchor:[13,13]})
      : L.divIcon({className:'', html:`<div class="mk" style="background:${c};width:13px;height:13px"></div>`,
                   iconSize:[13,13], iconAnchor:[7,7]});
    L.marker([p.lat,p.lng], {icon}).addTo(LAYER).bindPopup(
      `<h4>${t ? t + ' · ' : ''}${esc(p.n)}</h4>
       <div style="color:#66707d;font-size:12px;margin-bottom:6px"><b style="color:${CAT[p.cat].c}">${esc(p.typ)}</b> · ${esc(p.hood)} · ${money(p.cost)}</div>
       <div style="margin-bottom:8px">${esc(p.why.slice(0,190))}${p.why.length>190?'…':''}</div>
       <div style="font-size:11.5px;color:#66707d;margin-bottom:8px">🚇 ${esc(p.sub)}</div>
       <a href="${gmaps(p)}" target="_blank" rel="noopener"
          style="display:inline-block;background:#14293d;color:#fff;padding:7px 11px;border-radius:9px;
          text-decoration:none;font-weight:650;font-size:12px">Abrir en Google Maps ↗</a>`);
  });
  if (dsel && pts.length > 1)
    L.polyline(pts, {color:'#14293d', weight:2.5, opacity:.45, dashArray:'6,7'}).addTo(LAYER);
  if (pts.length) MAP.fitBounds(pts, {padding:[36,36], maxZoom: dsel ? 14 : 12});
}

/* Aviso breve al pie: confirma o explica lo que acaba de pasar. */
/* ¿El servidor tiene una versión más nueva que la que este navegador cargó?
   Solo funciona servido por http(s); con archivo local devuelve null. */
async function hayVersionNueva(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'reload'});
    if (!r.ok) return null;
    const t = await r.text();
    const m = t.match(/"verId":"([a-f0-9]{6})"/);
    return m ? m[1] !== VERID : null;
  } catch(e){ return null; }
}
/* Al abrir, avisa una sola vez si quedó una versión vieja cacheada. */
async function avisarSiHayVersionNueva(){
  if (location.protocol === 'file:') return;
  if (await hayVersionNueva() === true)
    toast('Hay una versión más nueva del plan. Recargá la página para verla.');
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200);
}
const HOSTED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const puedeBajar = () => !HOSTED || !!DLNS;
let DLNS;   // namespace de descargas del visor (solo existe en el sitio publicado)
(async () => { try { DLNS = window.claude && await window.claude.use('downloads'); } catch(e){} })();
async function dl(name, text, type){
  if (DLNS){                                   // sitio publicado: lo guarda el visor, con confirmación
    try { await DLNS.save({ filename: name, data: new TextEncoder().encode(text) }); return true; }
    catch(e){
      if (e && e.code === 'declined') return false;
      toast('No se pudo descargar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Copiá el plan a mano o abrí el archivo en la compu.');
      return false;
    }
  }
  const b = new Blob([text], {type}); const u = URL.createObjectURL(b);   // archivo local
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
  return true;
}

    txt, [{t:'Copiar', f: async () => {
        try { await navigator.clipboard.writeText(txt); toast('Plan copiado al portapapeles'); }
        catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('Plan copiado'); }
      }},
      ...(puedeBajar() ? [{t:'Bajar archivo', f: async () => {
        if (await dl('nyc2026-plan.json', txt, 'application/json')) toast('Plan exportado'); }}] : [])]);
}
/* Panel simple con un textarea y botones: sirve para exportar (texto listo para copiar)
   y para importar (pegar el texto del otro dispositivo). */
function planSheet(titulo, ayuda, valor, acciones, alPegar){
  const w = document.createElement('div');
  w.id = 'planSheet';
  w.innerHTML = `<div class="psBack"></div><div class="psBox" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <h3 style="margin:0 0 4px">${esc(titulo)}</h3>
    <p class="sm muted" style="margin:0 0 10px">${ayuda}</p>
    <textarea id="planTxt" spellcheck="false" ${alPegar ? 'placeholder="Pegá acá el texto exportado en el otro dispositivo"' : ''}>${esc(valor)}</textarea>
    <div class="flex" style="margin-top:11px;justify-content:flex-end">
      ${acciones.map((a, i) => `<button class="btn" data-a="${i}">${esc(a.t)}</button>`).join('')}
      <button class="btn" data-a="x">Cerrar</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('.psBack').onclick = () => w.remove();
  w.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'x') { w.remove(); return; }
    acciones[+b.dataset.a].f(document.getElementById('planTxt').value); };
  if (alPegar) setTimeout(() => document.getElementById('planTxt').focus(), 50);
}
function doCsv(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g,'""') + '"';
  const head = ['Lugar','Categoria','Tipo','Barrio','Borough','JP','Thais','USD','Horas','Turistico',
                'Cierra','Gratis/PWYW','Reserva','Subte','PorQue','Direccion'];
  const rows = PLACES.map(p => { const i = interest(p.id);
    return [p.n, CAT[p.cat].n, p.typ, p.hood, p.boro, i.jp, i.th, p.cost, p.dur,
            p.main?'SI':'no', p.closed, p.free, p.book, p.sub, p.why, p.addr].map(q).join(','); });
  const csv = head.map(q).join(',') + '\n' + rows.join('\n');
  closeSheet();
  if (puedeBajar()){ dl('nyc2026-lugares.csv', '\ufeff' + csv, 'text/csv;charset=utf-8'); return; }
  planSheet('Lugares en CSV',
    'Copiá este texto y pegalo en una hoja de cálculo: Excel y Google Sheets separan las columnas solos.',
    csv, [{t:'Copiar', f: async () => {
      try { await navigator.clipboard.writeText(csv); toast('CSV copiado'); }
      catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('CSV copiado'); } }}]);
}
$('#bExp').onclick = doExport;
$('#bSave').onclick = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); dirty = false; setStat();
  $('#bSave').textContent = '¡Listo!'; setTimeout(setStat, 900); } catch(e){ alert('No se pudo guardar en este navegador. Usá Exportar.'); } };
