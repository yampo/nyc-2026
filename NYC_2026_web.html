<meta name="theme-color" content="#14293d">
<title>NYC 2026</title>
<style>
:root{
  --bg:#f7f5f1; --card:#fff; --ink:#111c26; --mut:#5c6673; --line:#e3ddd4;
  --navy:#14293d; --accent:#c1440e; --gold:#c8891b; --green:#2e7d4f; --red:#b8283a;
  --sh:0 1px 2px rgba(20,41,61,.06),0 4px 14px rgba(20,41,61,.06);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:88px;overscroll-behavior-y:none}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ── header ── */
header{position:sticky;top:0;z-index:900;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 18px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.brand{font-weight:750;font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.72;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.24)}

/* ── tabs ── */
nav.tabs{position:sticky;top:0;z-index:880;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabsin{display:flex;gap:2px;padding:0 10px;max-width:1180px;margin:0 auto;min-width:max-content}
body{max-width:100%;overflow-x:clip}
.tab{padding:13px 13px 11px;font-size:13.5px;font-weight:600;color:var(--mut);
  border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.view{display:none}.view.on{display:block}

/* ── generic ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.muted{color:var(--mut)}
.sm{font-size:13px}.xs{font-size:11.5px}
.b{font-weight:650}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:11.5px;font-weight:650;background:#eee9e1;color:#4a5460;white-space:nowrap;max-width:100%}
.chip.wrap,.chip.o,.chip.g{white-space:normal;text-align:left;line-height:1.4}
.chip.g{background:#dff0e4;color:#1e6b41}
.chip.o{background:#fdeadb;color:#9c4a13}
.chip.r{background:#fbe3e6;color:#8f2230}
.chip.b{background:#e0e9f3;color:#1c4a72}
.chip.p{background:#ece4f6;color:#5b3690}
.chip.wrap{white-space:normal;text-align:left;line-height:1.45;font-weight:500}
.notebtn{font-size:11px;font-weight:650;color:var(--mut);border:1px dashed var(--line);
  border-radius:8px;padding:3px 8px;margin-top:6px}
.notebtn:hover{color:var(--accent);border-color:#f0d0bd}

.sect{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin:26px 0 10px}
.sect:first-child{margin-top:0}

.banner{border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
#planSheet .psBack{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:70}
#planSheet .psBox{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,560px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#planSheet textarea{width:100%;height:min(38vh,240px);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--ink);resize:vertical}
/* Los tiles de OSM son más coloridos que el estilo gris anterior: los apagamos un poco
   para que los pines de categoría sigan siendo lo que más resalta. */
.leaflet-tile-pane{filter:grayscale(.62) brightness(1.06) contrast(.94)}
#toast{position:fixed;left:50%;transform:translate(-50%,140%);bottom:76px;z-index:60;max-width:min(92vw,460px);
  background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;line-height:1.45;
  box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.banner.warn{background:#fff4e2;border:1px solid #f0d6a8;color:#7a4c07}
.banner.info{background:#e8f0f8;border:1px solid #c6d8ea;color:#1c4a72}
.banner.ok{background:#e4f2e8;border:1px solid #b9ddc6;color:#1e6b41}

/* ── día selector ── */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.days::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;text-align:left;min-width:96px;box-shadow:var(--sh);transition:.15s}
.dbtn .dn{font-size:10.5px;font-weight:750;letter-spacing:.07em;color:var(--mut);text-transform:uppercase}
.dbtn .dd{font-size:15px;font-weight:750;margin:1px 0}
.dbtn .dw{font-size:10.5px;font-weight:600}
.dbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dbtn.on .dn,.dbtn.on .dw{color:rgba(255,255,255,.78)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}

/* ── bloques ── */
.blk{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.blk:last-child{border-bottom:0}
.blk.hi{background:#f2f9f4}
.blk.done{opacity:.42}
.blk.done .btxt{text-decoration:line-through}
/* bloque que NO le toca a quien está mirando el día: se atenúa para que no se confunda */
.blk.ajeno{background:#faf8f4;border-left:3px solid #d9cfc0}
.blk.ajeno .btxt{color:#6b6459}
.tmw{flex:0 0 52px}
.tm{font-size:13px;font-weight:750;color:var(--navy);padding-top:1px;
  background:none;border:0;width:100%;text-align:left}
.tmend{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap}
.trav{padding:5px 14px 5px 62px;font-size:11.5px;color:var(--mut);
  border-bottom:1px dashed var(--line);background:#fbf9f5}
/* Lugares de paso: van con el traslado, no con el bloque — no son visitas.
   Tono apagado a propósito: son referencia, no plan. */
.paso{padding:4px 14px 6px 62px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;
  border-bottom:1px dashed var(--line);background:#fbf9f5}
.pasolb{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);flex:none}
.chip.paso1{background:#fff;border:1px dashed var(--line);font-size:11px;padding:2px 8px;
  font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.paso1 i{font-style:normal;color:var(--mut);font-weight:500;margin-left:5px}
/* «Acá cerca» va dentro del bloque, no en el traslado: es lo que tenés al lado
   mientras estás en esa parada, no lo que te queda de camino hacia ella. */
.aca{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.acalb{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);flex:none}
/* Lo que hay dentro de un barrio que se camina: ficha corta, no chip — acá sí
   hace falta el porqué y los links, porque la decisión se toma leyendo. */
.hood{margin-top:8px;border:1px dashed var(--line);border-radius:11px;padding:9px 11px;background:#fbf9f5}
.hoodlb{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:7px}
.hoodit{padding:7px 0;border-top:1px dashed var(--line)}
.hoodit:first-of-type{border-top:0;padding-top:0}
.hoodn{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.hoodn b{cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.hoodd{font-size:11px;color:var(--mut)}
.hoodw{font-size:12px;color:var(--mut);line-height:1.45;margin:3px 0 5px}
.bbody{flex:1;min-width:0}
.btxt{font-size:14px;line-height:1.5}
.bmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bnote{margin-top:7px;width:100%;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;
  font-size:12.5px;background:#fcfbf9;resize:vertical;min-height:34px}
.bact{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:center}
.ck{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:transparent;background:#fff}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.mini{font-size:14px;opacity:.32;padding:2px 4px;line-height:1}
.mini:hover{opacity:.85}

/* ── lugares ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:190px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);box-shadow:var(--sh)}
select.f{padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  box-shadow:var(--sh);font-size:13.5px;max-width:170px}
.tg{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:13px;font-weight:600;box-shadow:var(--sh)}
.tg.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.plistbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow h3{font-size:13.5px;margin:0;cursor:pointer;flex:1;min-width:130px;line-height:1.3}
.prow .pdot{width:9px;height:9px;border-radius:50%;flex:none}
.prow .pmeta{font-size:11px;color:#8a8378;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
.prow .ints{margin:0;padding:0;border:0;display:flex;gap:6px;align-items:center}
.prow .ib{width:22px;height:22px;font-size:11px;border-radius:6px}
.prow .addbtn{margin-left:2px}
@media(max-width:600px){.prow{flex-wrap:wrap}.prow .pmeta{max-width:100%;order:5;width:100%}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.pc h3{font-size:15.5px;font-weight:700}
.pc .why{font-size:13px;color:#3d4854;line-height:1.5}
.cbar{height:3px;border-radius:3px;margin:-14px -14px 2px;border-radius:var(--r) var(--r) 0 0}
.ints{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
.iw{display:flex;align-items:center;gap:5px}
.ilab{font-size:10.5px;font-weight:750;letter-spacing:.05em;color:var(--mut)}
.ib{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;
  font-weight:750;background:#fff;display:grid;place-items:center;transition:.12s}
.ib.v0{background:#f3f0eb;color:#a8a49d}
.ib.v1{background:#fdf0d9;color:#96631a;border-color:#eccf9b}
.ib.v2{background:#dff0e4;color:#1e6b41;border-color:#a9d6ba}
.mustbtn{font-size:11px;font-weight:700;border:1.5px solid var(--line);background:var(--card);
  color:#8a8378;border-radius:8px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mustbtn.on{background:#fff3d4;border-color:#e8c46a;color:#8a6008}
.mustbtn.off{background:#efebe5;border-color:#d8d0c4;color:#7b7268}
.prow .mustbtn{padding:2px 6px;flex:none}
.addbtn{margin-left:auto;max-width:100%;font-size:11.5px;font-weight:700;color:var(--accent);
  border:1.5px solid #f0d0bd;border-radius:9px;padding:5px 9px;background:#fdf1eb}

/* ── mapa ── */
#map{height:min(66vh,560px);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);
  background:#e8e4dd;z-index:1}
.mk{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
/* Referencia de paso: anillo hueco, para que se lea distinto de una parada del día */
.mkpaso{width:15px;height:15px;background:#fff;border:3px solid;box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* Pin de la vista de conjunto: el número del día es la identidad, el color acompaña */
.mdchip{cursor:pointer;font-size:11.5px;padding:3px 9px 3px 5px;font-weight:600}
.mdchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mdia{min-width:22px;height:22px;padding:0 3px;border-radius:11px;border:2px solid #fff;color:#fff;
  font:700 11.5px/18px ui-sans-serif,system-ui,sans-serif;text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.35);box-sizing:border-box}
.mnum{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:11px 13px;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.leaflet-popup-content h4{margin:0 0 5px;font-size:14.5px}

/* ── tablas ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--sh);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:11.5px;
  font-weight:700;letter-spacing:.03em;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
tr.hl td{background:#f2f9f4}
tr.bad td{background:#fdf0eb}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(16,26,36,.55);z-index:1200;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:86vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;max-height:82vh}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:7px;font-size:14px;background:#fff}
.opt:hover{background:#f7f5f1}
.opt b{display:block;font-size:12px;color:var(--mut);font-weight:650;margin-top:2px}

/* ── bottom bar ── */
.bar{position:fixed;bottom:0;left:0;width:100vw;max-width:100vw;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:950;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom))}
.barin{max-width:1180px;margin:0 auto;display:flex;gap:8px;align-items:center;min-width:0}
.barin>.stat{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barin>.spacer{flex:0 1 auto}
.barin .btn{flex:0 0 auto}
@media(max-width:420px){.barin{gap:6px}.barin .btn{padding:9px 11px;font-size:12.5px}}
.btn{padding:9px 14px;border-radius:11px;font-size:13px;font-weight:650;
  background:var(--navy);color:#fff}
.btn.ghost{background:#eee9e1;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px}
.stat{font-size:11.5px;color:var(--mut);line-height:1.35}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{font-weight:700;color:var(--navy);white-space:nowrap}
.kv dd{margin:0}
details{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:9px;box-shadow:var(--sh);overflow:hidden}
summary{padding:13px 15px;font-weight:680;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--accent);font-weight:800}
details[open] summary::before{content:"▾ "}
details .dbody{padding:0 15px 15px}

/* ══════════════════════════════════════════════════════════════════════════
   V2 · rediseño para el uso real: parado en la calle, una mano, 10 segundos.
   Todo lo de abajo pisa a lo de arriba a propósito (misma especificidad,
   más tarde en el archivo), así el CSS original queda como referencia.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── cromo superior: header + pestañas en UN solo sticky ──────────────────
   Antes los dos eran sticky top:0 y el header tapaba las pestañas al
   scrollear: cambiar de pestaña obligaba a volver arriba de todo. */
.topbar{position:sticky;top:0;z-index:900;box-shadow:0 2px 16px rgba(20,41,61,.16)}
header{position:static;z-index:auto;box-shadow:none;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.brand{font-size:15.5px;font-weight:750;display:flex;align-items:baseline;gap:8px;
  min-width:0;overflow:hidden}
.brand small{display:inline;font-size:11.5px;font-weight:500;opacity:.75;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.iconbtn{width:33px;height:33px;font-size:14px;border-radius:9px}
nav.tabs{position:static;z-index:auto;border-bottom:1px solid var(--line)}
.tab{padding:11px 12px 9px;font-size:13px}

main{padding-top:12px}

/* ── tira de días: más baja, y hoy se ve ─────────────────────────────────── */
.days{gap:6px;padding-bottom:11px}
.dbtn{min-width:0;padding:7px 11px;border-radius:11px}
.dbtn .dd{font-size:14px;font-weight:750;margin:0;letter-spacing:-.01em}
.dbtn .dw{font-size:10.5px;font-weight:600;color:var(--mut);margin-top:1px}
.dbtn.on .dw{color:rgba(255,255,255,.8)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}
.dbtn .hoylb{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;
  color:var(--gold);text-transform:uppercase}

/* ── AHORA: la respuesta a "¿qué toca?" ──────────────────────────────────── */
.ahora{margin:0 0 13px;border-radius:15px;overflow:hidden;background:var(--navy);
  color:#fff;box-shadow:0 4px 20px rgba(20,41,61,.22)}
.ahlb{display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:rgba(255,255,255,.09);font-size:10.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ahlb .sp{flex:1}
.ahhoy{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:none;
  background:rgba(255,255,255,.16);color:#fff;padding:4px 10px;border-radius:8px}
.ahmain{padding:12px 14px 12px}
.aht{font-size:12px;font-weight:750;color:#7fd4ae;letter-spacing:.03em}
.ahn{font-size:19px;font-weight:700;line-height:1.24;margin:3px 0 5px;letter-spacing:-.015em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ahd{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.74)}
.ahnext{padding:10px 14px;border-top:1px solid rgba(255,255,255,.14);
  font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.78)}
.ahnext b{color:#fff}
.ahacts{display:flex;gap:7px;padding:11px 14px calc(13px);flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.14)}
.ahbtn{background:var(--accent);color:#fff;padding:10px 15px;border-radius:11px;

/* ── cabecera del día: el título manda, el porqué se despliega ───────────── */

  box-shadow:var(--sh);padding:13px 14px;margin-bottom:12px}

/* El «base:» del día 5 es una frase entera ("JGStay SoHo → New Jersey (la ÚNICA

.dhead .dchips .chip{white-space:normal;text-align:left;line-height:1.4;max-width:100%}
.dporque{margin-top:10px;border:0;box-shadow:none;background:none;border-radius:0}

/* ── el bloque de itinerario ─────────────────────────────────────────────
   `.itb` es la clase nueva: `.blk` a secas la sigue usando Reservas y no se

.blk.itb{display:flex;gap:9px;padding:10px 12px;align-items:flex-start;

.bfacts .ojo{color:#8a5a08;font-weight:750}
.bfacts .cerr{color:var(--red);font-weight:750}

.itb.logi{padding:7px 12px;background:#fbfaf7}

.itb.past{opacity:.62}

@keyframes fl{0%,100%{background:#fff7e7}30%{background:#ffe9b8}}
@media(prefers-reduced-motion:reduce){.itb.flash{animation:none}}

se,"gname":"","must":0,"typ":"Tienda con historia","hrs":[["12:00","19:00"],["12:00","19:00"],["12:00","19:00"],["12:00","19:00"],["12:00","19:00"],["12:00","19:00"],["12:00","19:00"]]},{"id":"heatonistch","n":"HEATONIST Chelsea Market","cat":"arq","hood":"Chelsea","boro":"Manhattan","sub":"14 St (A,C,E), 8 Av (L)","lat":40.7420513,"lng":-74.0048973,"addr":"75 9th Ave (dentro del Chelsea Market)","cost":15,"costN":"una botella ronda $12-20; probar es gratis","dur":0.3,"why":"La sucursal chica, ADENTRO del Chelsea Market donde ya almuerzan el viernes. Mismo catalogo de mas de 100 salsas y la misma cata, en menos metros y con mas gente.","jp":1,"th":1,"tags":["exploracion","pedido-juan","horario-verificado"],"closed":"","free":"","book":"","main":false,"src":"propuesta","aprox":false,"gname":"","must":0,"typ":"Tienda con historia","hrs":[["12:00","18:45"],["12:00","18:45"],["12:00","18:45"],["12:00","18:45"],["12:00","18:45"],["12:00","18:45"],["12:00","18:45"]]}],"subs":{"mirador":["Ferry y teleférico","Mirador gratis","Observatorio pago","Rooftop bar"],"barrio":["Barrio histórico","Barrio étnico","Isla","Waterfront"],"parque":["Cementerio-jardín","Naturaleza","Parque de esculturas","Parque urbano","Paseo elevado"],"museo":["Biblioteca histórica","Museo de arte","Museo de ciencia","Museo de historia","Museo temático"],"arq":["Arquitectura moderna","Casa y calle histórica","Interior monumental","Parque de esculturas","Puente","Templo","Tienda con historia"],"comida":["Café y brunch","Coctelería","Comida al paso","Deli y pastrami","Diner clásico","Hamburguesería","Heladería y dulces","Mercado y food hall","Panadería y bagels","Pizzería","Restaurante americano","Restaurante con vista","Restaurante étnico","Steakhouse clásico"],"musica":["Bar con música","Club de jazz","Música del mundo","Venue alternativo"],"teatro":["Musical de Broadway","Off-Broadway","Play de Broadway","Tickets con descuento"],"evento":["Deporte","Festival gratis","Festival pago","Taller y experiencia","Tour guiado"],"transporte":["Ferry y teleférico","Hotel"]},"itinerary":[{"n":1,"date":"2026-08-29","dow":"Sábado","who":"both","base":"Ink48","title":"Harlem + Arthur Avenue + festival (2h) + Hudson VU","note":"La reserva de Hudson VU (rooftop del propio Ink48) NO es modificable y exige estar en el hotel 19:20, así que el festival queda en la franja 16:30-18:30 — dos horas justas, con salida obligada 20-30 min antes del cierre. La tarde liberada la ocupa ARTHUR AVENUE, la Little Italy real del Bronx — los dos la marcaron 2 y no entraba en ningún día. Desde Harlem es un tiro de subte D (~20 min), y el sábado es EL día: el mercado cierra ~18h y los domingos no abre. Bogotá está a una hora de NYC: no hay jet lag, solo noche corta de avión. PEDIR EARLY CHECK-IN a Ink48 por mail. CAMBIO EN LA LLEGADA: entra el UBER SHUTTLE en vez de AirTrain + NJ Transit + taxi. Para dos personas sale más barato —$41,40 contra $46-52— y sobre todo es UN solo transporte con las valijas en vez de tres, a las siete de la mañana y después de un vuelo nocturno. Lo que se paga: llegan al hotel ~9:10 en vez de ~8:20, y los shuttles salen cada 40-50 minutos mientras que el tren sale cada 10-15. Si migraciones se estira más de lo previsto, EL PLAN VIEJO SIGUE SIENDO MEJOR y está escrito en las alternativas del día.","blocks":[{"t":"06:00","txt":"Aterrizaje en EWR. Migraciones + equipaje de vuelo internacional: 45-75 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"07:20","txt":"Caminar a la zona de recogida del UBER SHUTTLE: Terminal B, Zona 5 — son ~6 min desde la puerta de llegadas. Pedirlo en la app apenas salgan de migraciones.","pid":"","who":"both","kind":"logistica","note":""},{"t":"07:40","txt":"★ UBER SHUTTLE EWR → THEATRE DISTRICT (50th St y 8th Ave). $20,70 POR PERSONA = $41,40 los dos, precio fijo y asiento reservado. Llega 8:54. UN SOLO transporte con las valijas, después de un vuelo nocturno: sin AirTrain, sin transbordo en Penn Station y sin taxi. Horarios del sábado desde Terminal B: 7:40 · 7:50 (a Port Authority) · 8:30 · 8:35.","pid":"","who":"both","kind":"logistica","note":"⚠️ Salen cada 40-50 min, no cada 10 como el tren: si migraciones se estira y pierden el de 7:40, el siguiente llega 9:57 y el día arranca tarde."},{"t":"08:54","txt":"Bajar en Theatre District y caminar 13 min al Ink48 (50th y 8ª → 48th y 11ª, todo derecho por la 48). Con valijas es lo único que cuesta de esta opción.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:10","txt":"Ink48: dejar valijas y, si consiguieron el early check-in, ducha y ropa limpia.","pid":"ink48","who":"both","kind":"logistica","note":""},{"t":"09:25","txt":"Desayuno RÁPIDO en Hell's Kitchen, sobre la 9ª o la 10ª. Hoy es rápido de verdad: el shuttle llega más tarde que el tren y el subte a Harlem sale 10:00.","pid":"","who":"both","kind":"comida","note":""},{"t":"10:00","txt":"Subte A o D express desde 42 St hasta 125 St: 12 minutos y ya están en Harlem.","pid":"","who":"both","kind":"logistica","note":""},{"t":"10:30","txt":"Caminata por Harlem: 125th St, Adam Clayton Powell Blvd y las brownstones del Mount Morris Park Historic District.","pid":"harlem","who":"both","kind":"destacado","note":""},{"t":"11:30","txt":"Bo's Bagels (235 W 116th St) — bagel rápido, sin sentarse mucho: hoy el almuerzo fuerte es italiano en el Bronx.","pid":"bosbagels","who":"both","kind":"comida","note":"","trav":"🚶 ~15 min a pie · 1.1 km · estimado"},{"t":"12:00","txt":"★ STUDIO MUSEUM IN HARLEM — reabrió en noviembre 2025 en el edificio nuevo de David Adjaye. La novedad arquitectónica y curatorial más relevante de la ciudad. Sugerido $16, gratis los domingos. QUÉ HAY AHORA (verificado 27/8): «Fade» en el 4º piso, que CIERRA EL 6 DE SEPTIEMBRE — o sea que esta es la única pasada posible — y «Dreams of This Future», la colección de Peggy Cooper Cafritz. ⚠️ La entrada es con HORARIO ASIGNADO: sacarla antes.","pid":"studiomuseum","who":"both","kind":"destacado","note":"","trav":"🚶 ~14 min a pie · 1.0 km · estimado"},{"t":"13:30","txt":"Subte D desde 125 St hasta Fordham Rd (~20 min). Alternativa: Metro-North desde Harlem-125th a Fordham, 12 minutos.","pid":"","who":"both","kind":"logistica","note":""},{"t":"14:00","txt":"★★ ARTHUR AVENUE (Belmont) — la Little Italy real: carnicerías, panaderos de 1918 y el enclave albanés. Almuerzo: el sándwich de mozzarella fresca de Casa Della Mozzarella (E 187th St) y el Arthur Avenue Retail Market con Mike's Deli adentro. El mercado cierra ~18h y los DOMINGOS no abre: hoy es el único día del viaje que sirve.","pid":"arthurave","who":"both","kind":"destacado","note":""},{"t":"15:40","txt":"Subte D desde Fordham Rd de vuelta a 125 St (~25 min) y caminar a Marcus Garvey Park.","pid":"","who":"both","kind":"logistica","note":""},{"t":"16:30","txt":"★★ CHARLIE PARKER JAZZ FESTIVAL — VERIFICADO el 27/8: la música va de 14:00 a 19:00 en Marcus Garvey Park, y el cartel es JOSHUA REDMAN de cierre, con Nat Adderley Jr., Catherine Russell, Nicole Glover y DJ Kultured Child. Ustedes entran 16:30 con la franja 16:30-18:30: la reserva de Hudson VU no es modificable y manda. ⚠️ SALIDA OBLIGADA 18:30 — Redman cierra, así que van a ver el arranque de su set y se pierden el final. Si quieren verlo entero hay que recortar Arthur Avenue y llegar al parque a las 15:30.","pid":"charlieparker29","who":"both","kind":"destacado","note":""},{"t":"18:30","txt":"UBER desde Marcus Garvey Park al Ink48 (~20-25 min un sábado a la tarde, ~$25-30). Es lo que garantiza llegar 19:00-19:05. Plan B en subte: salir 18:10, 2/3 desde 125-Lenox hasta Times Sq y 15 min a pie — total ~45 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:20","txt":"EN EL HOTEL — margen para dejar cosas y subir.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:30","txt":"★★ HUDSON VU — drinks y comida, RESERVA NO MODIFICABLE, en el rooftop de SU PROPIO hotel (Ink48). La mesa es de MÁXIMO 90 MINUTOS: cierran ~21:00. Pedir sin vueltas y disfrutar la vista — lo que sigue está a 8 cuadras.","pid":"ink48","who":"both","kind":"destacado","note":""},{"t":"21:00","txt":"Caminata Ink48 → Birdland (315 W 44th): 8 cuadras, 10-12 min. Llegan ~21:15, justo para las puertas del set de las 21:30.","pid":"","who":"both","kind":"logistica","note":""},{"t":"21:30","txt":"★★ BIRDLAND — set de las 21:30: DAVID DEJESUS & THE BOPTET, 'Celebrating Charlie Parker'. El 29/8 es el CUMPLEAÑOS de Bird y Birdland es el club que lleva su nombre: el día cierra en círculo — festival Charlie Parker de día, tributo a Parker de noche. RESERVAR en birdlandjazz.com (cartelera ya publicada). Si prefieren más tarde: Makoto Ozone Trio a las 22:30 en el mismo club. Y si el cansancio de un día que empezó 6 AM en un avión manda, saltearlo no es pecado.","pid":"birdland","who":"both","kind":"destacado","note":""}],"alt":"PLAN VIEJO, POR SI EL SHUTTLE NO SIRVE (y es el que conviene si salen tarde de migraciones): AirTrain hasta Newark Airport Station (~10 min, ticket en la app MyTix — a bordo cobran $5 extra) y NJ Transit hasta Penn Station, $17,25 por persona con el AirTrain incluido. Trenes del sábado desde EWR: 6:00, 6:07, 6:43, 7:04, 7:15, 7:25, 7:39 — o sea uno cada diez o quince minutos, que es la ventaja real. De Penn al hotel, taxi de $12-18. Llegan 8:15-8:30, casi una hora antes que con el shuttle. // Si llegan fundidos del vuelo, ARTHUR AVENUE es lo primero que se cae: salteenla, descansen en el hotel 13-16h y lleguen al festival 16:30. El festival y la reserva de Hudson VU son lo irrenunciable del día. OJO: Bill's Place se movió al VIERNES 4/9 por esta reserva — el set del sábado ya no aplica. // Sobre agregar cosas AL LUNES con este recorte: el lunes ya está lleno de 8:45 a 22:48 con dos anclas fijas (Ford Foundation solo abre días hábiles y el 9/11 gratis es 17:30-19:00) — no hay hueco real. El tiempo que libera el festival es del SÁBADO, y Arthur Avenue era lo mejor que quedaba sin agendar de lo que marcaron los dos."},{"n":2,"date":"2026-08-30","dow":"Domingo","who":"both","base":"Ink48","title":"Lower East Side, Chinatown y el Brooklyn Bridge a pie","note":"SALIÓ el día 2 del festival Charlie Parker: los dos lo marcaron 0 en la app (ver dos días seguidos de festival no les cerró). La mañana del Lower East Side queda igual — el domingo sigue siendo el ÚNICO día que sirve para Eldridge Street, que cierra los sábados. La tarde liberada la ocupa el CRUCE DEL BROOKLYN BRIDGE A PIE, que no estaba en ningún día del viaje y desde Chinatown se arranca caminando: la entrada peatonal está en City Hall, a diez minutos de Mott St.","blocks":[{"t":"08:30","txt":"Desayuno rápido y subte F hasta 2 Av.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:15","txt":"★ Russ & Daughters — appetizing store de 1914, cuarta generación de la misma familia. Salmón curado cortado a mano sobre bagel. El mostrador es mejor experiencia que el café de al lado.","pid":"russdaughters","who":"both","kind":"destacado","note":""},{"t":"10:30","txt":"★ Museum at Eldridge Street — sinagoga de 1887 restaurada por $20 millones, con un rosetón nuevo de Kiki Smith. Que hoy esté en el medio de Chinatown es la mitad del punto. CIERRA LOS SÁBADOS: hoy es el día.","pid":"eldridge","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"11:45","txt":"Essex Market — mercado municipal desde 1940. Sigue teniendo carniceros y pescaderos de verdad, no solo puestos para turistas.","pid":"essexmarket","who":"both","kind":"paseo","note":"","trav":"🚶 ~11 min a pie · 0.8 km · estimado"},{"t":"12:45","txt":"Caminata por el Lower East Side: Orchard, Ludlow, Rivington. Tres capas de inmigración en la misma cuadra.","pid":"les","who":"both","kind":"paseo","note":""},{"t":"13:15","txt":"Almuerzo en Chinatown: Mott St y las pescaderías de la calle. El paisaje urbano es el plato fuerte.","pid":"chinatown","who":"both","kind":"comida","note":"","trav":"🚶 ~14 min a pie · 1.0 km · estimado"},{"t":"14:15","txt":"Columbus Park (tai chi y partidas de xiangqi) y Doyers Street, la cuadra torcida que era 'the Bloody Angle'. Diez minutos y de ahí se sale caminando hacia City Hall.","pid":"","who":"both","kind":"paseo","note":""},{"t":"14:45","txt":"★★ CRUZAR EL BROOKLYN BRIDGE A PIE — entrada peatonal frente a City Hall. 30-45 minutos hasta Brooklyn con paradas de foto: el skyline de Lower Manhattan de un lado y el Manhattan Bridge del otro. GRATIS y es una de las cosas que un first-timer no debería saltearse.","pid":"","who":"both","kind":"destacado","note":""},{"t":"16:00","txt":"Bajar en DUMBO: la foto del Manhattan Bridge encuadrado en Washington St, el waterfront, y una parada en TIME OUT MARKET (está ahí mismo y JP lo marcó 2): un vermut con el skyline de frente. OJO: el sábado 5 vuelven de día — no repetir de más.","pid":"dumbo","who":"both","kind":"paseo","note":""},{"t":"17:05","txt":"Subte A/C desde High St hasta Fulton St (2 paradas, ~10 min) y 5 min a pie hasta Dey St.","pid":"","who":"both","kind":"logistica","note":""},{"t":"17:30","txt":"★★ MERCER LABS (21 Dey St, frente al Oculus) — 15 salas inmersivas de arte y tecnología de Roy Nachum: proyecciones, sonido espacial, salas interactivas, a su ritmo. Hasta $57 según franja; TIMED TICKET por Fever, reservar el slot de 17:30 antes de viajar. Los domingos abre hasta las 22.","pid":"mercerlabs","who":"both","kind":"destacado","note":""},{"t":"18:50","txt":"Caminar a The Crown: 1,6 km derecho por Park Row hacia Bowery (~20 min) — o R/W City Hall → Canal St si llueve.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:15","txt":"★ The Crown (50 Bowery, piso 21) — rooftop sin cover, EN EL ATARDECER (~19:27): el Manhattan Bridge que acaban de cruzar se enciende de frente mientras cae el sol. Es el ángulo que no da ningún observatorio pago — luz, atardecer y noche en un solo trago.","pid":"thecrown","who":"both","kind":"destacado","note":""},{"t":"20:45","txt":"Cena en el East Village / LES: Katz's abre hasta tarde (a esta hora la cola del domingo ya bajó).","pid":"katzs","who":"both","kind":"comida","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"22:15","txt":"Opcional: Nublu (Avenue C) — jazz experimental y afrobeat hasta tarde. A 14 minutos A PIE de Katz's. Lo marcaron 2 los dos.","pid":"nublu","who":"both","kind":"musica","note":"","trav":"🚶 ~14 min a pie · 1.1 km · estimado"}],"alt":"Si cambian de idea con el festival: Ravi Coltrane toca GRATIS en Tompkins Square de 15 a 19h, a cinco cuadras del almuerzo — pueden ir un rato y cruzar el puente otro día. Y ojo: hoy es la ÚLTIMA función de Moulin Rouge! en Broadway, si la quieren hay que decidir ya. // El cruce del puente conviene NO hacerlo más tarde: después de las 16h de un domingo de verano la pasarela se llena."},{"n":3,"date":"2026-08-31","dow":"Lunes","who":"jp","base":"Ink48 → JGStay SoHo (las valijas viajan con Thais)","title":"JP solo · Midtown total: MoMA, Top of the Rock y Birdland","note":"⚠️ DÍA DE JP SOLO. Thais viaja temprano a New Jersey porque EMPIEZA A TRABAJAR — trabaja del 31 de agosto al 3 de septiembre y no participa de nada de NYC en esos días. Ella hace el checkout y se lleva las dos valijas, así que JP arranca libre y sin equipaje desde las 8. El lunes, que suele ser el peor día en NYC, acá es el mejor: el lobby del Chrysler y el Ford Foundation SOLO abren días hábiles, y Birdland tiene su programa de lunes. El MoMA y Top of the Rock encajan justo hoy porque Thais los marcó 0. El 9/11 se MOVIÓ al jueves para hacerlo completo (memorial + museo + One World Observatory en una sola bajada) — se paga la entrada que el lunes era gratis, pero el circuito queda entero y este día gana el observatorio con luz de tarde. CERRADOS hoy: Morgan, Noguchi, Brooklyn Museum, Studio Museum, Transit Museum. Y LA GRAN NOVEDAD: JP ya no duerme en New Jersey — la noche termina en el JGStay SoHo, y la vuelta nocturna a NJ quedó reducida a UNA sola (el miércoles).","blocks":[{"t":"08:00","txt":"THAIS: checkout de Ink48 y tren temprano a New Jersey con LAS DOS valijas — hoy EMPIEZA A TRABAJAR. No participa de nada de este día. JP sale solo con su bolso de dos noches.","pid":"ink48","who":"th","kind":"logistica","note":""},{"t":"08:10","txt":"JP: checkout y subte N/R/W desde 49 St derecho por Broadway hasta Canal St (~15 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"08:35","txt":"Dejar el bolso en la CONSIGNA del JGSTAY SOHO (recepción 24 h; el check-in formal es a la tarde — confirmar la consigna por mensaje). Liviano el resto del día.","pid":"jgstay","who":"jp","kind":"logistica","note":""},{"t":"09:00","txt":"Subte 6 desde Canal St directo hasta Grand Central (~20 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"09:20","txt":"Desayuno adentro de Grand Central, en el dining concourse o en el Grand Central Market — ya estás dentro del edificio que venís a ver.","pid":"grandcentral","who":"jp","kind":"comida","note":""},{"t":"09:45","txt":"Grand Central Terminal: el techo celeste pintado al revés y la Whispering Gallery frente al Oyster Bar.","pid":"grandcentral","who":"jp","kind":"destacado","note":""},{"t":"10:15","txt":"Lobby del Chrysler Building — art déco puro. SOLO lun-vie 8-18h.","pid":"chrysler","who":"jp","kind":"paseo","note":"","trav":"🚶 ~4 min a pie · 0.2 km · estimado"},{"t":"11:00","txt":"Ford Foundation Atrium — jardín de 12 pisos dentro de un edificio de oficinas. PREINSCRIPCIÓN online antes de las 17h de ayer. Solo se puede del 31/8 al 3/9.","pid":"fordfoundation","who":"jp","kind":"destacado","note":"","trav":"🚶 ~9 min a pie · 0.6 km · estimado"},{"t":"11:55","txt":"New York Public Library: Rose Main Reading Room — se ve perfecta por libre (los tours gratuitos son 11:00 y 14:00 y no coinciden con esta pasada; no hacen falta).","pid":"nypl","who":"jp","kind":"paseo","note":"","trav":"🚶 ~20 min a pie (1.4 km) o 🚇 ~15 min · estimado"},{"t":"12:55","txt":"Almuerzo cerca de Bryant Park.","pid":"bryantpark","who":"jp","kind":"comida","note":""},{"t":"13:45","txt":"★ MoMA — a cinco cuadras de la biblioteca. Van Gogh, Picasso, Rothko, Warhol. El cine está INCLUIDO en la entrada. QUÉ HAY AHORA (verificado 27/8): «Frida and Diego: The Last Dream» — seis pinturas de Frida y una docena de Rivera, montaje del escenógrafo de la ópera de Frida. Cierra el 12 de septiembre, seis días después de que se van. Y engancha con la ópera gratis del domingo 6 en Lincoln Center, que es esa misma obra.","pid":"moma","who":"jp","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"16:30","txt":"Caminar cuatro cuadras: Rockefeller Center a nivel de calle — la plaza, Atlas y St. Patrick's enfrente, sobre la Quinta.","pid":"","who":"jp","kind":"paseo","note":""},{"t":"17:15","txt":"Cena TEMPRANA en Midtown. Hoy se cena ANTES de subir: la noche está tomada por el arco del observatorio y Birdland. Las valijas viajan con Thais y el bolso ya espera en SoHo.","pid":"","who":"jp","kind":"comida","note":""},{"t":"18:15","txt":"★★ TOP OF THE ROCK — EL ARCO COMPLETO que pidieron: entrada 18:15 con luz plena, el atardecer ~19:28 desde arriba, y la ciudad encendiéndose hasta ~20:05. Es el ÚNICO observatorio con el Empire State dentro del encuadre y Central Park del otro lado. ⚠️ La franja de atardecer es la cara (~$57-65) y la que primero se agota: reservar YA. Thais lo marcó 0: es de hoy.","pid":"topofrock","who":"jp","kind":"destacado","note":""},{"t":"20:10","txt":"Caminar a Birdland: 12 minutos (50th y 6ª → 44th entre 8ª y 9ª).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"20:30","txt":"★ BIRDLAND: Vince Giordano & the Nighthawks — jazz de los años 20 y 30 con instrumentos de época. Institución de los lunes, y el lunes Broadway está oscuro. Birdland está a 8 cuadras de Penn Station.","pid":"birdland","who":"jp","kind":"destacado","note":""},{"t":"22:40","txt":"Birdland ENTERO y sin mirar el reloj: ya NO hay tren que atrapar. Subte A/C/E desde 42 St-Port Authority hasta Canal St (~15 min) y check-in en el JGStay. La noche pasó de terminar 00:35 en New Jersey a ~23:30 en SoHo.","pid":"jgstay","who":"jp","kind":"logistica","note":""}],"alt":"SIN TREN, el lunes cambió de naturaleza: Birdland completo, sobremesa incluida. Si queda pila, el JGStay está a 15-20 min a pie del Village y Smalls tiene jam de lunes hasta tarde. Y si el día pesó, SoHo a las 23:30 es una hora y cinco más de sueño que el plan viejo."},{"n":4,"date":"2026-09-01","dow":"Martes","who":"jp","base":"JGStay SoHo","title":"JP solo · el MET, The Cloisters y la noche del Village","note":"Thais marcó el MET y The Cloisters en 0, así que este es EL día para hacerlos — y el martes es de los pocos que sirven: cierran los miércoles. El mismo ticket de $30 cubre los dos museos el mismo día, así que The Cloisters sale gratis. Thais sigue trabajando en New Jersey, así que hoy también es día de JP solo. CERRADOS hoy: Whitney, Frick, Noguchi, Brooklyn Museum, 9/11, MoMA PS1, Transit Museum y Studio Museum — por eso el martes es día de MET, que abre.","blocks":[{"t":"08:20","txt":"Desayuno INCLUIDO en el JGStay (7-9 AM) — primera mañana del viaje sin tren ni madrugón: el MET abre 10:00 y Canal St está en la puerta.","pid":"jgstay","who":"jp","kind":"comida","note":""},{"t":"09:10","txt":"Subte 6 directo desde Canal St hasta 86 St (~35 min): se llega justo a la apertura del MET.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"10:00","txt":"★★ THE METROPOLITAN MUSEUM OF ART — es inagotable, así que elegí DOS alas y hacelas bien: egipcio + pintura europea, o armas y armaduras + arte islámico. $30 (el pay-what-you-wish es solo para residentes de NY y estudiantes de NY/NJ/CT). QUÉ HAY AHORA (verificado 27/8): «Musical Bodies» en la Galería 199 —130 objetos sobre instrumentos y cuerpo, la primera muestra grande del Met sobre el tema— y «Costume Art» en las galerías de moda nuevas. ⚠️ El CANTOR ROOF GARDEN, la terraza con vista a Central Park que recomiendan todas las guías, está CERRADO desde 2025 y reabre en 2030: no existe en este viaje.","pid":"met","who":"jp","kind":"destacado","note":""},{"t":"13:15","txt":"Almuerzo RÁPIDO cerca del MET (30-40 min): hoy la tarde tiene museo con hora de cierre.","pid":"","who":"jp","kind":"comida","note":""},{"t":"13:50","txt":"Al Cloisters: NO hay tren A en el lado este — la ruta real en subte es M86-SBS cruzando el parque + B/C hasta 168 St + A hasta 190 St (~55 min). El taxi/Uber directo (~25 min, $28-35) compra 40 minutos de museo: hoy se justifica.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"14:30","txt":"★ THE MET CLOISTERS — arte medieval en un edificio armado con claustros franceses reales, sobre un acantilado del Hudson. INCLUIDO en el ticket del MET del mismo día: guardá el sticker.","pid":"cloisters","who":"jp","kind":"destacado","note":""},{"t":"17:00","txt":"Fort Tryon Park — el Hudson y los Palisades sin un solo edificio a la vista. Media hora honesta: el parque ya rodea al Cloisters, y la noche de hoy tiene tres paradas.","pid":"forttryon","who":"jp","kind":"paseo","note":"","trav":"🚶 ~5 min a pie · 0.3 km · estimado"},{"t":"17:30","txt":"Tren A desde 190 St directo hasta W 4 St-Washington Sq (~35 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"18:10","txt":"Washington Square Park (JP lo marcó 2): el arco, los músicos y las mesas de ajedrez al caer la tarde. Veinte minutos.","pid":"washingtonsq","who":"jp","kind":"paseo","note":""},{"t":"18:35","txt":"Bajar MacDougal St — la cuadra folk de los 60s (Caffe Reggio, el viejo Gaslight) — hasta Houston: 8-10 min y es paseo, no traslado.","pid":"","who":"jp","kind":"paseo","note":""},{"t":"18:45","txt":"★★ HAMBURGER AMERICA (155 W Houston St) — MUST de JP: el counter de George Motz, el historiador de la hamburguesa americana. Pedir la fried-onion burger estilo Oklahoma y mirar el griddle trabajar. ~$15-20. SIN RESERVAS, orden de llegada — un martes 18:45 la fila es manejable, y el counter rota rápido.","pid":"hamburgerica","who":"jp","kind":"destacado","note":"","trav":"🚶 ~10 min a pie · 0.8 km · estimado"},{"t":"19:40","txt":"Paseo por el West Village sin plan: Bleecker, Grove, Bedford. La única grilla rota de Manhattan, y de noche es cuando mejor está.","pid":"westvillage","who":"jp","kind":"paseo","note":"","trav":"🚶 ~11 min a pie · 0.8 km · estimado"},{"t":"20:30","txt":"★ SMALLS JAZZ CLUB (183 W 10th St) — sótano de 60 asientos, la escena real de Nueva York tocando para el barrio. $25 con un trago; la jam de madrugada es de las mejores de la ciudad. Se entra por orden de llegada: llegar 20:15 asegura lugar. Mezzrow está enfrente si Smalls está lleno.","pid":"smalls","who":"jp","kind":"destacado","note":""},{"t":"22:30","txt":"Caminar al JGStay: 20-25 min cruzando el Village y SoHo, que a esta hora es el mejor paseo del viaje. O subte 1 desde Christopher St a Canal.","pid":"jgstay","who":"jp","kind":"logistica","note":""}],"alt":"El MET y The Cloisters el mismo día son ~6 horas de museo. Si es demasiado: hacé solo el MET hasta las 15h y usá la tarde para Inwood Hill Park (el único bosque primario que queda en Manhattan, con cuevas de los Lenape), que está tres paradas más al norte. El Tenement Museum quedó afuera: los dos lo bajaron a 'quizás'."},{"n":5,"date":"2026-09-02","dow":"Miércoles","who":"jp","base":"JGStay SoHo (YA NO se vuelve a New Jersey)","title":"JP solo · High Line al amanecer, Historia Natural, Frick a voluntad, MoMA y McBride en Central Park","note":"REARMADO EL 1/9, SEGUNDA PASADA. Juan sacó el Vessel (del High Line quiere SOLO la caminata) y con eso se liberaron casi dos horas: ahora entran los TRES museos que no se podían soltar. El día pasó de apretado a encastrado, y el que lo hace posible es el Vessel que se fue. LA LLAVE DEL DÍA es la ventana pay-what-you-wish del FRICK, miércoles 13:30-17:30, la única de la semana: el plan la toma a las 13:30 EN PUNTO, apenas abre, y de ahí sale con tiempo para el MoMA antes de que cierre a las 17:30. Los tres horarios encajan sin margen para improvisar: AMNH abre 10:00, Frick a voluntad 13:30, MoMA cierra 17:30. Correrse media hora en el primero se paga en el último. ⚠️ HAY QUE COMPRAR EL TICKET DEL FRICK HOY: online el mínimo son $5 y GARANTIZA la entrada; en persona se puede pagar menos pero sin garantía de lugar, y un miércoles de septiembre a las 13:30 es la hora pico de la ventana. Por $5 no vale el riesgo de quedarse afuera. EL ALMUERZO SE RESIGNA, por decisión de Juan: se come algo de parado cruzando Central Park entre el museo y el Frick. Es la media hora que hace entrar todo. EL VESSEL NO SE PIERDE: está el viernes con Thais, que lo tiene 2/2 — sacarlo hoy lo mueve, no lo borra. Y como ya no hay tren a New Jersey, el SummerStage se ve entero. CERRADO hoy: el MET (por eso fue ayer).","blocks":[{"t":"06:40","txt":"Salir del JGStay. Subte 1 desde Canal St hasta Christopher St, o A/C/E hasta 14 St (~12 min). Hoy se pierde el desayuno incluido del hotel (7-9 AM): se desayuna a media mañana en el Upper West Side, antes de que abra el museo.","pid":"jgstay","who":"jp","kind":"logistica","note":""},{"t":"07:00","txt":"★★ THE HIGH LINE AL AMANECER — abre 7:00 y esta es LA hora: vacío, con el sol bajo entre los edificios y sin las hordas de la tarde. Entrar por Gansevoort St (extremo SUR) y caminar los 2,3 km hacia el norte, sin apuro: hoy hay casi dos horas para hacerlo lento. Incluye el Buda de arenisca de 9 metros de Tuan Andrew Nguyen. SI QUIERE SUMAR 20 MINUTOS: Little Island está a 5 min de la entrada de Gansevoort y también abre temprano (6:00).","pid":"highline","who":"jp","kind":"destacado","note":""},{"t":"08:50","txt":"Subte al Upper West Side: A/C desde 34 St-Penn Station hasta 81 St-Museum of Natural History, directo y sin transbordo (~20 min). El High Line termina justo ahí arriba.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"09:20","txt":"Desayuno en el Upper West Side, sobre Amsterdam o Columbus, a metros del museo. Acá se llena el hueco hasta que abra el AMNH y se recupera el desayuno del hotel que se perdió por madrugar.","pid":"","who":"jp","kind":"comida","note":""},{"t":"10:00","txt":"★ AMERICAN MUSEUM OF NATURAL HISTORY — ENTRAR A LA APERTURA, 10:00 en punto: son 2h45 y el día no da más. Dinosaurios (4º piso, lo mejor), la ballena azul y el Gilder Center nuevo de Studio Gang. $37. Thais lo marcó 0: es de hoy o no es. A las 12:45 hay que estar saliendo.","pid":"amnh","who":"jp","kind":"destacado","note":""},{"t":"12:45","txt":"ALMUERZO DE PARADO cruzando Central Park — 1,3 km a pie, unos 18 min: bajar por Central Park West hasta la 72, cruzar el parque por Terrace Drive y salir a la Quinta. Comprar algo antes de entrar (hay carritos en CPW, o el café del propio museo) y comerlo caminando: esta media hora es la que hace entrar los tres museos. Al Frick no se entra con comida.","pid":"","who":"jp","kind":"comida","note":""},{"t":"13:30","txt":"★ THE FRICK COLLECTION, A VOLUNTAD — 13:30 EN PUNTO, cuando arranca la ventana pay-what-you-wish de los miércoles, la única de la semana. Reabrió en 2025 tras cinco años de obra: Vermeer, Rembrandt y Bellini colgados en la mansión del magnate, como en una casa. Es el museo más placentero de NYC. TICKET COMPRADO ONLINE ($5 mínimo, garantiza la entrada). 1h45 alcanza bien: es chico a propósito.","pid":"frick","who":"jp","kind":"destacado","note":"","trav":"🚶 ~25 min a pie (1.6 km) o 🚇 ~15 min · estimado"},{"t":"15:15","txt":"Del Frick al MoMA: 1,4 km bajando por la Quinta Avenida, ~18 min a pie, con el Central Park a la derecha y las vidrieras a la izquierda. Es de los mejores paseos de Manhattan y va cuesta abajo. Alternativa si están las piernas cansadas: subte 6 desde 68 St hasta 51 St.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"15:40","txt":"★ MoMA — QUEDÓ PENDIENTE DEL LUNES y hoy es su última chance del viaje: cierra 17:30, así que son 1h50. SIN VUELTAS, DERECHO AL 5º PISO: ahí están la noche estrellada de Van Gogh, Les Demoiselles d'Avignon y los Monet grandes. Si sobra tiempo, el 4º (Warhol, Rothko). QUÉ HAY AHORA: «Frida and Diego: The Last Dream», que cierra el 12 de septiembre. $30. (El viernes gratis de UNIQLO es SOLO para residentes del Estado de NY: no aplica.)","pid":"moma","who":"jp","kind":"destacado","note":""},{"t":"17:35","txt":"Del MoMA a Rumsey Playfield: 1,3 km, ~16 min a pie subiendo por la Quinta y entrando al parque por la 69. Con el cartel de hoy conviene estar temprano.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"18:10","txt":"Entrar a Rumsey Playfield y buscar lugar. Puertas 18:00 y con este cartel se llena: cuanto antes, mejor lugar. LA CENA ES ACÁ — hoy el almuerzo fue de parado, así que esta es la comida de verdad del día: hay puestos adentro, o se compra algo en el camino por la Quinta.","pid":"","who":"jp","kind":"comida","note":""},{"t":"19:00","txt":"★★ SUMMERSTAGE: Christian McBride + SAMARA JOY + Mei Semones — Verve 70 aniversario y Getz/Gilberto. GRATIS, sin ticket, Rumsey Playfield, 19:00-22:00. Y SE VE ENTERO: ya no hay tren a New Jersey que atrapar, que era lo que obligaba a salir corriendo.","pid":"summerstage","who":"jp","kind":"destacado","note":""},{"t":"22:05","txt":"Al JGStay sin apuro: subte B/C desde 72 St hasta W 4 St y caminar, o 1 hasta Canal (~35 min). Dormir en SoHo y no en Branchburg cambia el jueves entero.","pid":"jgstay","who":"jp","kind":"logistica","note":""}],"alt":"LO QUE HAY QUE HACER HOY, ANTES DE DORMIR: comprar el ticket del Frick para mañana 13:30. Son $5 (el mínimo online del pay-what-you-wish) y es lo único que garantiza la entrada. Sin eso, hay que hacer la cola en persona y jugarse a que haya lugar en la hora más pedida de la única ventana semanal. // EL DÍA NO TIENE COLCHÓN, y conviene saber dónde se corta si algo se estira: el que se achica es el MoMA, porque es el último y cierra a las 17:30 pase lo que pase. Salir del AMNH 12:45 no es negociable; salir del Frick 15:15 tampoco. Si el High Line a las 7 resulta demasiado madrugón después de anoche, se puede entrar 8:30 y empezar el día en el museo: el AMNH abre 10:00 igual y nada se mueve — lo único que se acorta es el desayuno. // EL VESSEL SE FUE DE HOY y está bien que así sea: Thais lo tiene 2/2 y está en el plan del viernes, con el High Line y Little Island. Hoy Juan hace solo la caminata, que es lo que quería. // TOP OF THE ROCK: ya no entra en ningún lado. Su gracia es el atardecer y el viernes el SUMMIT —mejor mirador— ya lo tiene reservado. Si igual lo quieren, la única forma es soltar el MoMA de hoy, y el MoMA no tiene otra fecha. // Si el Frick resulta corto y sobran 20 minutos, el Guggenheim está 14 cuadras al norte por la Quinta — pero OJO, la rotonda está en montaje hasta el 17 de septiembre: es entrar a ver el edificio a medio armar."},{"n":6,"date":"2026-09-03","dow":"Jueves","who":"jp","base":"JGStay SoHo → The Beacon","title":"World Trade Center completo · encuentro con Thais en Chelsea Market · check-in y noche de jazz","note":"REARMADO EL 2/9 A LA NOCHE: el encuentro con Thais pasa a las 15:30 EN CHELSEA MARKET, y de ahí van juntos a dejar la valija de ella en The Beacon. Eso reordena toda la tarde. LA MAÑANA NO CAMBIA: Juan sale del JGStay a las 7:30 con desayuno incluido, deja sus maletas en el Beacon antes de las 9 y baja al World Trade Center — memorial, museo y One World Observatory en una sola bajada. OJO: One World es EL MIRADOR DE DÍA a propósito — su vista es el puerto y el agua, que de noche es negra; los arcos de atardecer van en el SUMMIT del viernes. ⚠️ LO QUE SE CAE, Y HAY QUE DECIRLO: el MUSEUM OF THE MOVING IMAGE. Estaba a las 16:30 porque los jueves es gratis de 14 a 18, y era su única ventana del viaje. Desde Chelsea Market son 45 min hasta Astoria y desde el Beacon son 50: con el encuentro a las 15:30 y la valija de por medio, llegarían 25 minutos antes de que cierre. No hay forma de salvarlo sin arrastrar la valija de Thais toda la tarde. Fuera del jueves cuesta $20 por cabeza y no queda otro jueves en el viaje. LO QUE SE GANA: el check-in pasa de las 18:55 a las 16:50, y con eso la tarde deja de ser una carrera. Aparecen tres horas libres en el Upper West Side, que es exactamente donde estaba el cuello de botella: la cena era «rápida y liviana» de 19:15 a 19:55 y ahora es una cena de verdad, con Central Park al atardecer antes. Y EL PENDIENTE DE LAS SALSAS SE RESUELVE SOLO: HEATONIST está DENTRO del Chelsea Market, abierto hasta las 18:45. Se compran en el encuentro, sin desviarse un metro.","blocks":[{"t":"07:30","txt":"Desayuno incluido en el JGStay (7-9 AM) y CHECKOUT con las maletas. Hoy ya no se madruga a las 5:45 en Branchburg: se duerme en SoHo y se sale a las 7:30. Una hora y media más de sueño y un tren menos.","pid":"jgstay","who":"jp","kind":"comida","note":""},{"t":"08:05","txt":"Subte 1 desde Canal St derecho hasta 72 St (~25 min). Con maletas, el 1 es el que conviene: es directo y no hay que hacer transbordo.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"08:35","txt":"★ THE BEACON — dejar las maletas en el bell desk. El check-in formal es a la tarde, con Thais, pero el equipaje se recibe desde temprano. Confirmalo por mail.","pid":"beacon","who":"jp","kind":"destacado","note":""},{"t":"09:05","txt":"Subte 1 directo desde 72 St hasta WTC Cortlandt (~30 min), otra vez sin transbordo. Alternativa: 2/3 express hasta Chambers St y 5 min a pie.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"09:50","txt":"★ 9/11 MEMORIAL (la plaza) — las dos fuentes en las huellas de las torres y el Survivor Tree. Gratis, abierto desde las 8:00. Verlo ANTES del museo ordena la visita.","pid":"","who":"jp","kind":"destacado","note":""},{"t":"10:30","txt":"★★ 9/11 MEMORIAL MUSEUM — $36, TIMED TICKET OBLIGATORIO comprado online antes (el museo no vende en puerta sin reserva). 2 horas largas; es duro y muy bien hecho. Thais lo marcó 0: por eso va en la mañana de JP solo.","pid":"911museum","who":"jp","kind":"destacado","note":""},{"t":"12:45","txt":"★ ALMUERZO EN STONE ST — 10 min a pie desde el museo, hacia el sureste. Calle adoquinada peatonal de 1660, la traza holandesa que sobrevivió al fuego de 1835: mesas afuera, sin autos, entre edificios de piedra. Se come rápido y se sigue. Plan B si llueve o no hay mesa: Hudson Eats o Le District en Brookfield Place, cruzando West St.","pid":"stonest","who":"jp","kind":"comida","note":"","trav":"🚶 ~14 min a pie · 1.1 km · estimado"},{"t":"13:45","txt":"★★ ONE WORLD OBSERVATORY — piso 102, el punto más alto del hemisferio occidental, con el puerto y Brooklyn dominando la vista. $44+fee, ventana de entrada de 15 min: sacar el timed ticket online. HOY SON 65 MINUTOS, no más: a las 14:50 hay que estar bajando, porque el encuentro con Thais es a las 15:30 del otro lado de la ciudad.","pid":"owo","who":"jp","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.2 km) o 🚇 ~15 min · estimado"},{"t":"14:50","txt":"El Oculus en un VISTAZO (5 min) — está de camino al subte, así que no cuesta nada. Después, subte 1 desde WTC Cortlandt hasta 18 St (~12 min) y cuatro cuadras al oeste hasta la Novena.","pid":"oculus","who":"jp","kind":"paseo","note":""},{"t":"15:30","txt":"★★ ENCUENTRO CON THAIS — CHELSEA MARKET (75 Ninth Ave, entre las calles 15 y 16). La antigua fábrica de galletitas Nabisco, donde se inventó el Oreo, convertida en mercado techado de ladrillo. Thais llega con su valija: acá se juntan y de acá se van derecho al hotel. Si ella viene sin almorzar, este es el lugar — hay de todo y se come parado.","pid":"chelseamarket","who":"both","kind":"destacado","note":"","trav":"🚇 ~20 min en subte · 4.5 km (a pie 60 min) · estimado"},{"t":"15:45","txt":"★ HEATONIST — LAS SALSAS PICANTES, y está DENTRO del Chelsea Market: cero desvío. Es la tienda de las salsas de Hot Ones, con barra de degustación para probar antes de comprar. Abierto hasta 18:45. Este era un pendiente de Juan y se resuelve sin mover un dedo del plan.","pid":"heatonistch","who":"both","kind":"paseo","note":""},{"t":"16:15","txt":"Al hotel con la valija: caminar cuatro cuadras al este hasta 18 St y subte 1 directo hasta 72 St (~20 min). El 1 es el que conviene con equipaje — directo, sin transbordo, y para a tres cuadras del Beacon.","pid":"","who":"both","kind":"logistica","note":""},{"t":"16:50","txt":"★ THE BEACON — CHECK-IN FORMAL con Thais, la valija de ella y las maletas de Juan que quedaron a la mañana. Dos horas antes que en el plan viejo: de acá en adelante el día deja de ser una carrera.","pid":"beacon","who":"both","kind":"destacado","note":""},{"t":"17:20","txt":"★ CENTRAL PARK AL ATARDECER — cuatro cuadras al este y ya estás adentro. Entrar por la 72 y Central Park West: Strawberry Fields (el mosaico IMAGINE, a metros del Dakota donde vivía Lennon), bajar a Bethesda Terrace y el lago con los botes. El sol se pone ~19:24, así que esta es la hora buena. Gratis. SI THAIS LLEGA CANSADA de trabajar todo el día, el hotel está a cuatro cuadras: se corta cuando quieran y se pasa derecho a la cena.","pid":"","who":"both","kind":"destacado","note":""},{"t":"18:45","txt":"CENA SIN APURO en el Upper West Side, sobre Broadway, Columbus o Amsterdam. HOY SE PUEDE COMER TRANQUILO: en el plan viejo esto eran 40 minutos de trámite antes de salir corriendo. Ahora hay una hora larga y el Lincoln Center está a diez cuadras caminando.","pid":"","who":"both","kind":"comida","note":""},{"t":"19:55","txt":"★ LINCOLN CENTER DE NOCHE (gratis, 20 min) — OJO, VERIFICADO el 27/8 y cambia lo que van a encontrar: esta noche la Josie Robertson Plaza NO está tranquila. El Met proyecta Tristan und Isolde (actos II y III) a las 20:00 en pantalla gigante, gratis y sin reserva, y despejan la plaza desde las 18:00 para armar 2.500 sillas. Llegan justo cuando arranca. La fuente y los chandeliers siguen ahí, pero con multitud y pantalla. Si prefieren el Lincoln Center vacío, el espejo de agua con el Henry Moore está del lado norte, detrás del Vivian Beaumont, y ahí no hay nadie.","pid":"lincolncenter","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"20:20","txt":"Caminar seis cuadras por Broadway hasta Columbus Circle (~8 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:30","txt":"★★ MO LOUNGE, PISO 35 DEL MANDARIN ORIENTAL (80 Columbus Circle) — el dato del amigo de Juan, con la vista de Central Park entero desde arriba y los cócteles caros que la pagan. Sin reserva se entra, pero temprano es más fácil.","pid":"molounge","who":"both","kind":"destacado","note":""},{"t":"20:55","txt":"Bajar en ascensor: Dizzy's está EN EL MISMO EDIFICIO (10 Columbus Circle, piso 5). Cero calle, cero subte.","pid":"","who":"both","kind":"logistica","note":""},{"t":"21:00","txt":"★ Dizzy's Club — ventanales sobre Central Park detrás del escenario, un piso abajo del cóctel. Set de las 21:00, ~$45. Es el cierre perfecto del primer día de Thais en la ciudad.","pid":"dizzys","who":"both","kind":"musica","note":""}],"alt":"EL MoMI SE PIERDE DEL VIAJE, y conviene tenerlo claro en vez de descubrirlo el sábado. Los jueves es gratis de 14 a 18 y hoy era el único jueves; fuera de eso son $20 por cabeza y no hay hueco en viernes, sábado ni domingo (el domingo es checkout y vuelo). LA ÚNICA FORMA DE SALVARLO sería ir de Chelsea Market derecho a Astoria con la valija de Thais a cuestas: salen 16:15, llegan ~17:00, tienen una hora justa, y después son 50 minutos más hasta el Beacon para llegar 18:50 sin tiempo de nada antes del MO Lounge. Es posible y es feo: cuatro horas de subte con equipaje el primer día de ella. Por eso el plan no lo hace. // SI EL WTC SE ESTIRA: lo primero que se recorta es el One World, que hoy tiene 65 minutos en vez de 85. Llegar tarde al Chelsea Market es lo único que no se puede hacer. // SI PREFIEREN QUEDARSE A LA ÓPERA: el Met proyecta Tristan und Isolde gratis a las 20:00 en la plaza del Lincoln Center, con 2.500 sillas. Verla en serio significa soltar el MO Lounge y Dizzy's, que están en el mismo edificio y ya tienen set a las 21:00. El plan elige el jazz; la ópera queda como opción si el día viene cansado y prefieren sentarse. // LAS SALSAS DE HEATONIST YA ESTÁN RESUELTAS acá dentro, así que la sucursal de Williamsburg deja de ser necesaria: si el sábado en Brooklyn no da el tiempo, no se pierde nada."},{"n":7,"date":"2026-09-04","dow":"Viernes","who":"both","base":"The Beacon","title":"Vessel + High Line, SUMMIT al atardecer y el VANGUARD de a dos","note":"Salieron el West Village, Washington Square y el Whitney; entraron el High Line, THE VESSEL (al pie del arranque, $10 y 45 min), la Morgan (hoy GRATIS 17-20) y SUMMIT — que se movió AL ATARDECER por el pedido de ustedes: entrada 18:10, luz plena, la puesta ~19:21 multiplicada por los espejos de Kusama (es EL lugar de la ciudad para ese momento) y la noche encendida hasta las 20:15. EL PAGO, dicho honesto: la Morgan se hace en una hora entrando 17:00 en punto, y la cena de hoy es un bocado rápido — por eso el almuerzo en Chelsea Market es EL fuerte del día. SALIÓ GRAND CENTRAL: estaba a las 16:20 con el argumento de que JP ya lo vio el lunes y Thais no — pero ella lo tiene en 0, así que eran 40 minutos para alguien que no lo quiere. Sin esa parada tampoco hace falta cortar Chelsea a las 15:50: se sale 16:25 derecho a la Morgan y la tarde de galerías y almuerzo gana una hora larga.","blocks":[{"t":"09:15","txt":"Subte a Hudson Yards.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:40","txt":"La plaza de Hudson Yards mientras abre el Vessel: The Shops y el Shed desde afuera. Sacar el timed ticket de las 10:00 online antes.","pid":"","who":"both","kind":"paseo","note":""},{"t":"10:00","txt":"★ THE VESSEL — la escalera infinita de Heatherwick: 154 tramos, 2.500 escalones, $10. Reabierto con redes; algunos tramos altos hacia el Hudson siguen cerrados, y hay ascensor cada 15 min. Subir es la única forma de entenderla. Si Thais prefiere no subir, la plaza está al pie.","pid":"vessel","who":"both","kind":"destacado","note":""},{"t":"10:50","txt":"★ THE HIGH LINE completo, de norte a sur (2,3 km) — arranca ahí mismo, en 30th y 10ª. Vía ferroviaria elevada convertida en parque lineal. Incluye el Buda de arenisca de 9 metros de Tuan Andrew Nguyen.","pid":"highline","who":"both","kind":"destacado","note":"","trav":"🚶 ~12 min a pie · 0.9 km · estimado"},{"t":"12:20","txt":"Little Island — el parque flotante de Heatherwick sobre 132 macetas de hormigón, al final del High Line. Gratis.","pid":"littleisland","who":"both","kind":"paseo","note":"","trav":"🚶 ~15 min a pie · 1.1 km · estimado"},{"t":"13:00","txt":"Galerías de Chelsea COMPLETAS — W 19th a W 27th entre la 10ª y la 11ª, concentradas en W 24th y W 21st (Gagosian, Pace, Zwirner). Gratis, se entra y se sale. El recorte del Vessel se devolvió: SUMMIT pasó al atardecer y la tarde se estiró.","pid":"","who":"both","kind":"destacado","note":"Abren mar-sáb ~10-18h."},{"t":"14:30","txt":"Almuerzo en Chelsea Market — COMER FUERTE: es la comida grande del día, la cena de hoy es un bocado rápido entre el SUMMIT y el Vanguard. Los Tacos No.1 o Very Fresh Noodles. Ahora hay casi DOS HORAS: sin apuro, y si quedaron galerías de Chelsea sin ver, se vuelve. ★ HEATONIST está ADENTRO de este mismo mercado (12-18:45): más de 100 salsas picantes para probar, con el lineup de Hot Ones. Si el sábado no llegan a la de Williamsburg, esta es la misma cata en menos metros.","pid":"chelseamarket","who":"both","kind":"comida","note":"","trav":"🚶 ~7 min a pie · 0.5 km · estimado"},{"t":"16:25","txt":"A la Morgan: L desde 14 St-8 Av hasta Union Sq y 6 hasta 33 St, o A/C/E hasta 34 St-Penn y siete cuadras a pie (~30 min). Salir 16:25 deja margen para entrar 17:00 EN PUNTO.","pid":"","who":"both","kind":"logistica","note":""},{"t":"17:00","txt":"★ MORGAN LIBRARY — GRATIS los viernes 17-20h: entrar 17:00 EN PUNTO y hacerla en una hora — la biblioteca son tres salas gloriosas (estanterías de nogal, la Biblia de Gutenberg): alcanza. RESERVA OBLIGATORIA, se libera el viernes 28 de agosto. Está a 8 min a pie de One Vanderbilt.","pid":"morgan","who":"both","kind":"destacado","note":""},{"t":"18:00","txt":"Caminar las seis cuadras de la Morgan a One Vanderbilt (~8-10 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"18:10","txt":"★★ SUMMIT ONE VANDERBILT — EL ARCO COMPLETO: entrada 18:10 con luz, el atardecer ~19:21 multiplicado por los espejos infinitos de Kusama, y la noche encendida hasta ~20:15. Ticket ATARDECER $57-63 — es la franja que primero se agota: reservar YA. NO está en ningún pase.","pid":"summit","who":"both","kind":"destacado","note":""},{"t":"20:20","txt":"Bajar AL VILLAGE PRIMERO y cenar allá: 4/5/6 o 7 hasta 14 St-Union Sq y 1 hasta Christopher St (~25 min). Cenar cerca de Grand Central y bajar después llega justo; hacerlo al revés deja margen.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:50","txt":"Cena en el West Village, a cinco minutos del club. El Vanguard NO sirve NADA de comida (lo dicen así: 'ni un maní') y no se permite entrar comida: lo que no cenen ahora, no se cena. 40 minutos alcanzan.","pid":"","who":"both","kind":"comida","note":""},{"t":"21:30","txt":"EN LA PUERTA DEL VANGUARD a las 21:30 EN PUNTO: el acomodo del segundo set arranca a esa hora y los asientos son POR ORDEN DE LLEGADA — la entrada es General Admission, no numerada. Con 123 asientos, los diez minutos de diferencia son estar frente al piano o contra la columna. El ticket lo dice: el acomodo tardío, con entrada o sin ella, queda a criterio del encargado.","pid":"","who":"both","kind":"logistica","note":""},{"t":"22:00","txt":"★★ VILLAGE VANGUARD — JOHN PATITUCCI TRIO con Chris Potter y Brian Blade, SET DE LAS 22:00. Movido acá desde el martes para que vayan LOS DOS (pedido de Juan). El sótano triangular de 1935, 123 asientos, la acústica que grabó a Coltrane. ✔ ENTRADAS COMPRADAS el 26/8: 2 × General Admission $45 (#18741454 y #18741456), a nombre de Juan Pablo Garicoïts. Falta solo el mínimo de UNA CONSUMICIÓN por cabeza en la mesa (vale gaseosa, jugo o agua) — se paga ahí, aceptan tarjeta.","pid":"vanguard","who":"both","kind":"destacado","note":""}],"alt":"⚠️ OJO CON LA MAÑANA, y es nuevo: Juan hizo el HIGH LINE, LITTLE ISLAND y el VESSEL el miércoles temprano, solo. Los tres siguen en el plan de hoy porque THAIS NO LOS VIO —el Vessel además lo tienen 2/2 y es imprescindible— así que sacarlos la perjudica a ella. Decidan en el momento: si Juan la acompaña igual, el High Line de día con ella es otro paseo y no se pierde nada; si prefieren no repetir, esa mañana libera de 9:15 a 13:00 y ahí entran las galerías de Chelsea con calma, o el Whitney, que hoy es gratis de 17 a 22 pero abre 10:30. // EL CANJE DE ESTA NOCHE: para meter el Vanguard con Thais, SALIÓ BILL'S PLACE. No hay otra noche donde entre (Bill Saxton toca solo viernes y sábado, y el sábado está tomado por Peter Luger + el play + el Café Wha). Con las entradas ya compradas y sin cambios ni transferencias, el canje quedó CERRADO: Bill's Place sale del viaje. // EL WHITNEY, con los números verificados el 27/8: gratis todos los viernes de 17:00 a 22:00 (normal $30), y hoy pasan por Meatpacking, que es donde está. Coincide barrio, día y franja. El problema es el reloj y es serio: la Morgan también es hoy 17:00-20:00 y el SUMMIT entra 18:10. Meter el Whitney obliga a recortar el High Line o a soltar la Morgan, que ustedes tienen en 2 y el Whitney en 'quizás'. Si igual lo prefieren, el ticket gratis es OBLIGATORIO y hay que sacarlo antes. Si igual lo prefieren, el ticket gratis es OBLIGATORIO y el Whitney ahora cierra los martes. SI ALGO SALIERA MAL con el acomodo (llegar tarde y que no haya lugar): Mezzrow o Smalls quedan a cuatro cuadras ($25 con bebida, Smalls tiene jam de madrugada los viernes desde la 1:00), o el Blue Note — el 4 y 5 de septiembre toca Chief Adjuah."},{"n":8,"date":"2026-09-05","dow":"Sábado","who":"both","base":"The Beacon","title":"Brooklyn, Peter Luger, un PLAY y Café Wha hasta la madrugada","note":"La gran noche del viaje, rearmada a pedido: el musical SALIÓ y entraron un PLAY de Broadway a las 19:30 y el CAFÉ WHA a las 23:45 — el sótano del Village donde debutaron Dylan y Hendrix, con reserva gratis ya pedida por Eventbrite. La cena temprana en Peter Luger (17:00) ahora existe exactamente para esto: porterhouse → telón → medianoche de soul y funk. Frankel's sigue afuera (a un porterhouse no se llega con un pastrami encima) y Westlight sigue opcional. ⚠️ La noche termina ~1:15-1:30: el domingo no tiene NADA fijo hasta las 16:00.","blocks":[{"t":"08:15","txt":"Salir 8:15: 1/2/3 desde 72 St + transbordo a A/C hasta High St son ~40-45 min REALES. Llegar temprano a DUMBO es la diferencia entre la foto y la cola de fotos.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:00","txt":"★ Brooklyn Bridge Park y DUMBO — muelles reconvertidos con el skyline de Lower Manhattan de frente, y la foto del Manhattan Bridge encuadrado en Washington y Water.","pid":"brooklynbridgepark","who":"both","kind":"destacado","note":""},{"t":"10:30","txt":"Brooklyn Heights Promenade — la postal clásica del skyline sobre el BQE.","pid":"bhpromenade","who":"both","kind":"paseo","note":"","trav":"🚶 ~8 min a pie · 0.6 km · estimado"},{"t":"11:15","txt":"★ NEW YORK TRANSIT MUSEUM — una estación de subte clausurada de 1936 con 20 vagones históricos en las vías originales; se puede subir a todos. $10. Cierra lunes y martes, así que hoy es el día.","pid":"transitmuseum","who":"both","kind":"destacado","note":""},{"t":"12:45","txt":"Almuerzo en Downtown Brooklyn.","pid":"","who":"both","kind":"comida","note":""},{"t":"13:45","txt":"Subte a Williamsburg.","pid":"","who":"both","kind":"logistica","note":""},{"t":"14:15","txt":"★ Domino Park — ex refinería de azúcar; el paseo elevado pasa entre la maquinaria industrial conservada, con el Williamsburg Bridge y Midtown enfrente.","pid":"domino","who":"both","kind":"destacado","note":""},{"t":"15:15","txt":"Paseo por Williamsburg: Bedford Ave, disquerías y vintage. ★ ACÁ ENTRA HEATONIST (121 Wythe Ave, a una cuadra de Bedford): la tienda insignia de salsas picantes, con más de 100 para probar en el local y el lineup completo de Hot Ones. Abre 12-19 todos los días, así que a esta hora está abierta y les queda de camino al Williamsburg Bridge. OPCIONAL si quieren la panorámica: Westlight (piso 22, sin cover, un trago) — lo bajaron a 'quizás'. NO comer nada: lo que viene lo merece.","pid":"heatonistwb","who":"both","kind":"paseo","note":"","trav":"🚶 ~20 min a pie (1.2 km) o 🚇 ~15 min · estimado"},{"t":"16:45","txt":"Caminar por Bedford/Driggs hasta el pie del Williamsburg Bridge (~15 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"17:00","txt":"★★ PETER LUGER (178 Broadway) — el porterhouse for two de 1887, dry-aged en el sótano, con la tocineta gruesa de entrada. ~$160-200 los dos con sides y propina. ⚠️ SIN TARJETAS DE CRÉDITO: efectivo, débito US o cheque — llevar cash. Cena temprana a propósito: el teatro espera. RESERVA EN RESY YA.","pid":"peterluger","who":"both","kind":"destacado","note":""},{"t":"18:45","txt":"A la zona de teatros: subte J desde Marcy Av hasta Essex St y F hasta 42 St-Bryant Park (~35 min con transbordo), o directamente Uber al teatro (~20-25 min, $25-35 — un sábado a la noche el puente puede estar cargado).","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:30","txt":"★★ PLAY DE BROADWAY — mi recomendación: STRANGER THINGS: THE FIRST SHADOW (Marquis, desde ~$76): la maquinaria escénica que ganó el Tony — para quien viene de Mercer Labs, el mismo músculo llevado al teatro. Alternativas esa semana: Harry Potter and the Cursed Child, Paranormal Activity, The Imaginary Invalid. COMPRA FIRME esta semana y verificar el horario real de la función (19:00/19:30/20:00): tiene que terminar ~22:00 para lo que sigue.","pid":"strangerthings","who":"both","kind":"destacado","note":""},{"t":"22:00","txt":"Subte 1 desde Times Sq hasta Christopher St (~15 min) y caminar al corazón del Village.","pid":"","who":"both","kind":"logistica","note":""},{"t":"22:30","txt":"Paseo sin apuro por Bleecker y MacDougal — la esquina folk de los 60s de noche, un café o un trago corto. El único objetivo real: estar en la puerta del Wha a las 23:10.","pid":"","who":"both","kind":"paseo","note":""},{"t":"23:15","txt":"★★ CAFÉ WHA — LLEGAR 23:10-23:15: la reserva de Eventbrite NO garantiza admisión y a las 23:30 EN PUNTO liberan los asientos vacíos al standby. TODOS los de la reserva presentes. Set 2 de la house band 23:45-~1:15: soul y funk a máquina en el sótano donde debutaron Dylan, Hendrix y Springsteen. $20 por cabeza van a la cuenta + consumo. Vuelta: subte 1 Christopher St → 72 St (~25 min) o taxi.","pid":"cafewha","who":"both","kind":"destacado","note":""}],"alt":"SOBRE PETER LUGER: la mesa de las 17:00 es la realista — y ahora es la única que funciona: el play manda. PLAN B si no hay mesa: correr Peter Luger al ALMUERZO del mismo día (12:45). // SI EL CANSANCIO GANA A LAS 22:00: el Café Wha es la pieza sacrificable — la reserva es gratis y no penaliza no ir; el play, pagado, no. // Sigue afuera: Bar LunÀtico y Barbès (Bed-Stuy/Park Slope), sin noche posible."},{"n":9,"date":"2026-09-06","dow":"Domingo","who":"both","base":"The Beacon (checkout) → EWR","title":"Checkout, Central Park, Roosevelt Island, MoMA PS1 y vuelo","note":"El día arranca con el CHECKOUT de The Beacon: hacerlo temprano y dejar las valijas en el bell desk libera el día entero. El vuelo sale 23:40, así que hay margen — pero es el domingo del fin de semana largo de Labor Day, la noche de mayor tráfico del año, y EWR va a estar cargado. Por eso todo queda cerca y se sale con 2h45 de anticipación. EL CAMBIO DEL ÚLTIMO DÍA: entra MOMA PS1 y sale el Guggenheim. Se verificó el 27/8 que la rotonda del Guggenheim está cerrada hasta el 17/9 —no se camina la rampa, que es la razón para ir— y PS1 resultó ser gratis, abierto hasta las 18 los domingos, a 1,2 km de Roosevelt Island y con «Greater New York 2026» en pie hasta el 7/9. Era el último imprescindible que quedaba afuera del viaje. El Guggenheim queda escrito como alternativa por si cambian de idea.","blocks":[{"t":"09:00","txt":"Desayuno SIN despertador temprano: anoche terminó ~1:30 en el Village y lo único con hora fija hoy es el PS1, que cierra a las 18:00. Dormir un poco más está permitido.","pid":"","who":"both","kind":"comida","note":""},{"t":"09:45","txt":"★ CHECKOUT de The Beacon y dejar las valijas en el bell desk. El checkout formal suele ser 11:00-12:00, pero hacerlo antes libera el día.","pid":"beacon","who":"both","kind":"destacado","note":""},{"t":"10:15","txt":"★ CENTRAL PARK cruzando de oeste a este: Bethesda Terrace, el Ramble, Bow Bridge. Se entra por la 72 desde Broadway, a tres cuadras del hotel.","pid":"centralpark","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.5 km) o 🚇 ~15 min · estimado"},{"t":"12:30","txt":"Almuerzo en el Upper East Side, saliendo del parque por la Quinta.","pid":"","who":"both","kind":"comida","note":""},{"t":"13:30","txt":"Bajar a 59 St y 2ª Av: subte 6 desde 68 St-Hunter College (el 4/5 exprés NO para ahí), o caminando por la Quinta si el día está lindo.","pid":"","who":"both","kind":"logistica","note":""},{"t":"13:50","txt":"★ ROOSEVELT ISLAND TRAMWAY ($3, OMNY) — cruza el East River a 76 metros de altura con el Queensboro Bridge al lado. Es la vista de $50 por el precio de un viaje de subte.","pid":"tram","who":"both","kind":"destacado","note":""},{"t":"14:25","txt":"FDR Four Freedoms Park — del teleférico son ~20 min a pie por el borde del río. La última obra de Louis Kahn: granito, plátanos y una sala abierta al río apuntando a Manhattan. Gratis y vacía. Se pasa por las ruinas del Smallpox Hospital.","pid":"fdrpark","who":"both","kind":"paseo","note":""},{"t":"15:05","txt":"SALIR 15:05 de Four Freedoms Park y caminar 15 min al norte por el borde del río ha
