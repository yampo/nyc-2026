sta la ESTACIÓN DEL F, que está en el medio de la isla (Main St y Roosevelt Island Bridge). Hoy NO se vuelve en teleférico: se cruza a Queens por abajo.","pid":"","who":"both","kind":"logistica","note":""},{"t":"15:30","txt":"Subte F, UNA parada: Roosevelt Island → 21 St-Queensbridge (~4 min). Salir y caminar 12-15 min al sur por 21st St / Jackson Ave.","pid":"","who":"both","kind":"logistica","note":""},{"t":"15:45","txt":"★★ MOMA PS1 — el último imprescindible del viaje, y entra gratis. Escuela pública de 1892 reconvertida en el laboratorio del MoMA: lo que no se anima a mostrar en la Quinta Avenida. VERIFICADO el 27/8: ENTRADA GRATUITA para todos, abre domingos 12:00-18:00, y «Greater New York 2026» —la encuesta insignia de la casa, que se hace cada cinco años— sigue en pie hasta el 7 de septiembre, o sea que la agarran por un día. Más el Courtyard Commission de Precious Okoyomon al aire libre. Dos horas holgadas hasta las 17:45.","pid":"momaps1","who":"both","kind":"destacado","note":""},{"t":"17:45","txt":"Del PS1 al hotel: subte 7 desde Court Sq hasta Times Sq y 1/2/3 hasta 72 St, o E/M hasta 53 St (~45 min). Llegan 18:30, justo para las valijas. El vuelo no se toca.","pid":"","who":"both","kind":"logistica","note":""},{"t":"18:20","txt":"◇ SI PREFIEREN EL GUGGENHEIM, sigue estando y este bloque se ignora: pay-what-you-wish domingos 16:00-17:30 (mínimo $1) y entrada rebajada a $16 el resto del horario. ⚠️ PERO la rotonda está CERRADA del 3/8 al 17/9 por el montaje de Taryn Simon: no se camina la rampa —que es la razón para ir— y avisan que puede haber ruido de obra. Quedan las torres 4, 5 y 7 con «Guggenheim Pop» (Lichtenstein, Warhol, Oldenburg, Cattelan) y la colección Thannhauser. Para hacerlo: en vez de cruzar a Queens, teleférico de vuelta y subte 4/5/6 de 59 St a 86 St, y hay que salir del FDR Park 15:05 para entrar 16:00 — la ventana a voluntad va hasta las 17:30 y el museo cierra ahí.","pid":"","who":"both","kind":"paseo","note":"Alternativa, no plan: por eso este bloque no tiene hora de visita ni cuenta como parada."},{"t":"18:30","txt":"Retirar las valijas del bell desk. Cena tranquila cerca del hotel: es la última.","pid":"","who":"both","kind":"comida","note":""},{"t":"19:40","txt":"Salir de The Beacon. Subte 1/2/3 desde 72 St hasta 34 St-Penn Station: ~10 min, $3.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:14","txt":"NJ Transit Penn Station → EWR, llega 20:38. $17,25 (incluye el AirTrain). VERIFICAR el horario dominical en njtransit.com unos días antes.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:45","txt":"AirTrain hasta la terminal: 10-15 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:55","txt":"En terminal. Faltan 2h45 para el vuelo de las 23:40 — correcto para un internacional en el domingo de Labor Day, que es la noche de más tráfico del año en EWR.","pid":"","who":"both","kind":"logistica","note":""}],"alt":"COLCHÓN: si algo se atrasa, el tren siguiente sale 20:55 y llega a EWR 21:16, o sea terminal ~21:35 y 2h05 antes del vuelo. Es el último que yo tomaría. // Si prefieren un último día sin moverse, salteen el teleférico y estiren Central Park hasta el Guggenheim: el parque solo da para toda la mañana y la tarde. Lo que NO conviene hoy es meter algo nuevo y grande. // LO QUE SE PIERDEN POR EL VUELO, y duele: esta noche a las 20:00 el Met proyecta gratis en Lincoln Center «El Último Sueño de Frida y Diego» —la misma Frida de la muestra del MoMA del lunes— y ustedes salen del hotel 19:40 hacia Penn Station. Está a diez cuadras del Beacon. No hay forma de que entre sin poner en riesgo el vuelo. // SI QUIEREN VOLVER AL GUGGENHEIM en vez del PS1: está escrito en el bloque de las 18:20, con los tiempos hechos. Cuesta el último imprescindible del viaje y hay que aceptar que la rampa —la razón para ir— no se camina hasta el 17/9. Tercera opción si ninguna convence: el Whitney también abre los domingos."}],"extras":{"transport":{"ewr_llegada":{"titulo":"EWR → Ink48 · sábado 29 de agosto, 6:00 AM","reco":"Uber Shuttle","opciones":[{"m":"Uber Shuttle ✅","costo":"$20,70 p/p · $41,40 los dos","tiempo":"~75 min terminal a hotel","det":"UN SOLO transporte con las valijas: sin AirTrain, sin transbordo en Penn y sin taxi. Precio fijo por persona y asiento reservado, se pide en la app de Uber. Sale de Terminal B, Zona 5, a ~6 min a pie de llegadas. Horarios del sábado 29: 7:40 y 8:30 a Theatre District (50th y 8ª, 13 min a pie del Ink48); 7:50 y 8:35 a Port Authority (40th y 8ª, 17 min a pie). ⚠️ SALEN CADA 40-50 MIN: si migraciones se estira y pierden el de 7:40, el siguiente llega 9:57 y el día arranca tarde.","total":"$41,40 los dos, sin nada más que pagar"},{"m":"AirTrain + NJ Transit (el plan viejo)","costo":"$17,25 p/p · $34,50 los dos","tiempo":"~55-70 min desde terminal","det":"Precio ÚNICO: ya incluye el fee de AirTrain de $8,75, no se compra aparte. Trenes sábado desde EWR: 6:00, 6:07, 6:43, 7:04, 7:15, 7:25, 7:39 — UNO CADA 10-15 MIN, que es su ventaja real sobre el shuttle. Viaje 26-31 min. Comprar en la app MyTix o en máquina — a bordo cobran $5 de recargo. Llegan al hotel 8:15-8:30, casi una hora antes.","total":"$46,50-52,50 los dos con el taxi de Penn Station al hotel · ES EL PLAN B SI SALEN TARDE DE MIGRACIONES"},{"m":"Taxi oficial de EWR","costo":"~$78-90","tiempo":"45-60 min","det":"Tarifa fija por zona: Ink48 está en la calle 48 = Zona 2 = $65 fijo, + $2 de airport fee + $6,75-15,75 de peajes + $1 por valija. El recargo de hora pico ($10) rige sáb-dom 12-21h, así que a las 6-7 AM NO aplica."},{"m":"Uber / Lyft","costo":"$70-110 (estimado)","tiempo":"45-60 min","det":"A las 7 AM de un sábado el tráfico es liviano. Ink48 está dentro de la zona de congestion pricing (sur de la calle 60): hay recargo adicional."},{"m":"Newark Airport Express ❌","costo":"$18-19 (NO CONFIRMADO)","tiempo":"60-80 min","det":"No aporta nada frente al tren: más caro, más lento, sujeto al tráfico del Lincoln Tunnel, y deja en Port Authority a 15 min caminando del hotel. Las fuentes se contradicen sobre el precio."}],"secuencia":"Aterrizan 6:00 → migraciones y equipaje 45-75 min → 6 min a pie a la Zona 5 de Terminal B → Uber Shuttle 7:40 → Theatre District 8:54 → 13 min a pie → hotel ~9:10. Total ≈ 3h desde que tocan pista, con UN solo transporte. Con el plan viejo llegaban 8:15-8:30 pero cambiando tres veces de vehículo con las valijas.","alerta":"El shuttle sale cada 40-50 minutos, no cada 10: mirá el horario en la app de Uber apenas aterricen y, si se estiró migraciones, pasate al tren sin dudar. El AirTrain de Newark está en obra de reemplazo hasta 2030. El servicio por bus solo aplica días de semana de 5:00 a 15:00 — sus dos vuelos caen en fin de semana, así que están cubiertos. Igual reverifiquen 2-3 días antes en njtransit.com."},"ewr_salida":{"titulo":"The Beacon → EWR · domingo 6 de septiembre, vuelo 23:40","reco":"Subte 1/2/3 + NJ Transit — $20,25 total","opciones":[{"m":"Subte + NJ Transit ✅","costo":"$20,25","tiempo":"~55 min + AirTrain","det":"1/2/3 desde 72 St (a 3 cuadras del hotel) hasta 34 St-Penn Station, directo, ~10 min, $3. Después NJ Transit a EWR, $17,25. Trenes domingo: 19:51→20:12, 20:03→20:26, 20:07→20:31, 20:14→20:38, 20:55→21:16.","total":"Salir del hotel 19:40 → tren de 20:14 (llega 20:38) → AirTrain → en terminal ~20:55, con 2h45 de margen. Colchón: el de 20:55 deja en terminal ~21:35, 2h05 antes."},{"m":"Taxi amarillo desde Manhattan","costo":"$95-120","tiempo":"50-75 min","det":"OJO: saliendo de Manhattan NO rige la tarifa fija por zonas (esa es solo para taxis que salen de EWR). Se cobra medidor + recargo Newark de $20 + peajes + congestion charge."},{"m":"Uber / Lyft","costo":"$70-110 + riesgo alto de surge","tiempo":"50-75 min","det":"El domingo 6/9 es el domingo del fin de semana largo de Labor Day: el día de mayor tráfico de retorno del año. Riesgo real de surge y de demora."}],"alerta":"El domingo 6 es el domingo del fin de semana largo de Labor Day: la noche de mayor tráfico de retorno del año. Eso castiga fuerte a todo lo que vaya en auto y no afecta al tren, así que esta noche puntual el tren no es solo más barato sino más confiable. Pero EWR va a estar cargado: por eso salimos con 2h45 y no con las 2h de siempre."},"nj_nyc":{"titulo":"Bridgewater/Branchburg NJ ↔ Manhattan · 31 ago al 3 sep","reco":"Estación RARITAN + pasajes sueltos + Uber al tren","hotel":"Residence Inn Bridgewater Branchburg, 3241 US-22 East. NO TIENE SHUTTLE (confirmado por Marriott). Estacionamiento propio gratis.","estaciones":[{"e":"Raritan ✅","dist":"6,4 km / 4,0 mi","park":"$4/día","serv":"Completo. Es cabecera: siempre hay asiento."},{"e":"Somerville","dist":"8,1 km / 5,0 mi","park":"$5/día (garage Robeson St)","serv":"Completo. Resta 3 min de viaje pero está 1 milla más lejos."},{"e":"North Branch ❌","dist":"1,7 km / 1,0 mi","park":"GRATIS, 40 lugares","serv":"SOLO horas pico. Es la más cercana pero no sirve."},{"e":"Bridgewater","dist":"13,2 km / 8,2 mi","park":"$4/día","serv":"Completo, pero es la más lejana del hotel."}],"tarifas":[{"t":"Pasaje suelto Raritan → NY Penn","p":"$18,50","nota":"PLAN CONFIRMADO: JP hace 4 tramos = $74 (ida el 1, vuelta el 2, ida el 3, más la vuelta del 31). Thais hace 2 = $37. Total $111 ← LA OPCIÓN MÁS BARATA"},{"t":"Round-trip","p":"$37,00","nota":"Exactamente 2 × $18,50. NO hay descuento."},{"t":"10-trip","p":"$185,00","nota":"Exactamente 10 × $18,50. Más caro y sobran 2 viajes."},{"t":"Pase semanal","p":"$164,00","nota":"Más caro que 8 pasajes sueltos."},{"t":"FlexPass (20 viajes one-way)","p":"$314,50","nota":"El ÚNICO producto con descuento real: 15% off, válido 30 días. Pero son 20 viajes y ustedes hacen 8 — no sirve para este viaje."},{"t":"Bus 114/117 a Port Authority","p":"$15,80","nota":"$22 más barato en total, pero 45 min más por tramo. No compensa."}],"horarios":"MAÑANA (Raritan → NY Penn, todos con transbordo en Newark): 4:31→5:59, 6:23→7:37, 6:42→8:05, 6:55→8:20, 7:13→8:31. NOCHE (NY Penn → Raritan), verificado para el miércoles 2/9/2026: 19:42 con transbordo → 21:12 · 20:48 DIRECTO → 22:04 · 21:48 DIRECTO → 23:10 · 22:48 DIRECTO → 00:04 · 00:05 con transbordo → 01:31 · 01:00 con transbordo → 02:35 (último). Viaje 75-90 min.","oneseat":"8 trenes DIRECTOS por sentido, solo días hábiles. HACIA EL ESTE (Raritan → NY Penn), llegadas a Penn: 10:06, 11:11, 12:07, 13:08, 14:10, 20:14, 21:16, 22:10. HACIA EL OESTE (NY Penn → Raritan), salidas: 10:40, 11:40, 12:45, 13:40, 14:40 y 20:48, 21:48, 22:48. CORRECCIÓN: yo había dicho que los directos eran solo de valle — es falso, los TRES trenes de la noche son directos y son justo los que ustedes van a usar. El resto del día (pico y madrugada) todos los trenes del RVL nacen o terminan en Newark Penn y hay que transbordar. El motivo: el RVL no está electrificado al oeste de Newark. Los fines de semana NO hay directo. Verificado en el PDF oficial de NJ Transit y en el feed GTFS para el 2 de septiembre de 2026.","aviso_variantes":"Esta comparativa asume el escenario máximo (ida y vuelta los 4 días). EL PLAN CONFIRMADO es más chico: JP hace 4 tramos de tren y 4 Ubers (~$146), Thais 2 y 2 (~$73). La tabla sirve para elegir ENTRE opciones, no para el total.","comparativa":[{"esc":"① Uber ↔ Raritan + tren ✅ (PLAN REAL)","calc":"$111 tren (6 tramos entre los dos) + $108 Uber (6 tramos)","tot":"~$219 los dos"},{"esc":"② Bus 114/117 + Uber","calc":"$126,40 bus + $128-176 Uber","tot":"$254-302 (pero +45 min por tramo)"},{"esc":"③ Auto de alquiler + park&ride","calc":"$160-300 alquiler + $16 parking + nafta + $148 tren","tot":"$329-469 ❌"},{"esc":"④ Auto hasta Newark Penn + PATH","calc":"$160-300 alquiler + $80-120 parking + $26 PATH","tot":"$266-446 ❌"}],"letra_chica":"Desde julio de 2026 los pasajes one-way de NJ Transit VENCEN a los 30 días de comprados. Y la mayoría de los trenes del Raritan Valley Line terminan en Newark Penn: el pasaje cubre el transbordo, pero el tiempo real de puerta a puerta es 70-90 minutos, no el de un tren directo.","veredicto_auto":"NO conviene alquilar auto solo para llegar a la estación: sale $70-160 más caro que el Uber y sumás manejar, estacionar y devolver. Solo tiene sentido si van a usar el auto para otra cosa. Y NO manejes hasta PATH: son ~35 millas por la Ruta 78/22 en hora pico (45-70 min por tramo, o sea 1,5-2,5 h diarias al volante) y PATH te deja en downtown, no en Midtown.","riesgo":"DOS RIESGOS. (1) EL HUECO DE LAS 22:48: si perdés ese tren, la próxima llegada a Raritan es a la 01:31, o sea 87 minutos después. No hay NADA en el medio. El de las 22:48 es el tren crítico de las dos noches que volvés a New Jersey. (2) Branchburg es zona semi-rural: la disponibilidad de Uber a las 6-7 AM puede ser baja y las esperas largas. Pedí el auto la noche anterior y tené plan B. AVISO: NJ Transit publica cambios por obras con ~2 semanas de anticipación — revisá njtransit.com/travel-alerts-to unos días antes."},"nyc_interno":{"titulo":"Moverse dentro de NYC","cambio_clave":"EL METROCARD SE ELIMINÓ. Desde el 1 de enero de 2026 no se puede comprar ni recargar, y los pases de 7 y 30 días ilimitados ya no existen. No hay decisión que tomar: se usa OMNY.","tarifa":"$3,00 por viaje de subte o bus local (subió de $2,90 en enero 2026). Bus express $7,25.","capping":"Fare capping de OMNY: una vez que gastaste $35 en pasajes dentro de una ventana móvil de 7 días, el resto de esos 7 días viajás gratis. La regla es el MONTO ($35), no la cantidad de viajes — que den ~12 es aritmética ($3 × 11 = $33 y el viaje 12 cobra $2 hasta llegar a $35). La ventana arranca con el PRIMER tap, no el lunes. Los buses express, el AirTrain de JFK y los transbordos NO suman al tope.","critico":"Hay que usar SIEMPRE EL MISMO plástico o dispositivo los 7 días. Si un día tapean con el celular y otro con la tarjeta física, el contador se parte en dos y nunca llegan al tope. Cada persona necesita su propio medio: no se puede tapear dos veces con la misma tarjeta. Y ojo con la tarjeta extranjera: cada tap puede generar comisión por consumo en el exterior — conviene una tarjeta sin esa comisión, o crear una cuenta OMNY.","cuenta":"9 días en NYC = dos períodos de 7 días. Con uso intensivo, el techo es $35 + $35 = $70 por persona en todo el viaje. Con uso liviano pagan solo lo que usan: OMNY nunca cobra de más.","hoteles":[{"h":"Ink48 (48th & 11th Ave)","s":"50 St (C,E) a ~12 min caminando hacia el este. Es un hotel notoriamente lejos del subte."},{"h":"The Beacon (Broadway & 75th)","s":"72 St (1,2,3) a 3 cuadras, 79 St (1) a 4. Directo a Penn Station en 10 min."}]}},"passes":{"veredicto":"TICKETS INDIVIDUALES. Ningún pase les cierra, y ahora está calculado por separado para cada uno: a Juan la mejor ventana posible le hace perder $60 y a Thais $97. El ahorro real de este viaje está en el calendario gratuito, no en los pases.","por_persona":{"titulo":"The New York Pass, calculado por separado para cada uno (28/8)","nota":"Los días del pase son CONSECUTIVOS desde el primer uso y cada uno termina a medianoche — no son días flexibles, aunque la página principal lo sugiera. Eso manda todo el cálculo, porque las atracciones caras de este viaje caen salteadas.","gente":[{"quien":"Juan Pablo — 9 días en Nueva York","cubre":"$271 en total: dom 30 $72 (Eldridge + Mercer Labs) · lun 31 $72 (MoMA + Top of the Rock) · mié 2 $37 (Historia Natural) · jue 3 $80 (9/11 + One World) · vie 4 $10 (Vessel)","mejor":"Se probaron las 45 ventanas consecutivas posibles. La mejor es dom 30 → lun 31: cubre $144 y el pase de 2 días cuesta $219. PIERDE $75. Con el Top of the Rock en franja atardecer ($57 en vez de $42) pierde $60, que es lo menos malo que da el cálculo.","otras":"5 días (dom 30 → jue 3): cubre $261, cuesta $359, pierde $98. Un solo día (jue 3): cubre $80, cuesta $169, pierde $89.","veredicto":"NO CONVIENE. Para empatar el de 5 días habría que sumar el Empire State ($49) Y el Intrepid ($38) a días que ya van de 8:00 a 22:40 — y empatar no es ganar."},{"quien":"Thais — no está en NY del 31/8 al 2/9 (trabaja en New Jersey)","cubre":"$82 en total: Mercer Labs y Eldridge Street el domingo 30, y el Vessel el viernes 4. Nada más del pase cae en sus días.","mejor":"Un solo día, el domingo 30: cubre $72 contra $169 del pase de 1 día. PIERDE $97.","otras":"Cualquier ventana más larga empeora, porque sus días útiles no son consecutivos: el 31, 1 y 2 está trabajando.","veredicto":"NO CONVIENE, y no está cerca. Para ella ni siquiera hay una ventana discutible."}],"el_agujero":"Dentro de la única ventana que casi funciona para Juan (dom 30 → jue 3), el MARTES 1 no aporta NADA: el MET y The Cloisters, que son todo ese día, no están en el pase. Es un día pago para no usar.","lo_que_nunca_cubre":"De lo que hacen, $585 no los cubre ningún pase: SUMMIT ($44), el MET ($30), Frick ($30), Morgan ($25), MoMI ($20), Studio Museum ($16), Transit Museum ($10), el Vanguard, Birdland, Smalls, Dizzy's, Café Wha, el play de Broadway ($90) y Peter Luger ($110)."},"razones":["El itinerario está construido sobre días gratis y pay-what-you-wish (Whitney viernes, MCNY miércoles, Frick miércoles, Guggenheim domingo, MoMA PS1, MoMI jueves). Nada de eso está en ningún pase, y los pases no lo compensan.","SUMMIT One Vanderbilt y el MET — dos de los ítems más caros y deseados — NO están en NINGÚN pase. Se pagan aparte siempre.","Los precios 'desde' oficiales son bajos si se compra con anticipación (Edge $34 con Advance Saver a 14+ días, Top of the Rock $42, ESB $44). Los pases se calculan contra los precios PICO ($57-69), no contra estos.","El Go City All-Inclusive es de días CONSECUTIVOS: necesitarían ~7 atracciones en 3 días seguidos para amortizarlo, lo que choca de frente con los días de cierre (miércoles cierra el MET, martes cierran Frick y 9/11).","Thais no está en Nueva York del 31/8 al 2/9 —trabaja en New Jersey— así que sus días útiles NO son consecutivos, que es justo lo que el pase exige. En todo el viaje hace $82 de atracciones que el pase cubra, contra $169 del pase más barato."],"opciones":[{"p":"New York CityPASS C3","c":"$116 (con fee)","v":"9 días desde el primer uso","inc":"Elegís 3 de 10: Empire State, Top of the Rock, Statue of Liberty+Ellis, 9/11 Museum, Edge, AMNH, Circle Line, MoMA, Intrepid, Guggenheim","an":"Con ESB + 9/11 + AMNH cubre $117 a precio 'desde'. Ahorro ≈ $1. Solo conviene si compran a último momento a precio pico (ahorro ~$20)."},{"p":"New York CityPASS (5 atracciones)","c":"$164","v":"9 días desde el primer uso","inc":"Obligatorias: Empire State + AMNH. Después 3 de 6: Top of the Rock, 9/11, Statue of Liberty, Circle Line, Intrepid, Guggenheim","an":"El único con ahorro defendible: ~$28 a precio 'desde', ~$47 a precio pico. PERO solo si Circle Line y la Estatua ya estaban en el plan — y en este itinerario no están."},{"p":"Go City Explorer (5 atracciones)","c":"$179","v":"30 días desde la primera atracción","inc":"Elegís entre ~90 atracciones. NO incluye SUMMIT, MET, Tenement, Frick, Vessel.","an":"Ahorro ~$22 + Big Bus Tour gratis (valor hasta $81, promo hasta el 7 de septiembre). Solo vale si de verdad van a usar el bus turístico. Si no, el ahorro es marginal."},{"p":"Go City All-Inclusive (3 días)","c":"$269","v":"3 días CONSECUTIVOS","inc":"Todo lo del Explorer, ilimitado en 3 días seguidos","an":"❌ Necesita ~7 atracciones en 3 días consecutivos. Ritmo agotador y choca con los cierres semanales. No para este viaje."},{"p":"The Sightseeing Pass","c":"—","v":"—","inc":"—","an":"🚫 NO EXISTE MÁS. La empresa suspendió operaciones en junio de 2025; el AMNH le ganó un juicio de $508.474 en marzo de 2026 por entradas impagas. El sitio sigue online. NO COMPRAR."}],"gratis_valor":[{"d":"Miércoles 2/9","q":"MCNY gratis + Frick pay-what-you-wish","v":"$106 (2 personas)"},{"d":"Viernes 4/9","q":"Whitney gratis 17-22h","v":"$60 (2 personas)"},{"d":"Viernes 4/9","q":"Morgan Library gratis 17-20h (reserva el 28/8)","v":"$50 (2 personas)"},{"d":"Viernes 4/9","q":"Noguchi gratis (primer viernes)","v":"$32 (2 personas)"},{"d":"Domingo 6/9","q":"Guggenheim pay-what-you-wish 16-17:30","v":"~$32-60 (2 personas)"},{"d":"Jueves 3/9","q":"Museum of the Moving Image gratis 14-18h","v":"$40 (2 personas)"},{"d":"Todo 2026","q":"MoMA PS1 gratis para todos","v":"~$40 (2 personas)"},{"d":"Sáb 29 y dom 30/8","q":"Charlie Parker Jazz Festival","v":"$240+ (equivalente en club)"},{"d":"Miércoles 2/9","q":"SummerStage: Christian McBride","v":"$120+ (equivalente en club)"}],"total_gratis":"El calendario gratuito de este itinerario vale aproximadamente $700-780 para los dos. Ningún pase se acerca.","comprar_ahora":["Edge con tarifa Advance Saver ($34): exige 14+ días de anticipación. Si lo quieren, hay que comprarlo ya.","Village Vanguard (Patitucci/Potter/Blade, 1-6 sep): 123 asientos, se agota.","Tenement Museum: los tours se agotan y no hay reembolso ni cambio.","Estatua de la Libertad corona: se agota MESES antes. Para Labor Day weekend probablemente ya no haya.","Morgan Library viernes gratis: la reserva se abre el viernes 28 de agosto, una semana antes."]},"reservas":[{"q":"Village Vanguard — VIERNES 4/9, set de las 22:00 (Patitucci/Potter/Blade), DOS lugares","cuando":"COMPRADAS 26/8","url":"2 x GA $45 - #18741454 y #18741456","hecho":true,"por":"LISTO. A nombre de Juan Pablo Garicoits, $90 en total. Lo que queda del dia: son asientos POR ORDEN DE LLEGADA (el acomodo del 2do set abre 21:30, no 22:00) y hay minimo de una consumicion por cabeza. No sirven comida: cenar antes.","urg":0},{"q":"MO Lounge (Mandarin Oriental, piso 35) — JUEVES 3/9 ~20:30, antes de Dizzy's","cuando":"1 semana antes","url":"mandarinoriental.com (SevenRooms)","por":"Ventanales sobre Central Park y está en el MISMO edificio que Dizzy's: se baja en ascensor. Coctel ~$26-32, sin cover. Alternativa en el mismo piso: The Bar (mar-sáb 17-1h, 45 asientos).","urg":2},{"q":"Birdland LUNES 31/8 — Vince Giordano & the Nighthawks, set 20:30","cuando":"YA","url":"birdlandjazz.com","por":"Es ancla fija del lunes y era la ÚNICA ancla sin ítem en este checklist (lo detectó la auditoría). Los lunes de Giordano se llenan.","urg":3},{"q":"PLAY de Broadway sáb 5/9 — COMPRA FIRME esta semana (Stranger Things: The First Shadow, o HP/Paranormal Activity/Imaginary Invalid)","cuando":"esta semana","url":"Telecharge / TodayTix","por":"Reemplaza al musical (pedido de Juan). Desde ~$76. ⚠️ Al comprar, VERIFICAR el horario de la función del sábado (19:00/19:30/20:00): tiene que TERMINAR ~22:00 para llegar al Café Wha 23:10.","urg":3},{"q":"CAFÉ WHA sáb 5/9 — reserva GRATIS por Eventbrite (Set 2, 23:45)","cuando":"YA (la venta cierra el 5/9 y los cupos antes)","url":"eventbrite.com (The Cafe Wha? House Band - Saturday Set 2)","por":"Es SOLO reserva, no entrada: TODOS presentes a las 23:30 o liberan los asientos al standby. $20 de music charge por cabeza en la cuenta + consumo. Grupos >10: contact@cafewha.com.","urg":3},{"q":"Dizzy's JUEVES 3/9 21:00 — solo si deciden mantenerlo","cuando":"2-3 días antes","url":"jazz.org/dizzys","por":"Entradas con horario. CONDICIONAL: es la noche del día de ~17 horas con 5 de sueño — decidan a las 20:00 de ese día; la reserva flexible o el set Late Night (~22:45) son las opciones de bajo riesgo.","urg":1},{"q":"Dos mails operativos: early check-in Ink48 (para el sáb 29) y luggage drop en The Beacon desde las 8:45 (jue 3)","cuando":"esta semana","url":"mail a cada hotel","por":"El día 1 y el día 6 dependen de que los dos hoteles digan que sí. Un mail de dos líneas cada uno.","urg":2},{"q":"✅ RESUELTO — festival Charlie Parker: sáb 29, Marcus Garvey Park, 14:00 a 19:00, cierra JOSHUA REDMAN con Nat Adderley Jr., Catherine Russell y Nicole Glover","cuando":"verificado el 27/8","url":"cityparksfoundation.org","por":"La salida obligada de las 18:30 puede o no cortar el set de cierre. Saberlo el día antes permite decidir el plan B del subte (salir 18:10) con datos.","urg":2},{"q":"Tenement Museum — SOLO SI deciden sumarlo (quedó FUERA del plan)","cuando":"solo si lo suman","url":"tenement.org","por":"Los dos lo bajaron a 'quizás' y no está en ningún día. OJO: es sin reembolso — no reservar algo que no está agendado.","urg":1},{"q":"Edge — tarifa Advance Saver $34","cuando":"YA (exige 14+ días)","url":"edgenyc.com","por":"FUERA del plan (lo marcaron 0/0 en la última pasada). Solo si cambian de idea; con SUMMIT y Top of the Rock ya se solapa mucho.","urg":1},{"q":"SUMMIT — VIERNES 4/9, slot ATARDECER ~18:00-18:15","cuando":"YA","url":"summitov.com","por":"$57-63 la franja de atardecer y es LA que primero se agota. Pedido de ustedes: luz + atardecer (~19:21) + noche en un solo ticket, con los espejos de Kusama en el momento justo.","urg":3},{"q":"Ford Foundation Atrium","cuando":"Antes de las 17h del día anterior","url":"fordfoundation.org","por":"Preinscripción obligatoria. Solo se puede entrar del 31/8 al 3/9 — cierra el 5, 6, 7 y 9 de septiembre.","urg":3},{"q":"Morgan Library — viernes gratis 17-20h","cuando":"VIERNES 28 DE AGOSTO","url":"themorgan.org","por":"Las reservas se liberan exactamente una semana antes. Si no la sacan ese día, no entran gratis.","urg":3},{"q":"Whitney — viernes gratis 17-22h","cuando":"YA (se liberan hasta 5 semanas antes)","url":"whitney.org","por":"OBLIGATORIA: el museo dice explícitamente que se necesita ticket y el cupo es limitado. No se entra caminando. OJO ADEMÁS: desde el 19 de agosto el Whitney volvió a su horario regular y CIERRA LOS MARTES.","urg":3},{"q":"Noguchi Museum — FUERA del plan (0/0)","cuando":"solo si lo suman","url":"noguchi.org","por":"Lo marcaron 0/0: no reservar salvo cambio de idea. (El primer viernes del mes es gratis hasta las 20h, por si acaso.)","urg":1},{"q":"Broadway — loterías digitales","cuando":"TODOS LOS DÍAS desde ya","url":"Broadway Direct, Telecharge, LuckySeat, TodayTix","por":"Entrar es GRATIS. Hamilton $10, Maybe Happy Ending $20,64, MJ/Hadestown/Moulin Rouge $49. Anotarse a 5-6 por día no cuesta nada.","urg":2},{"q":"Moulin Rouge! — últimas funciones","cuando":"URGENTE si la quieren","url":"Telecharge / LuckySeat","por":"Cierra el 30 de agosto. Las funciones de cierre se agotan y se encarecen.","urg":3},{"q":"9/11 Memorial Museum — JUEVES 3/9 ~10:30","cuando":"YA","url":"911memorial.org","por":"$36, TIMED TICKET OBLIGATORIO (el sitio oficial exige compra anticipada). Modificable hasta 24h antes. Movido del lunes gratis al jueves para hacer el WTC completo en una bajada.","urg":3},{"q":"One World Observatory — JUEVES 3/9 ~13:45","cuando":"1-2 semanas antes","url":"oneworldobservatory.com","por":"$44 + $3,50 fee, ventana de entrada de 15 min. Los slots de la tarde se agotan en verano.","urg":2},{"q":"Top of the Rock — LUNES 31/8, slot ~18:00-18:15 (ATARDECER)","cuando":"YA","url":"topoftherocknyc.com","por":"La franja de atardecer es la cara (~$57-65) y la que vuela. Arco completo: luz → atardecer ~19:28 → noche hasta 20:05, y Birdland queda a 12 min a pie.","urg":3},{"q":"PETER LUGER — SÁBADO 5/9 17:00 (Resy)","cuando":"YA MISMO","url":"Resy / peterluger.com","por":"Los sábados se agotan con SEMANAS. Y ojo al pagar: SIN tarjetas de crédito — efectivo, débito US o cheque. Llevar ~$200 en cash. Plan B: almuerzo del mismo sábado.","urg":3},{"q":"Lincoln Center — revisar calendario de la semana 3-6/9 (Atrium gratis, Film at Lincoln Center)","cuando":"1 semana antes","url":"lincolncenter.org","por":"Las salas grandes están entre temporadas (Filarmónica abre 10/9; Met Opera y Ballet después), pero el David Rubenstein Atrium suele tener shows GRATIS entre semana y Film at Lincoln Center proyecta todo el año. Si aparece algo bueno el jueves o viernes, la plaza ya está en el plan del jueves 20:30 y el cambio es trivial.","urg":1},{"q":"Mercer Labs — DOMINGO 30/8, slot 17:30 (Fever)","cuando":"esta semana","url":"mercerlabs.com","por":"Hasta $57 por cabeza según franja; los slots del fin de semana se agotan en Fever. El domingo abre hasta las 22, así que si el 17:30 no está, cualquier slot 17:00-18:00 mantiene la cadena (Crown a   const wd = DOW_IDX[d.dow];
  const usados = {};                     /* agendado en CUALQUIER día: no es novedad */
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const cand = PLACES.filter(p => p.lat && !usados[p.id] && !PASO_FUERA[p.cat]
    && (p.jp > 0 || p.th > 0)            /* lo que los dos bajaron a 0 está descartado */
    && horario(p, wd) !== 'CERRADO');    /* cerrado ese día no es una referencia útil */

  const paradas = paradasDe(d);

  /* PRIMERO lo que está pegado a una parada: si algo está a menos de ACA_RADIO
     de donde vas a estar, la respuesta útil es «lo tenés acá», no «te queda de
     camino». Se lo queda la parada MÁS cercana, y sale del reparto de tramos. */
  const aca = {}, tomadoAca = {};
  paradas.forEach(({b, p: A}) => {
    const a = [A.lat, A.lng];
    const hora = parseInt(String(b.t).slice(0, 2), 10);
    cand.forEach(q => {
      if (!esDesvioPosible(q, hora)) return;
      const dist = hav(a, [q.lat, q.lng]);
      if (dist > ACA_RADIO) return;
      if (!tomadoAca[q.id] || dist < tomadoAca[q.id].dist)
        tomadoAca[q.id] = {p: q, dist, destino: b.id};
    });
  });
  Object.values(tomadoAca).forEach(x => (aca[x.destino] = aca[x.destino] || []).push(x));
  Object.keys(aca).forEach(k => {
    aca[k].sort((x, y) => x.dist - y.dist);
    aca[k] = aca[k].slice(0, ACA_TOP);
  });
  const yaEnAca = {};
  Object.values(aca).flat().forEach(x => { yaEnAca[x.p.id] = 1; });

  /* Qué candidatos tiene cada tramo, ordenados por lo que cuesta pasar. */
  const tramos = [];
  for (let i = 0; i < paradas.length - 1; i++){
    const A = paradas[i].p, B = paradas[i+1].p;
    const a = [A.lat, A.lng], b = [B.lat, B.lng], dab = hav(a, b);
    const hora = parseInt(String(paradas[i+1].b.t).slice(0, 2), 10);   /* a qué hora se pasa */
    const lista = [];
    cand.forEach(p => {
      if (!esDesvioPosible(p, hora)) return;
      const q = [p.lat, p.lng], da = hav(a, q), db = hav(q, b);
      const desvio = da + db - dab;
      const entra = dab <= PASO_CORREDOR
        ? (desvio <= PASO_DESVIO || Math.min(da, db) <= PASO_CERCA)
        : Math.min(da, db) <= PASO_PUNTA;
      if (entra && !yaEnAca[p.id]) lista.push({p, desvio});
    });
    lista.sort((x, y) => x.desvio - y.desvio);
    tramos.push({destino: paradas[i+1].b.id, lista});
  }

  /* El reparto va en DOS vueltas, y el orden importa. Con solo "cada lugar al tramo
     donde menos cuesta", los tramos cortos del mismo barrio quedaban mudos: el
     domingo, el Tenement Museum y compañía se los llevaba el tramo de las 10:30 con
     un metro de desvío, y la caminata por el Lower East Side —que los tiene a todos
     a la vuelta— no mostraba nada.
     Primera vuelta: cada tramo se queda con su mejor candidato todavía libre, así
     ninguno con opciones se queda sin nada. Segunda: el resto se reparte al tramo
     donde menos cuesta. Un lugar sigue apareciendo UNA sola vez por día. */
  const tomado = {}, out = {};
  const poner = (destino, x) => { (out[destino] = out[destino] || []).push(x); tomado[x.p.id] = 1; };
  tramos.forEach(t => {
    const primero = t.lista.find(x => !tomado[x.p.id]);
    if (primero) poner(t.destino, primero);
  });
  const resto = {};
  tramos.forEach(t => t.lista.forEach(x => {
    if (tomado[x.p.id]) return;
    if (!resto[x.p.id] || x.desvio < resto[x.p.id].desvio) resto[x.p.id] = {...x, destino: t.destino};
  }));
  Object.values(resto).forEach(x => poner(x.destino, x));

  Object.keys(out).forEach(k => {
    out[k].sort((x, y) => x.desvio - y.desvio);
    out[k] = out[k].slice(0, PASO_TOP);
  });
  return {paso: out, aca};
}
/* ── Qué hay dentro de un barrio ──────────────────────────────────────────────
   Un bloque de "caminar un barrio" no es una parada: son horas sueltas en un
   polígono. Ahí la pregunta no es "qué queda en el camino" —no hay camino— sino
   "qué tengo alrededor mientras camino".
   Se toma por barrio Y por radio: el `hood` del catálogo es la definición
   administrativa y no siempre coincide con lo que uno camina. */
const BARRIO_RADIO = 700;     /* m alrededor del punto del barrio */
const BARRIO_TOP = 6;
function enElBarrio(pb){
  if (!pb || pb.cat !== 'barrio' || !pb.lat) return [];
  const usados = {};
  S.itin.forEach(x => x.blocks.forEach(b => { if (b.pid) usados[b.pid] = 1; }));
  const c = [pb.lat, pb.lng];
  return PLACES
    .filter(p => p.lat && p.id !== pb.id && !usados[p.id] && !PASO_FUERA[p.cat]
                 && (p.jp > 0 || p.th > 0))
    .map(p => ({p, d: hav(c, [p.lat, p.lng])}))
    .filter(x => x.d <= BARRIO_RADIO || x.p.hood === pb.hood)
    .sort((x, y) => x.d - y.d)
    .slice(0, BARRIO_TOP);
}
/* Los mismos lugares, planos, para pintarlos en el mapa del día. */
function dePasoPlano(d){
  const r = dePasoDelDia(d);
  return Object.values(r.paso).flat()
    .concat(Object.values(r.aca).flat().map(x => ({p: x.p, desvio: x.dist})));
}
/* Las paradas de un día, en orden, sin repetir la misma dos bloques seguidos
   (el hotel al salir y al volver son dos paradas distintas; el mismo lugar en
   bloques pegados, una sola). */
function paradasDe(d){
  const out = [];
  d.blocks.forEach(b => {
    const p = b.pid ? PBY[b.pid] : null;
    if (!p || !amPunto(p)) return;
    if (out.length && out[out.length - 1].p.id === p.id) return;
    out.push({b, p});
  });
  return out;
}
const money = n => n === 0 ? 'gratis' : '$' + n;
const DIAS = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
/* Horario del lugar para un día de la semana (0=lunes). Devuelve null si no hay dato. */
function horario(p, wd){
  if (!p.hrs) return null;
  const w = p.hrs[wd];
  return w ? `${w[0]}–${w[1]}` : 'CERRADO';
}
/* Texto compacto de la semana entera, agrupando días con el mismo horario. */
function horarioSemana(p){
  if (!p.hrs) return '';
  const out = []; let ini = 0;
  for (let i = 1; i <= 6; i++){
    const a = JSON.stringify(p.hrs[i]), b = JSON.stringify(p.hrs[i-1]);
    if (a !== b){ out.push([ini, i-1]); ini = i; }
  }
  out.push([ini, 6]);
  return out.map(([a,b]) => {
    const w = p.hrs[a], r = a === b ? DIAS[a] : `${DIAS[a]} a ${DIAS[b]}`;
    return `${r}: ${w ? w[0]+'–'+w[1] : 'cerrado'}`;
  }).join(' · ');
}
/* ── El reloj ─────────────────────────────────────────────────────────────────
   `new Date().toISOString()` es UTC: en Nueva York (UTC-4) a partir de las 20:00
   locales devolvía el día SIGUIENTE, o sea que todas las noches del viaje —Birdland,
   el Vanguard, Café Wha— la app creía que ya era mañana. Va en hora local.
   `window.__NOW` existe solo para poder probar el "ahora" desde Playwright. */
function NOW(){ return window.__NOW ? new Date(window.__NOW) : new Date(); }
function hoyStr(){ const d = NOW();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
let TODAY = hoyStr();
const minOf = t => /^\d{1,2}:\d{2}$/.test(String(t)) ? (+String(t).slice(0,2))*60 + (+String(t).slice(3,5)) : null;
const minsNow = () => { const d = NOW(); return d.getHours()*60 + d.getMinutes(); };
const hhmmNow = () => { const d = NOW();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const enMin = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m%60 ? ' ' + (m%60) + ' min' : '');

/* ── leadOf: jerarquía, no tijera ─────────────────────────────────────────────
   Los textos del catálogo ya vienen con una estructura: ★ al principio para lo
   destacado, y un separador temprano —" — ", ". " o ": "— entre el QUÉ y el
   POR QUÉ. Se parte ahí. El resto NO se pierde: se muestra entero al desplegar.
   El ":" se exige precedido de algo que no sea dígito para no cortar en "125 St: 12". */
function leadOf(txt){
  let t = String(txt == null ? '' : txt).trim(), star = 0;
  const m = t.match(/^([★☆]+)\s*/);
  if (m){ star = m[1].length; t = t.slice(m[0].length); }
  const cands = [];
  const cab = t.slice(0, 100);
  const e = cab.search(/\s[—–]\s/);       if (e > 6)  cands.push([e, 3]);
  const p = cab.search(/\.\s/);           if (p > 10) cands.push([p, 2]);
  const c = cab.search(/[^\d]:\s/);       if (c > 10) cands.push([c + 1, 2]);
  cands.sort((a, b) => a[0] - b[0]);
  let head, rest;
  if (cands.length){ head = t.slice(0, cands[0][0]).trim(); rest = t.slice(cands[0][0] + cands[0][1]).trim(); }
  else if (t.length > 92){ const sp = t.lastIndexOf(' ', 92);
    head = t.slice(0, sp > 20 ? sp : 92).trim() + '…'; rest = t; }
  else { head = t; rest = ''; }
  return {star, head, rest, full: t};
}
/* El catálogo escribe en MAYÚSCULAS dos cosas distintas: advertencias
   ("CIERRA LOS SÁBADOS", "RESERVA NO MODIFICABLE") y énfasis o nombres propios
   ("el MET", "SUMMIT", "JOSHUA REDMAN"). Marcar cualquier mayúscula encendía el ⚠
   en 51 de 143 bloques y dejaba de significar algo. Con este vocabulario quedan 28,
   y los 28 son advertencias de verdad: si el ⚠ aparece, hay que abrir el bloque. */
const RX_AVISO = /\b(NO|OJO|CIERRA|CERRAD[AO]S?|S[ÁA]BADOS?|DOMINGOS?|LUNES|MARTES|MI[ÉE]RCOLES|JUEVES|VIERNES|RESERVAR?|RESERVAD[AO]S?|MODIFICABLE|OBLIGAD[AO]S?|LLEGAR|SALIR|SALIDA|[ÚU]LTIM[AO]S?|M[ÁA]XIMO|M[ÍI]NIMO|TIMED|TICKET|AGOTAD[AO]S?|PEDIR|COMPRAR|EVITAR|CUIDADO|IMPRESCINDIBLE|PREINSCRIPCI[ÓO]N|HORARIO|ASIGNADO|PUNTUAL|CONFIRMAR|VERIFICAR|ANTES|EXACT[AO]S?|CUPO|FILA|COLA)\b/;
const tieneAviso = rest => RX_AVISO.test(String(rest || ''));

/* Índice del bloque que toca AHORA en un día: el último cuya hora ya pasó.
   Devuelve -1 si el día no es hoy o si todavía no arrancó. */
function idxAhora(d){
  if (!d || d.date !== TODAY) return -1;
  const m = minsNow(); let idx = -1;
  d.blocks.forEach((b, i) => { const t = minOf(b.t); if (t != null && t <= m) idx = i; });
  return idx;
}

/* ═══════════ VISTA: ITINERARIO ═══════════ */
const OPEN_NOTES = new Set();   // estado de UI transitorio, no se persiste
const OPEN_HOODS = new Set();   // idem: qué barrios están desplegados
/* Qué bloques están desplegados. A propósito NO va al estado guardado: es UI
   transitoria, y agregar una clave al estado es exactamente lo que rompió la app
   una vez (migrate() no corre si el itinerario no cambió). Cero claves nuevas. */
const OPEN_BLK = new Set();

/* ── La tarjeta AHORA ─────────────────────────────────────────────────────────
   La app tenía el reloj y tenía el itinerario y nunca los cruzaba. Esto es ese
   cruce, y es lo primero que se ve al abrir. Tres estados honestos: antes del
   viaje (cuánto falta), durante (qué toca y qué sigue), después. */
function ahoraHTML(){
  const hoy = S.itin.find(x => x.date === TODAY);
  if (!hoy){
    const d0 = S.itin[0], dl = S.itin[S.itin.length - 1];
    if (TODAY < d0.date){
      const dias = Math.round((new Date(d0.date + 'T12:00:00') - new Date(TODAY + 'T12:00:00')) / 864e5);
      const b0 = d0.blocks[0], L0 = leadOf(b0 ? b0.txt : '');
      return `<div class="ahora pre">
        <div class="ahlb"><span>faltan ${dias} día${dias === 1 ? '' : 's'}</span><span class="sp"></span>
          <span style="letter-spacing:.04em">${esc(hhmmNow())}</span></div>
        <div class="ahmain">
          <div class="aht">arranca ${esc(d0.dow.toLowerCase())} ${+d0.date.slice(8)}/${d0.date.slice(5,7)} · ${esc(b0 ? b0.t : '')}</div>
          <div class="ahn">${esc(L0.head)}</div>
          <div class="ahd">${esc(d0.title)}</div>
        </div></div>`;
    }
    if (TODAY > dl.date)
      return `<div class="ahora fin"><div class="ahmain">
        <div class="ahn">El viaje terminó.</div>
        <div class="ahd">Quedan las tildes, las notas y los nueve días enteros.</div></div></div>`;
    return '';
  }
  const i = idxAhora(hoy);
  const cur = i >= 0 ? hoy.blocks[i] : null;
  const nx = hoy.blocks.slice(i + 1).find(b => minOf(b.t) != null) || null;
  const L = cur ? leadOf(cur.txt) : null;
  const p = cur && cur.pid ? PBY[cur.pid] : null;
  const falta = nx ? minOf(nx.t) - minsNow() : null;
  /* Si el bloque de ahora es un traslado (no tiene lugar), lo que sirve en la mano
     es la ruta al lugar que viene: es literalmente adonde estás yendo. */
  const pNav = p || (nx && nx.pid ? PBY[nx.pid] : null);
  const nb = pNav && !p ? amNombre(pNav) : '';
  const navLb = p ? '→ Llegar' : pNav ? '→ Llegar a ' + esc(nb.length > 26 ? nb.slice(0, 25).trim() + '…' : nb) : '';
  const fin = cur ? (hoy.blocks.slice(i + 1).find(b => minOf(b.t) != null) || {}).t : '';
  return `<div class="ahora">
    <div class="ahlb"><span>${cur ? 'ahora' : 'hoy'} · ${esc(hhmmNow())}</span><span class="sp"></span>
      ${S.day !== hoy.n ? `<button class="ahhoy" id="ahHoy">ir a hoy →</button>`
                        : `<span style="opacity:.6">día ${hoy.n}</span>`}</div>
    <div class="ahmain">
      ${cur ? `<div class="aht">${esc(cur.t)}${fin ? ' → ' + esc(fin) : ''}${cur.done ? ' · ✓ hecho' : ''}</div>
               <div class="ahn">${L.star ? '★ ' : ''}${esc(L.head)}</div>
               ${L.rest ? `<div class="ahd">${esc(L.rest.slice(0, 160))}${L.rest.length > 160 ? '…' : ''}</div>` : ''}`
            : `<div class="aht">el día todavía no arrancó</div>
               <div class="ahn">${esc(hoy.title)}</div>`}
    </div>
    ${nx ? `<div class="ahnext"><b>${esc(nx.t)}</b>${falta != null && falta >= 0 ? ' · en ' + enMin(falta) : ''} — ${esc(leadOf(nx.txt).head)}</div>` : ''}
    <div class="ahacts">
      ${pNav ? `<a class="ahbtn" href="${amRuta([pNav], 'walking')}" target="_blank" rel="noopener">${navLb}</a>` : ''}
      ${cur ? `<button class="ahbtn g2" id="ahDone" data-b="${esc(cur.id)}">${cur.done ? '✓ hecho' : '✓ marcar hecho'}</button>` : ''}
      <button class="ahbtn g2" id="ahVer">Ver en el día</button>
    </div></div>`;
}
/* Repinta SOLO la tarjeta: el tick de cada 30 s no puede re-renderizar el día
   entero (se perdería el foco de una nota a medio escribir). */

function rItin(){
  const d = S.itin.find(x => x.n === S.day) || S.itin[0], d2 = d;
  const days = S.itin.map(x => {
    const dd = +x.date.slice(8) + '/' + x.date.slice(5,7);
    return `<button class="dbtn${x.n===S.day?' on':''}${x.date===TODAY?' today':''}" data-d="${x.n}">
      ${x.date===TODAY?'<span class="hoylb">hoy</span>':''}
      <div class="dd">${dd}</div>
      <div class="dw">${esc(x.dow.slice(0,3).toLowerCase())} · día ${x.n}</div></button>`;
  }).join('');

  const vis = b => S.whoF === 'all' || b.who === S.whoF || b.who === 'both';
  const nTH = d.blocks.filter(b => b.who === 'th').length;
  // hora fin = inicio del bloque siguiente (se recalcula sola al reordenar o editar horas)
  const ends = d.blocks.map((_, i) => {
    const nx = d.blocks[i + 1];
    return nx && /^\d{1,2}:\d{2}$/.test(nx.t) ? nx.t : '';
  });
  const _dp = dePasoDelDia(d), PASO = _dp.paso, ACA = _dp.aca;
  const iNow = idxAhora(d);

  const blocks = d.blocks.map((b,i) => {
    if (!vis(b)) return '';
    const p = b.pid ? PBY[b.pid] : null;
    const paso = PASO[b.id] || [], aca = ACA[b.id] || [];
    const ajeno = b.who !== 'both' && b.who !== d.who;   // bloque de la otra persona
    const L = leadOf(b.txt);
    const open = OPEN_BLK.has(b.id);
    const hh = p && p.hrs ? horario(p, DOW_IDX[d.dow]) : null;
    const logi = b.kind === 'logistica' && !p;           // pegamento entre paradas
    const est = iNow < 0 ? '' : i === iNow ? ' now' : i < iNow ? ' past' : '';

    /* Una sola línea de datos duros. Es lo que se lee de un vistazo caminando:
       dónde, cuánto sale, si está abierto, si hay una advertencia adentro. */
    const facts = [];
    if (b.who !== 'both')
      facts.push(`<b style="color:${b.who==='th'?'#5b3690':'#9c4a13'}">${WHO[b.who]}</b>`);
    if (p) facts.push(esc(p.hood));
    if (p && p.cost) facts.push(money(p.cost));
    if (hh === 'CERRADO') facts.push('<b class="cerr">cerrado hoy</b>');
    if (tieneAviso(L.rest)) facts.push('<b class="ojo">⚠ ojo</b>');
    if (hh && hh !== 'CERRADO') facts.push('🕐 ' + esc(hh));
    if (b.note) facts.push('<b class="ojo">⚠ nota</b>');
    if (b.mynote) facts.push('nota tuya');
    if (aca.length) facts.push(aca.length + ' cerca');

    /* Todo lo que la v1 mostraba SIEMPRE vive acá: nada se borró, se plegó. */
    const detalle = !open ? '' : `<div class="bdet">
      ${L.rest ? `<div class="btxt">${esc(L.rest)}</div>` : ''}
      <div class="bmeta">

/* Delegación ÚNICA: los contenedores nunca se reemplazan, solo su innerHTML.
   Registrarla dentro de las funciones de render acumularía un listener por render
   y cada click se dispararía N veces. */
$('#v-itin').addEventListener('click', e => {
  const pa = e.target.closest('[data-paso]');          /* referencia de paso → su ficha */
  if (pa){ showPlace(pa.dataset.paso); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = e.target.closest('.blk')?.dataset.b; if (!id) return;
  const act = el.dataset.act;
  const day = S.itin.find(x => x.n === S.day), i = day.blocks.findIndex(b => b.id === id);
  if (i < 0) return; const b = day.blocks[i];
  if (act === 'toggle'){
    if (OPEN_BLK.has(b.id)) OPEN_BLK.delete(b.id); else OPEN_BLK.add(b.id);
    rItin();
    const el2 = document.querySelector(`.blk[data-b="${b.id}"]`);
    if (el2) el2.scrollIntoView({block:'nearest'});
    return;
  }
  if (act === 'done'){ b.done = !b.done; save(); rItin(); }
  if (act === 'del'){ day.blocks.splice(i,1); save(); rItin(); }
  if (act === 'up' && i > 0){ day.blocks.splice(i-1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'down' && i < day.blocks.length-1){ day.blocks.splice(i+1,0,day.blocks.splice(i,1)[0]); save(); rItin(); }
  if (act === 'info' && b.pid) showPlace(b.pid);
  if (act === 'openhood'){ OPEN_HOODS.add(b.id); rItin(); return; }
  if (act === 'closehood'){ OPEN_HOODS.delete(b.id); rItin(); return; }
  if (act === 'opennote'){ OPEN_NOTES.add(b.id); rItin();
    const ta = document.querySelector(`.blk[data-b="${b.id}"] .bnote`); if (ta) ta.focus(); }
});
$('#v-itin').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-act="toggle"]'); if (!el) return;
  e.preventDefault(); el.click();
});
$('#v-itin').addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = e.target.closest('.blk')?.dataset.b; if (!id) return;
  const b = S.itin.find(x => x.n === S.day)?.blocks.find(z => z.id === id); if (!b) return;
  if (el.dataset.act === 'time') b.t = el.value;
  if (el.dataset.act === 'note') b.mynote = el.value;
  save();
});
$('#v-places').addEventListener('click', e => {
  const ib = e.target.closest('.ib');
  if (ib && ib.dataset.p){ setInterest(ib.dataset.p, ib.dataset.w,
      (interest(ib.dataset.p)[ib.dataset.w] + 1) % 3); rPlaces(); return; }
  const mb = e.target.closest('.mustbtn');
  if (mb){ cycleMark(mb.dataset.p); rPlaces(); return; }
  const ab = e.target.closest('.addbtn');
  if (ab){ pickDay(ab.dataset.p); return; }
  const h = e.target.closest('.pc h3, .prow h3');
  if (h) showPlace(h.dataset.p);
});

let F = {q:'', cat:'', sub:'', boro:'', free:false, hidden:false, want:false, mark:'', src:''};

/* <optgroup> de tipos. Si hay una categoría elegida, muestra solo sus tipos. */
function subOptions(selCat, selSub){
  const cats = selCat ? [selCat] : Object.keys(CAT);
  return cats.filter(c => SUBS[c] && SUBS[c].length).map(c =>
    `<optgroup label="${CAT[c].n}">` + SUBS[c].map(s =>
      `<option value="${esc(s)}"${selSub===s?' selected':''}>${esc(s)}</option>`).join('') +
    `</optgroup>`).join('');
}

function rPlaces(){
  const cats = Object.entries(CAT).map(([k,v]) => `<option value="${k}"${F.cat===k?' selected':''}>${v.n}</option>`).join('');
  const boros = [...new Set(PLACES.map(p => p.boro))].sort()
    .map(b => `<option value="${b}"${F.boro===b?' selected':''}>${b}</option>`).join('');

  buildDayMap();
  const list = PLACES.filter(p => {
    if (F.cat && p.cat !== F.cat) return false;
    if (F.sub && p.typ !== F.sub) return false;
    if (F.boro && p.boro !== F.boro) return false;
    if (F.free && !(p.cost === 0 || p.free)) return false;
    if (F.hidden && p.main) return false;
    if (F.want){ const i = interest(p.id); if (i.jp < 2 && i.th < 2) return false; }
    if (F.mark === 'si'  && !isMust(p.id)) return false;
    if (F.mark === 'no'  && !isOut(p.id))  return false;
    if (F.mark === 'sin' && markOf(p.id) !== 0) return false;
    if (F.src === 'enlista' && !(p.src === 'lista' || p.src === 'ambas')) return false;
    if (F.src && F.src !== 'enlista' && p.src !== F.src) return false;
    if (F.q){ const q = F.q.toLowerCase();
      if (!(p.n+' '+p.typ+' '+p.hood+' '+p.why+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q)) return false; }
    return true;
  });

  $('#v-places').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="Buscar lugar, barrio, palabra…" value="${esc(F.q)}">
      <select class="f" id="fc"><option value="">Todas las categorías</option>${cats}</select>
      <select class="f" id="fs"><option value="">Todos los tipos</option>${subOptions(F.cat, F.sub)}</select>
      <select class="f" id="fb"><option value="">Todos los boroughs</option>${boros}</select>
      <button class="tg${F.free?' on':''}" id="tf">Gratis / PWYW</button>
      <button class="tg${F.hidden?' on':''}" id="th">No turístico</button>
      <button class="tg${F.want?' on':''}" id="tw">Marcados “sí”</button>
      <select class="f" id="fmk" title="Filtrar por la marca de imprescindible">
        <option value="">★ / ✕ / sin marcar</option>
        <option value="si"${F.mark==='si'?' selected':''}>★ Imprescindibles (${mustCount()})</option>
        <option value="no"${F.mark==='no'?' selected':''}>✕ No imprescindibles (${outCount()})</option>
        <option value="sin"${F.mark==='sin'?' selected':''}>Sin marcar todavía (${PLACES.length-mustCount()-outCount()})</option>
      </select>
      <select class="f" id="fsrc" title="De dónde salió cada lugar">
        <option value="">Lista google + otros</option>
        <option value="enlista"${F.src==='enlista'?' selected':''}>★ Lista google</option>
        <option value="propuesta"${F.src==='propuesta'?' selected':''}>· Otros</option>
        <option value="ambas"${F.src==='ambas'?' selected':''}>— de la lista, que además propusimos</option>
      </select>
      <span style="display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto">
        <button class="tg${S.pv!=='list'?' on':''}" id="vwc" style="border:0;border-radius:0">⊞ Tarjetas</button>
        <button class="tg${S.pv==='list'?' on':''}" id="vwl" style="border:0;border-radius:0">☰ Lista</button>
      </span>
      ${(F.cat||F.sub||F.boro||F.free||F.hidden||F.want||F.mark||F.src||F.q)
        ? `<button class="tg" id="tclr" style="color:var(--accent)">✕ Limpiar</button>` : ''}
    </div>
    ${(() => { const ms = PLACES.filter(p => isMust(p.id));
        const outs = PLACES.filter(p => isOut(p.id));
        const outDentro = outs.filter(p => (DAYMAP[p.id] || []).length);
        const av = outDentro.length
          ? `<p class="sm" style="margin:0 0 10px;background:#f3eee8;border:1px solid #d8d0c4;border-radius:10px;padding:8px 10px">
              <b>✕ ${outDentro.length} marcados “no imprescindible” siguen en el itinerario</b>:
              ${outDentro.slice(0,6).map(p => `${esc(p.n)} <span class="muted">(D${(DAYMAP[p.id]||[]).map(d=>d.n).join(' D')})</span>`).join(', ')}${outDentro.length > 6 ? '…' : ''}.
              Son los primeros candidatos a soltar si un día queda apretado.</p>` : '';
        if (!ms.length && !outs.length)
          return `<p class="sm muted" style="margin:0 0 10px">Tocá la marca de un lugar para ir cambiándola:
            <b>☆ sin marcar → ★ imprescindible → ✕ no imprescindible</b>. Después te armo el itinerario respetando esa lista.</p>`;
        if (!ms.length) return av;
        const dentro = ms.filter(p => (DAYMAP[p.id] || []).length).length;
        const fuera = ms.filter(p => !(DAYMAP[p.id] || []).length);
        return `<p class="sm" style="margin:0 0 10px;background:#fff3d4;border:1px solid #e8c46a;border-radius:10px;padding:8px 10px">
          <b>★ ${ms.length} imprescindibles</b> · ${dentro} ya están en el itinerario${fuera.length
            ? ` · <b style="color:#96631a">${fuera.length} todavía no</b>: ${fuera.slice(0,6).map(p => esc(p.n)).join(', ')}${fuera.length > 6 ? '…' : ''}` : ' · todos adentro ✓'}${
            outs.length ? ` <span class="muted">· ✕ ${outs.length} descartados</span>` : ''}</p>` + av;
      })()}
    <p class="sm muted" style="margin:0 0 12px">${list.length} de ${PLACES.length} lugares.
      Tocá los cuadritos JP / TH para cambiar el interés: <b>0</b> no · <b>1</b> quizás · <b>2</b> sí.</p>
    ${S.pv==='list'
      ? `<div class="plistbox">${list.map(prow).join('')}</div>`
      : `<div class="grid">${list.map(pcard).join('')}</div>`}`;

  $('#q').oninput = e => { F.q = e.target.value; const s = window.scrollY; rPlaces();
    $('#q').focus(); $('#q').setSelectionRange(F.q.length,F.q.length); window.scrollTo({top:s}); };
  // cambiar de categoría invalida el tipo elegido si ya no pertenece a ella
  $('#fc').onchange = e => { F.cat = e.target.value;
    if (F.sub && F.cat && !(SUBS[F.cat]||[]).includes(F.sub)) F.sub = '';
    rPlaces(); };
  $('#fs').onchange = e => { F.sub = e.target.value;
    if (F.sub && !F.cat){   // elegir un tipo fija su categoría, así el combo queda coherente
      const owner = Object.keys(SUBS).find(c => SUBS[c].includes(F.sub));
      if (owner) F.cat = owner;
    }
    rPlaces(); };
  $('#fb').onchange = e => { F.boro = e.target.value; rPlaces(); };
  $('#tf').onclick = () => { F.free = !F.free; rPlaces(); };
  $('#th').onclick = () => { F.hidden = !F.hidden; rPlaces(); };
  $('#tw').onclick = () => { F.want = !F.want; rPlaces(); };

let DAYMAP = {};
function buildDayMap(){
  DAYMAP = {};
  S.itin.forEach(d => {
    const seen = {};
    d.blocks.forEach(b => {
      if (!b.pid || seen[b.pid]) return;
      seen[b.pid] = 1;
      (DAYMAP[b.pid] = DAYMAP[b.pid] || []).push(d);
    });
  });
}
function dayChips(pid){
  const ds = DAYMAP[pid] || [];
  if (!ds.length) return '';
  return `<div class="flex" style="margin-top:6px">${ds.map(d =>
    `<span class="chip" style="background:var(--accent);color:#fff">📅 Día ${d.n} · ${esc(d.dow.slice(0,3).toLowerCase())} ${+d.date.slice(8)}/${+d.date.slice(5,7)}</span>`).join('')}</div>`;
}
function prow(p){

    $('#mcat').onchange = drawMap;

  if (S.mapDay) $('#mday').value = S.mapDay;
  setTimeout(() => {
    if (typeof L === 'undefined'){ mapFallback(); return; }   // sin internet: Leaflet no cargó
    try {
      if (!MAP){
        MAP = L.map('map', {scrollWheelZoom:false}).setView([40.735,-73.96], 11);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom:19
        }).addTo(MAP);
      }
      MAP.invalidateSize(); drawMap();
    } catch(e){ console.warn(e); mapFallback(); }
  }, 60);
}
/* Sin conexión el mapa no puede dibujarse. En vez de romperse, listamos los lugares
   con su link a Google Maps, que es lo único que hace falta para navegar. */
function svgMap(items, conRuta){
  const pts = items.filter(x => x.p.lat && x.p.lng);
  if (pts.length < 2) return '';
  const la = pts.map(x => x.p.lat), lo = pts.map(x => x.p.lng);
  const la0 = (Math.min(...la) + Math.max(...la)) / 2;
  const k = Math.cos(la0 * Math.PI / 180);                 // 1° de longitud mide menos que uno de latitud
  const X = x => x.p.lng * k, Y = x => -x.p.lat;
  const xs = pts.map(X), ys = pts.map(Y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const W = 1000, pad = 46;
  const span = Math.max(x1 - x0, y1 - y0, 1e-4);           // cuadrado: no deforma distancias
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  x0 = cx - span / 2; y0 = cy - span / 2;
  const sc = (W - pad * 2) / span;
  const px = x => pad + (X(x) - x0) * sc, py = x => pad + (Y(x) - y0) * sc;
  // escala: cuánto mide en pantalla 1 km real
  const kmPx = sc * (1 / 111.32) * 1;                      // 1 km en grados de latitud → px
  const kmRot = Math.max(1, Math.round(span * 111.32 / 4)); // barra de referencia redondeada
  const ruta = conRuta && pts.length > 1
    ? `<polyline points="${pts.map(x => px(x).toFixed(1) + ',' + py(x).toFixed(1)).join(' ')}"
        fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"
        stroke-dasharray="7 5" opacity=".55"/>` : '';
  const marcas = pts.map((x, i) => {
    const c = CAT[x.p.cat].c, X0 = px(x).toFixed(1), Y0 = py(x).toFixed(1);
    return `<g><title>${esc((x.t ? x.t + ' · ' : '') + x.p.n + ' — ' + x.p.hood)}</title>
      <circle cx="${X0}" cy="${Y0}" r="${conRuta ? 13 : 6.5}" fill="${c}" fill-opacity="${conRuta ? 1 : .8}"
        stroke="#fff" stroke-width="${conRuta ? 2.5 : 1.5}"/>
      ${conRuta ? `<text x="${X0}" y="${Y0}" text-anchor="middle" dominant-baseline="central"
        font-size="12" font-weight="700" fill="#fff">${i + 1}</text>` : ''}</g>`;
  }).join('');
  const etiquetas = conRuta ? pts.map((x, i) => {
    const X0 = +px(x), Y0 = +py(x);
    return `<text x="${(X0 + 17).toFixed(1)}" y="${(Y0 + 4).toFixed(1)}" font-size="12.5"
      fill="var(--ink)" style="paint-order:stroke;stroke:var(--card);stroke-width:3.5px">${esc(x.p.n.slice(0, 30))}</text>`;
  }).join('') : '';
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px">
    <svg viewBox="0 0 ${W} ${W}" width="100%" style="display:block;max-height:74vh" role="img"
      aria-label="Esquema de posiciones relativas de los lugares">
      <defs><pattern id="gr" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M50 0H0V50" fill="none" stroke="var(--line)" stroke-width="1" opacity=".55"/></pattern></defs>
      <rect width="${W}" height="${W}" fill="url(#gr)"/>
      ${ruta}${marcas}${etiquetas}
      <g transform="translate(${pad},${W - 22})">
        <line x1="0" y1="0" x2="${(kmPx * kmRot).toFixed(1)}" y2="0" stroke="var(--ink)" stroke-width="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <line x1="${(kmPx * kmRot).toFixed(1)}" y1="-5" x2="${(kmPx * kmRot).toFixed(1)}" y2="5" stroke="var(--ink)" stroke-width="2"/>
        <text x="${(kmPx * kmRot / 2).toFixed(1)}" y="-9" text-anchor="middle" font-size="13" fill="var(--ink)">${kmRot} km</text>
      </g>
      <text x="${W - pad}" y="${pad - 16}" text-anchor="end" font-size="13" fill="var(--mut)">↑ norte</text>
    </svg></div>`;
}
function mapFallback(){
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value;
  let items;
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  if (dsel){ const d = S.itin.find(x => x.n === +dsel);
    items = d.blocks.filter(b => b.pid && PBY[b.pid]).map(b => ({p:PBY[b.pid], t:b.t})); }
  else items = PLACES.filter(matchSel).map(p => ({p, t:''}));
  $('#map').outerHTML = `<div id="map" style="height:auto;padding:0;background:transparent">
    ${svgMap(items, !!dsel)}
    <div class="banner warn" style="margin:12px 0">Este es un <b>esquema de posiciones reales</b>
      (norte arriba, con escala), no un mapa de calles: acá el mapa callejero no puede cargarse.
      ${dsel ? 'Los números siguen el orden del día.' : 'Elegí un día arriba para ver el recorrido numerado.'}
      Para navegar, cada lugar tiene su <b>link a Google Maps</b>.</div>
    ${items.map(({p,t}) => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="b">${t ? t + ' · ' : ''}${esc(p.n)}</div>
      <div class="xs muted">${esc(p.typ)} · ${esc(p.hood)} · ${money(p.cost)} · 🚇 ${esc(p.sub)}</div>
      <a class="chip b" style="margin-top:5px" href="${gmaps(p)}" target="_blank" rel="noopener">↗ Google Maps</a>
    </div>`).join('')}</div>`;
  const s = $('#mday'); if (s) s.onchange = e => { S.mapDay = e.target.value ? +e.target.value : null; mapFallback(); };
  const c = $('#mcat'); if (c) c.onchange = mapFallback;
}
function drawMap(){
  if (!MAP || typeof L === 'undefined') return;
  if (LAYER) MAP.removeLayer(LAYER);
  LAYER = L.layerGroup().addTo(MAP);
  const dsel = $('#mday')?.value, csel = $('#mcat')?.value, fsel = $('#mfree')?.classList.contains('on');
  // csel viene como "c:<categoría>" o "s:<tipo>"
  const matchSel = p => !csel || (csel.startsWith('c:') ? p.cat === csel.slice(2) : p.typ === csel.slice(2));
  let items = [];
  /* ── Vista de conjunto: los 9 recorridos a la vez ───────────────────────── */
  if (dsel === 'todos'){
    /* La leyenda pasa a ser de DÍAS y es el control de aislamiento: tocar uno
       lo deja solo. Es la salida real cuando dos colores se parecen — y con
       nueve series siempre hay dos que se parecen. */
    const leg = $('#mleg');
    if (leg) leg.innerHTML = `<span class="xs muted" style="width:100%;margin-bottom:2px">
        El número de cada punto es el <b>orden de la parada dentro de su día</b>; el color dice qué día es.
        Tocá un día para verlo solo${SOLO_DIA ? ' · <b>tocá de nuevo para volver a los nueve</b>' : ''}.
        No se dibuja lo que queda fuera de la ciudad (el hotel de New Jersey), que deformaba el mapa.</span>` +
      S.itin.map((d, i) => { const c = DIA_COLOR[i % DIA_COLOR.length];
        const on = !SOLO_DIA || SOLO_DIA === d.n;
        return `<button class="chip mdchip" data-dia="${d.n}" style="background:${c}${on?'22':'0d'};
          color:${on?c:'var(--mut)'};border:1.5px solid ${SOLO_DIA===d.n?c:'transparent'}">
          <b style="display:inline-block;width:15px;height:15px;border-radius:50%;background:${on?c:'var(--line)'};
          color:#fff;font-size:9.5px;line-height:15px;text-align:center;margin-right:4px">${d.n}</b>${d.dow.slice(0,3)} ${d.date.slice(8)}/${d.date.slice(5,7)}</button>`;
      }).join('');
    const pts = [];
    S.itin.forEach((d, di) => {
      if (SOLO_DIA && d.n !== SOLO_DIA) return;
      const col = DIA_COLOR[di % DIA_COLOR.length];
      const ruta = [], vistos = {}; let orden = 0;
      d.blocks.forEach(b => {
        const p = b.pid ? PBY[b.pid] : null;
        if (!p || !p.lat || vistos[p.id]) return;
        /* Fuera de la ciudad no entra: el hotel de Branchburg está a 60 km y
           deforma el encuadre — Manhattan quedaba apretado en una esquina y el
           recorrido, ilegible. Esta vista es el viaje DENTRO de Nueva York. */
        if (p.boro === 'New Jersey' || p.boro === 'Fuera de NYC') return;
        vistos[p.id] = 1; orden++;
        ruta.push([p.lat, p.lng]); pts.push([p.lat, p.lng]);
        /* El número es el ORDEN DE LA PARADA dentro del día, para poder seguir la
           secuencia; el color dice de qué día es. Ojo con el costo: con los nueve
           días juntos la identidad del día queda SOLO en el color, que con nueve
           series no alcanza — por eso el popup nombra el día y la leyenda aísla. */
        L.marker([p.lat, p.lng], {icon: L.divIcon({className:'',
            html:`<div class="mdia" style="background:${col}">${orden}</div>`,
            iconSize:[22,22], iconAnchor:[11,11]})})
          .addTo(LAYER)
          .bindPopup(`<h4>${esc(b.t)} · ${esc(p.n)}</h4>
            <div style="color:${col};font-weight:700;font-size:12px;margin-bottom:5px">
              Parada ${orden} del día ${d.n} · ${esc(d.dow)} ${d.date.slice(8)}/${d.date.slice(5,7)}</div>
            <div style="color:#66707d;font-size:12px">${esc(p.typ)} · ${esc(p.hood)}</div>`);
      });
      if (ruta.length > 1)
        L.polyline(ruta, {color: col, weight: SOLO_DIA ? 4 : 2.5,
                          opacity: SOLO_DIA ? .95 : .6}).addTo(LAYER);
    });
    if (pts.length) MAP.fitBounds(pts, {padding:[36,36], maxZoom: SOLO_DIA ? 14 : 12});
    return;
  }
  if (dsel){
    const d = S.itin.find(x => x.n === +dsel);
    d.blocks.forEach(b => { if (b.pid && PBY[b.pid]) items.push({p:PBY[b.pid], num:items.length+1, t:b.t}); });
    /* Los de paso van SIN número y no entran en la línea del recorrido: son
       referencia, no paradas. Se marcan con `paso` para pintarlos distinto. */
    dePasoPlano(d).forEach(({p, desvio}) => items.push({p, num:null, paso:desvio}));
  } else {
    items = PLACES.filter(p => matchSel(p) && (!fsel || p.cost === 0 || p.free)).map(p => ({p, num:null}));
  }
  const leg = $('#mleg');
  if (leg) leg.innerHTML = Object.entries(CAT).map(([k,v]) =>
    `<span class="chip" style="background:${v.c}1a;color:${v.c}">● ${v.n}</span>`).join('');
  const pts = [], ruta = [];
  items.forEach(({p,num,t,paso}) => {
    if (!p.lat) return;
    pts.push([p.lat, p.lng]);
    if (num) ruta.push([p.lat, p.lng]);      /* la línea une las paradas, no las referencias */
    const c = CAT[p.cat].c;
    const icon = num
      ? L.divIcon({className:'', html:`<div class="mnum" style="background:${c};width:27px;height:27px">${num}</div>`,
                   iconSize:[27,27], iconAnchor:[13,13]})
      : paso != null
      ? L.divIcon({className:'', html:`<div class="mk mkpaso" style="border-color:${c}"></div>`,
                   iconSize:[15,15], iconAnchor:[8,8]})
      : L.divIcon({className:'', html:`<div class="mk" style="background:${c};width:13px;height:13px"></div>`,
                   iconSize:[13,13], iconAnchor:[7,7]});
    L.marker([p.lat,p.lng], {icon}).addTo(LAYER).bindPopup(
      `<h4>${t ? t + ' · ' : ''}${esc(p.n)}</h4>
       ${paso != null ? `<div style="font-size:11.5px;color:#8a7f6d;margin-bottom:6px">
         De paso · no está en el itinerario · desvío +${paso < 950 ? Math.round(paso/10)*10 + ' m' : (paso/1000).toFixed(1) + ' km'}</div>` : ''}
       <div style="color:#66707d;font-size:12px;margin-bottom:6px"><b style="color:${CAT[p.cat].c}">${esc(p.typ)}</b> · ${esc(p.hood)} · ${money(p.cost)}</div>
       <div style="margin-bottom:8px">${esc(p.why.slice(0,190))}${p.why.length>190?'…':''}</div>
       <div style="font-size:11.5px;color:#66707d;margin-bottom:8px">🚇 ${esc(p.sub)}</div>
       <a href="${gmaps(p)}" target="_blank" rel="noopener"
          style="display:inline-block;background:#14293d;color:#fff;padding:7px 11px;border-radius:9px;
          text-decoration:none;font-weight:650;font-size:12px">Abrir en Google Maps ↗</a>`);
  });
  if (dsel && ruta.length > 1)
    L.polyline(ruta, {color:'#14293d', weight:2.5, opacity:.45, dashArray:'6,7'}).addTo(LAYER);
  if (pts.length) MAP.fitBounds(pts, {padding:[36,36], maxZoom: dsel ? 14 : 12});
}

function rRes(){
  /* Las que ya estan compradas (x.hecho, viene del catalogo) bajan al final y cuentan como hechas
     para todos, no solo para el navegador donde se tildo. */
  const R = [...EX.reservas].sort((a,b) => (a.hecho?1:0) - (b.hecho?1:0) || b.urg - a.urg);
  const listo = (x,i) => !!(x.hecho || S.res[i]);
  const dn = R.filter((x,i) => listo(x,i)).length;
  $('#v-res').innerHTML = `
    <div class="banner info"><b>${dn} de ${R.length}</b> reservas hechas. Ordenado por urgencia:
      lo naranja es lo que se agota o tiene ventana fija; lo verde de abajo ya esta comprado.</div>
    <div class="card">${R.map((x,i) => `
      <div class="blk${listo(x,i)?' done':''}" style="${x.urg===3&&!listo(x,i)?'background:#fff7ec':''}">
        <button class="ck${listo(x,i)?' on':''}" data-r="${i}" style="flex:0 0 23px;margin-top:2px">✓</button>
        <div class="bbody">
          <div class="btxt b">${esc(x.q)}</div>
          <div class="bmeta">
            <span class="chip ${x.hecho?'g':x.urg===3?'r':'o'}">${x.hecho?'✔ ':''}${esc(x.cuando)}</span>

          <div class="sm muted" style="margin-top:5px">${esc(x.por)}</div>
        </div></div>`).join('')}</div>`;

/* Hoja de la ruta del día: elegís qué paradas entran y la abrís en Apple Maps.
   Vienen tildadas las que NO marcaste como hechas, así en la calle la ruta arranca
   en lo que te falta. Un link lleva UN modo de transporte, por eso hay dos botones. */
function rutaSheet(dayN){
  const d = S.itin.find(x => x.n === dayN) || S.itin[0];
  const paradas = paradasDe(d);
  if (!paradas.length){
    sheet(`<h2 style="font-size:17px;margin-bottom:8px">Ruta del día ${dayN}</h2>
      <p class="sm muted">Este día no tiene bloques con un lugar del catálogo, así que no hay
      ruta que armar. Los bloques de logística y las comidas sin lugar fijo no cuentan.</p>`);
    return;
  }
  const fecha = d.date.slice(8) + '/' + d.date.slice(5,7);
  const filas = paradas.map((x,i) => `<label class="opt" style="display:flex;gap:9px;align-items:flex-start;text-align:left">
      <input type="checkbox" data-rp="${i}" ${x.b.done ? '' : 'checked'} style="margin-top:3px;flex:none">
      <span style="flex:1">${esc(x.b.t)} · ${esc(x.p.n)}
        <b>${esc(x.p.hood || '')}${x.p.aprox ? ' · 📍 dirección sin verificar' : ''}${x.b.done ? ' · ya lo hiciste' : ''}</b></span>
    </label>`).join('');
  sheet(`<h2 style="font-size:17px;margin-bottom:4px">Ruta del día ${dayN} · ${esc(d.dow)} ${fecha}</h2>
    <p class="sm muted" style="margin-bottom:9px">Arranca <b>desde donde estés</b>. El Watch toma la
    navegación del iPhone solo.</p>
    <div id="raviso"></div>
    <div class="flex" style="margin-bottom:4px">
      <span class="chip b" style="flex:none">Apple Maps</span>
      <a class="btn sm" id="rw" href="#" target="_blank" rel="noopener">A pie</a>
      <a class="btn ghost sm" id="rt" href="#" target="_blank" rel="noopener">En transporte</a>
    </div>
    <p class="sm muted" style="margin-bottom:10px">Necesita iOS 18.4 · watchOS 11.4.</p>
    <div style="border-top:1px solid var(--ln);padding-top:11px">
      <div class="flex" style="margin-bottom:4px">
        <span class="chip" style="flex:none">Plan B · Google Maps</span>
      </div>
      <p class="sm muted" style="margin-bottom:8px">Google toma pocas paradas por link: va
      <b>en tramos</b>. Cada uno arranca donde estés.</p>
      <div id="rgm"></div>
    </div>
    <div style="border-top:1px solid var(--ln);margin-top:13px;padding-top:11px">
      <p class="sm muted" style="margin-bottom:7px">Las <b>${paradas.length} paradas</b> del día.
      Vienen tildadas las que no marcaste como hechas — destildá lo que quieras saltear.</p>
      <div id="rlist">${filas}</div>
      <p class="sm muted" style="margin-top:9px">Maps puede reordenar o recortar paradas si la ruta no
      le cierra: mirá la lista antes de arrancar.</p>
    </div>`);

  const sel = () => Array.from($('#rlist').querySelectorAll('[data-rp]'))
    .filter(c => c.checked).map(c => paradas[+c.dataset.rp].p);
  const pinta = () => {
    const ps = sel();
    const links = {rw:'walking', rt:'transit'};
    Object.keys(links).forEach(id => {
      const a = $('#' + id), url = ps.length ? amRuta(ps, links[id]) : '';
      if (url){ a.href = url; a.removeAttribute('aria-disabled'); a.style.opacity = ''; }
      else { a.href = '#'; a.setAttribute('aria-disabled','true'); a.style.opacity = '.45'; }
    });
    const avisos = [];
    if (!ps.length) avisos.push('Elegí al menos una parada.');
    else if (ps.length === 1) avisos.push('Una sola parada: Maps va a darte la ruta directa hasta ahí.');
    if (ps.length > AM_MAX) avisos.push('Maps toma hasta ' + AM_MAX + ' paradas por ruta: se van a usar las primeras ' +
      AM_MAX + ' y quedan ' + (ps.length - AM_MAX) + ' afuera.');
    if (ps.some(x => x.aprox)) avisos.push('Hay paradas con 📍: la dirección no está verificada y Maps las busca por nombre.');
    $('#raviso').innerHTML = avisos.length
      ? '<div class="banner warn sm">' + avisos.map(esc).join(' ') + '</div>' : '';

    const grupos = enTramos(ps, GM_PARADAS);
    $('#rgm').innerHTML = !grupos.length
      ? '<p class="sm muted">Elegí paradas arriba.</p>'
      : grupos.map((g, i) => `<div class="flex" style="margin-bottom:7px;align-items:center">
          <span class="chip" style="flex:none">${grupos.length > 1 ? 'Tramo ' + (i+1) + '/' + grupos.length : 'Ruta'}</span>
          <span class="sm muted" style="flex:1;min-width:90px;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis" title="${esc(g.map(amNombre).join(' → '))}">${esc(g.map(amNombre).join(' → '))}</span>
          <a class="chip b" href="${gmRuta(g,'walking')}" target="_blank" rel="noopener">a pie</a>
          <a class="chip b" href="${gmRuta(g,'transit')}" target="_blank" rel="noopener">transporte</a>
        </div>`).join('');
  };
  $('#rlist').onchange = pinta;
  ['rw','rt'].forEach(id => $('#' + id).onclick = e => {
    if ($('#' + id).getAttribute('aria-disabled')){ e.preventDefault(); toast('Elegí al menos una parada.'); }
  });
  pinta();
}

      'Pegá el texto que te dio <b>Exportar</b> en el otro dispositivo, o cargá el archivo .json.',
      '', [{t:'Importar', f: cargar},
           {t:'Desde archivo', f: () => {
              const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
              f.onchange = () => { const r = new FileReader(); r.onload = () => cargar(r.result); r.readAsText(f.files[0]); };
              f.click(); }}], true); };
};

/* ¿El servidor tiene una versión más nueva que la que este navegador cargó?
   Solo funciona servido por http(s); con archivo local devuelve null. */
async function hayVersionNueva(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'reload'});
    if (!r.ok) return null;
    const t = await r.text();
    const m = t.match(/"verId":"([a-f0-9]{6})"/);
    return m ? m[1] !== VERID : null;
  } catch(e){ return null; }
}
/* Al abrir, avisa una sola vez si quedó una versión vieja cacheada. */
async function avisarSiHayVersionNueva(){
  if (location.protocol === 'file:') return;
  if (await hayVersionNueva() === true)
    toast('Hay una versión más nueva del plan. Recargá la página para verla.');
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200);
}
const HOSTED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const puedeBajar = () => !HOSTED || !!DLNS;
let DLNS;   // namespace de descargas del visor (solo existe en el sitio publicado)
(async () => { try { DLNS = window.claude && await window.claude.use('downloads'); } catch(e){} })();
async function dl(name, text, type){
  if (DLNS){                                   // sitio publicado: lo guarda el visor, con confirmación
    try { await DLNS.save({ filename: name, data: new TextEncoder().encode(text) }); return true; }
    catch(e){
      if (e && e.code === 'declined') return false;
      toast('No se pudo descargar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Copiá el plan a mano o abrí el archivo en la compu.');
      return false;
    }
  }
  const b = new Blob([text], {type}); const u = URL.createObjectURL(b);   // archivo local
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
  return true;
}
async function doExport(){
  closeSheet();
  const txt = JSON.stringify(S, null, 1);
  planSheet('Exportar mi plan',
    'Copiá este texto y pegalo en el otro dispositivo con <b>Importar plan</b>. También podés bajarlo como archivo.',
    txt, [{t:'Copiar', f: async () => {
        try { await navigator.clipboard.writeText(txt); toast('Plan copiado al portapapeles'); }
        catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('Plan copiado'); }
      }},
      ...(puedeBajar() ? [{t:'Bajar archivo', f: async () => {
        if (await dl('nyc2026-plan.json', txt, 'application/json')) toast('Plan exportado'); }}] : [])]);
}
/* Panel simple con un textarea y botones: sirve para exportar (texto listo para copiar)
   y para importar (pegar el texto del otro dispositivo). */
function planSheet(titulo, ayuda, valor, acciones, alPegar){
  const w = document.createElement('div');
  w.id = 'planSheet';
  w.innerHTML = `<div class="psBack"></div><div class="psBox" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <h3 style="margin:0 0 4px">${esc(titulo)}</h3>
    <p class="sm muted" style="margin:0 0 10px">${ayuda}</p>
    <textarea id="planTxt" spellcheck="false" ${alPegar ? 'placeholder="Pegá acá el texto exportado en el otro dispositivo"' : ''}>${esc(valor)}</textarea>
    <div class="flex" style="margin-top:11px;justify-content:flex-end">
      ${acciones.map((a, i) => `<button class="btn" data-a="${i}">${esc(a.t)}</button>`).join('')}
      <button class="btn" data-a="x">Cerrar</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('.psBack').onclick = () => w.remove();
  w.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'x') { w.remove(); return; }
    acciones[+b.dataset.a].f(document.getElementById('planTxt').value); };
  if (alPegar) setTimeout(() => document.getElementById('planTxt').focus(), 50);
}
function doCsv(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g,'""') + '"';
  const head = ['Lugar','Categoria','Tipo','Barrio','Borough','JP','Thais','USD','Horas','Turistico',
                'Cierra','Gratis/PWYW','Reserva','Subte','PorQue','Direccion'];
  const rows = PLACES.map(p => { const i = interest(p.id);
    return [p.n, CAT[p.cat].n, p.typ, p.hood, p.boro, i.jp, i.th, p.cost, p.dur,
            p.main?'SI':'no', p.closed, p.free, p.book, p.sub, p.why, p.addr].map(q).join(','); });
  const csv = head.map(q).join(',') + '\n' + rows.join('\n');
  closeSheet();
  if (puedeBajar()){ dl('nyc2026-lugares.csv', '\ufeff' + csv, 'text/csv;charset=utf-8'); return; }
  planSheet('Lugares en CSV',
    'Copiá este texto y pegalo en una hoja de cálculo: Excel y Google Sheets separan las columnas solos.',
    csv, [{t:'Copiar', f: async () => {
      try { await navigator.clipboard.writeText(csv); toast('CSV copiado'); }
      catch(e){ const a = document.getElementById('planTxt'); a.select(); document.execCommand('copy'); toast('CSV copiado'); } }}]);
}

/* ── Cambiar de día deslizando ────────────────────────────────────────────────
   Cambiar de día es lo que más se hace, y la tira de días está arriba de todo:
   con una mano y el celular grande, no se llega. El gesto tiene que ser claramente
   horizontal (más del doble que el vertical) para no comerse el scroll, y no cuenta
   si arrancó adentro de algo que ya scrollea solo. */
(function(){
  let x0 = null, y0 = null, ok = false;
  const v = $('#v-itin');
  v.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ ok = false; return; }
    const t = e.target;
    ok = !t.closest('.days, .tw, .tools, input, textarea, select, .leaflet-container, .bmeta, .aca, .paso, .hood');
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  v.addEventListener('touchend', e => {
    if (!ok || x0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 2.2) return;
    const i = S.itin.findIndex(z => z.n === S.day);
    const j = dx < 0 ? i + 1 : i - 1;
    if (j < 0 || j >= S.itin.length){ toast(dx < 0 ? 'Es el último día.' : 'Es el primer día.'); return; }
    S.day = S.itin[j].n; save(); rItin(); window.scrollTo({top:0});
  }, {passive:true});
})();

/* ── El reloj corre ──────────────────────────────────────────────────────────
   Cada 30 s se repinta SOLO la tarjeta "Ahora". El día entero se re-renderiza
   nada más cuando cambia el bloque actual, y nunca mientras alguien escribe. */
let ULT_I = null;
setInterval(() => {
  const t = hoyStr(), cambioDia = t !== TODAY;
  TODAY = t;
  if (S.tab !== 'itin') return;
  pintarAhora();
  const d = S.itin.find(x => x.n === S.day);
  const i = idxAhora(d);
  const escribiendo = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if ((i !== ULT_I || cambioDia) && !escribiendo){ ULT_I = i; rItin(); }
  else ULT_I = i;
}, 30000);
