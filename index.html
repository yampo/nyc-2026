/* required styles */

.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}

.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-tile-pane    { z-index: 200; }

.leaflet-map-pane canvas { z-index: 100; }

	}

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}

	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-pane > svg path.leaflet-interactive,

	}

	color: #0078A8;

	border-radius: 4px;
	}
.leaflet-bar a {

	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}

.leaflet-bar a:hover,

	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;

.leaflet-touch .leaflet-bar a:last-child {

	border-bottom-right-radius: 2px;

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}

<style>
:root{
  --bg:#f7f5f1; --card:#fff; --ink:#16202b; --mut:#66707d; --line:#e3ddd4;
  --navy:#14293d; --accent:#c1440e; --gold:#c8891b; --green:#2e7d4f; --red:#b8283a;
  --sh:0 1px 2px rgba(20,41,61,.06),0 4px 14px rgba(20,41,61,.06);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);

h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em}
a{color:var(--accent)}

input,select,textarea{font:inherit;color:inherit}

/* ── header ── */
header{position:sticky;top:0;z-index:900;background:var(--navy);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 2px 18px rgba(0,0,0,.18)}
.hrow{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.brand{font-weight:750;font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.72;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;transition:background .15s}
.iconbtn:hover{background:rgba(255,255,255,.24)}

/* ── tabs ── */
nav.tabs{position:sticky;top:0;z-index:880;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabsin{display:flex;gap:2px;padding:0 10px;max-width:1180px;margin:0 auto;min-width:max-content}
html,body{max-width:100%;overflow-x:hidden}
.tab{padding:13px 13px 11px;font-size:13.5px;font-weight:600;color:var(--mut);
  border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
.view{display:none}.view.on{display:block}

/* ── generic ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.muted{color:var(--mut)}
.sm{font-size:13px}.xs{font-size:11.5px}
.b{font-weight:650}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:11.5px;font-weight:650;background:#eee9e1;color:#4a5460;white-space:nowrap;max-width:100%}
.chip.wrap,.chip.o,.chip.g{white-space:normal;text-align:left;line-height:1.4}
.chip.g{background:#dff0e4;color:#1e6b41}
.chip.o{background:#fdeadb;color:#9c4a13}
.chip.r{background:#fbe3e6;color:#8f2230}
.chip.b{background:#e0e9f3;color:#1c4a72}
.chip.p{background:#ece4f6;color:#5b3690}
.chip.wrap{white-space:normal;text-align:left;line-height:1.45;font-weight:500}
.notebtn{font-size:11px;font-weight:650;color:var(--mut);border:1px dashed var(--line);
  border-radius:8px;padding:3px 8px;margin-top:6px}
.notebtn:hover{color:var(--accent);border-color:#f0d0bd}

.sect{font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin:26px 0 10px}
.sect:first-child{margin-top:0}

.banner{border-radius:var(--r);padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
#planSheet .psBack{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:70}
#planSheet .psBox{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,560px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
#planSheet textarea{width:100%;height:min(38vh,240px);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--bg);color:var(--ink);resize:vertical}
/* Los tiles de OSM son más coloridos que el estilo gris anterior: los apagamos un poco
   para que los pines de categoría sigan siendo lo que más resalta. */
.leaflet-tile-pane{filter:grayscale(.62) brightness(1.06) contrast(.94)}
#toast{position:fixed;left:50%;transform:translate(-50%,140%);bottom:76px;z-index:60;max-width:min(92vw,460px);
  background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;line-height:1.45;
  box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}

.banner.warn{background:#fff4e2;border:1px solid #f0d6a8;color:#7a4c07}
.banner.info{background:#e8f0f8;border:1px solid #c6d8ea;color:#1c4a72}
.banner.ok{background:#e4f2e8;border:1px solid #b9ddc6;color:#1e6b41}

/* ── día selector ── */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}

.dbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;

.dbtn .dn{font-size:10.5px;font-weight:750;letter-spacing:.07em;color:var(--mut);text-transform:uppercase}
.dbtn .dd{font-size:15px;font-weight:750;margin:1px 0}
.dbtn .dw{font-size:10.5px;font-weight:600}
.dbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dbtn.on .dn,.dbtn.on .dw{color:rgba(255,255,255,.78)}
.dbtn.today{outline:2px solid var(--gold);outline-offset:1px}

/* ── bloques ── */
.blk{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}

/* bloque que NO le toca a quien está mirando el día: se atenúa para que no se confunda */

.tmw{flex:0 0 52px}
.tm{font-size:13px;font-weight:750;color:var(--navy);padding-top:1px;
  background:none;border:0;width:100%;text-align:left}
.tmend{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap}
.trav{padding:5px 14px 5px 62px;font-size:11.5px;color:var(--mut);
  border-bottom:1px dashed var(--line);background:#fbf9f5}
.bbody{flex:1;min-width:0}
.btxt{font-size:14px;line-height:1.5}
.bmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bnote{margin-top:7px;width:100%;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;
  font-size:12.5px;background:#fcfbf9;resize:vertical;min-height:34px}
.bact{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;align-items:center}
.ck{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:transparent;background:#fff}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.mini{font-size:14px;opacity:.32;padding:2px 4px;line-height:1}
.mini:hover{opacity:.85}

/* ── lugares ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

rte":["Ferry y teleférico","Hotel"]},"itinerary":[{"n":1,"date":"2026-08-29","dow":"Sábado","who":"both","base":"Ink48","title":"Harlem + Arthur Avenue + festival (2h) + Hudson VU","note":"La reserva de Hudson VU (rooftop del propio Ink48) NO es modificable y exige estar en el hotel 19:20, así que el festival queda en la franja 16:30-18:30 — dos horas justas, con salida obligada 20-30 min antes del cierre. La tarde liberada la ocupa ARTHUR AVENUE, la Little Italy real del Bronx — los dos la marcaron 2 y no entraba en ningún día. Desde Harlem es un tiro de subte D (~20 min), y el sábado es EL día: el mercado cierra ~18h y los domingos no abre. Bogotá está a una hora de NYC: no hay jet lag, solo noche corta de avión. PEDIR EARLY CHECK-IN a Ink48 por mail.","blocks":[{"t":"06:00","txt":"Aterrizaje en EWR. Migraciones + equipaje de vuelo internacional: 45-75 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"07:15","txt":"AirTrain al Newark Airport Station (~10 min). Comprar el ticket en la app MyTix: a bordo cobran $5 extra.","pid":"","who":"both","kind":"logistica","note":"El AirTrain opera normal los fines de semana; la obra afecta solo días hábiles 5-15h."},{"t":"07:39","txt":"NJ Transit EWR → New York Penn Station. $17,25 (incluye el fee del AirTrain). Llega 8:07.","pid":"","who":"both","kind":"logistica","note":""},{"t":"08:20","txt":"Taxi/Uber Penn Station → Ink48 ($12-18). Dejar valijas y, si consiguieron el early check-in, ducha y ropa limpia.","pid":"ink48","who":"both","kind":"logistica","note":""},{"t":"09:15","txt":"Desayuno rápido en Hell's Kitchen.","pid":"","who":"both","kind":"comida","note":""},{"t":"10:00","txt":"Subte A o D express desde 42 St hasta 125 St: 12 minutos y ya están en Harlem.","pid":"","who":"both","kind":"logistica","note":""},{"t":"10:30","txt":"Caminata por Harlem: 125th St, Adam Clayton Powell Blvd y las brownstones del Mount Morris Park Historic District.","pid":"harlem","who":"both","kind":"destacado","note":""},{"t":"11:30","txt":"Bo's Bagels (235 W 116th St) — bagel rápido, sin sentarse mucho: hoy el almuerzo fuerte es italiano en el Bronx.","pid":"bosbagels","who":"both","kind":"comida","note":"","trav":"🚶 ~15 min a pie · 1.1 km · estimado"},{"t":"12:00","txt":"★ STUDIO MUSEUM IN HARLEM — reabrió en noviembre 2025 en el edificio nuevo de David Adjaye. La novedad arquitectónica y curatorial más relevante de la ciudad. Pay-what-you-can, sugerido $16.","pid":"studiomuseum","who":"both","kind":"destacado","note":"","trav":"🚶 ~14 min a pie · 1.0 km · estimado"},{"t":"13:30","txt":"Subte D desde 125 St hasta Fordham Rd (~20 min). Alternativa: Metro-North desde Harlem-125th a Fordham, 12 minutos.","pid":"","who":"both","kind":"logistica","note":""},{"t":"14:00","txt":"★★ ARTHUR AVENUE (Belmont) — la Little Italy real: carnicerías, panaderos de 1918 y el enclave albanés. Almuerzo: el sándwich de mozzarella fresca de Casa Della Mozzarella (E 187th St) y el Arthur Avenue Retail Market con Mike's Deli adentro. El mercado cierra ~18h y los DOMINGOS no abre: hoy es el único día del viaje que sirve.","pid":"arthurave","who":"both","kind":"destacado","note":""},{"t":"15:40","txt":"Subte D desde Fordham Rd de vuelta a 125 St (~25 min) y caminar a Marcus Garvey Park.","pid":"","who":"both","kind":"logistica","note":""},{"t":"16:30","txt":"★★ CHARLIE PARKER JAZZ FESTIVAL — franja 16:30-18:30 (2 horas justas): la reserva de Hudson VU no es modificable y manda. ⚠️ SALIDA OBLIGADA 18:30: el festival sigue hasta las 19, así que pueden perderse el final del set de cierre de Joshua Redman. El orden por artista no está publicado — VERIFICAR el día anterior en cityparksfoundation.org: si Redman arranca ~17:15, lo ven casi entero.","pid":"charlieparker29","who":"both","kind":"destacado","note":""},{"t":"18:30","txt":"UBER desde Marcus Garvey Park al Ink48 (~20-25 min un sábado a la tarde, ~$25-30). Es lo que garantiza llegar 19:00-19:05. Plan B en subte: salir 18:10, 2/3 desde 125-Lenox hasta Times Sq y 15 min a pie — total ~45 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:20","txt":"EN EL HOTEL — margen para dejar cosas y subir.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:30","txt":"★★ HUDSON VU — drinks y comida, RESERVA NO MODIFICABLE, en el rooftop de SU PROPIO hotel (Ink48). La mesa es de MÁXIMO 90 MINUTOS: cierran ~21:00. Pedir sin vueltas y disfrutar la vista — lo que sigue está a 8 cuadras.","pid":"ink48","who":"both","kind":"destacado","note":""},{"t":"21:00","txt":"Caminata Ink48 → Birdland (315 W 44th): 8 cuadras, 10-12 min. Llegan ~21:15, justo para las puertas del set de las 21:30.","pid":"","who":"both","kind":"logistica","note":""},{"t":"21:30","txt":"★★ BIRDLAND — set de las 21:30: DAVID DEJESUS & THE BOPTET, 'Celebrating Charlie Parker'. El 29/8 es el CUMPLEAÑOS de Bird y Birdland es el club que lleva su nombre: el día cierra en círculo — festival Charlie Parker de día, tributo a Parker de noche. RESERVAR en birdlandjazz.com (cartelera ya publicada). Si prefieren más tarde: Makoto Ozone Trio a las 22:30 en el mismo club. Y si el cansancio de un día que empezó 6 AM en un avión manda, saltearlo no es pecado.","pid":"birdland","who":"both","kind":"destacado","note":""}],"alt":"Si llegan fundidos del vuelo, ARTHUR AVENUE es lo primero que se cae: salteenla, descansen en el hotel 13-16h y lleguen al festival 16:30. El festival y la reserva de Hudson VU son lo irrenunciable del día. OJO: Bill's Place se movió al VIERNES 4/9 por esta reserva — el set del sábado ya no aplica. // Sobre agregar cosas AL LUNES con este recorte: el lunes ya está lleno de 8:45 a 22:48 con dos anclas fijas (Ford Foundation solo abre días hábiles y el 9/11 gratis es 17:30-19:00) — no hay hueco real. El tiempo que libera el festival es del SÁBADO, y Arthur Avenue era lo mejor que quedaba sin agendar de lo que marcaron los dos."},{"n":2,"date":"2026-08-30","dow":"Domingo","who":"both","base":"Ink48","title":"Lower East Side, Chinatown y el Brooklyn Bridge a pie","note":"SALIÓ el día 2 del festival Charlie Parker: los dos lo marcaron 0 en la app (ver dos días seguidos de festival no les cerró). La mañana del Lower East Side queda igual — el domingo sigue siendo el ÚNICO día que sirve para Eldridge Street, que cierra los sábados. La tarde liberada la ocupa el CRUCE DEL BROOKLYN BRIDGE A PIE, que no estaba en ningún día del viaje y desde Chinatown se arranca caminando: la entrada peatonal está en City Hall, a diez minutos de Mott St.","blocks":[{"t":"08:30","txt":"Desayuno rápido y subte F hasta 2 Av.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:15","txt":"★ Russ & Daughters — appetizing store de 1914, cuarta generación de la misma familia. Salmón curado cortado a mano sobre bagel. El mostrador es mejor experiencia que el café de al lado.","pid":"russdaughters","who":"both","kind":"destacado","note":""},{"t":"10:30","txt":"★ Museum at Eldridge Street — sinagoga de 1887 restaurada por $20 millones, con un rosetón nuevo de Kiki Smith. Que hoy esté en el medio de Chinatown es la mitad del punto. CIERRA LOS SÁBADOS: hoy es el día.","pid":"eldridge","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"11:45","txt":"Essex Market — mercado municipal desde 1940. Sigue teniendo carniceros y pescaderos de verdad, no solo puestos para turistas.","pid":"essexmarket","who":"both","kind":"paseo","note":"","trav":"🚶 ~11 min a pie · 0.8 km · estimado"},{"t":"12:45","txt":"Caminata por el Lower East Side: Orchard, Ludlow, Rivington. Tres capas de inmigración en la misma cuadra.","pid":"les","who":"both","kind":"paseo","note":""},{"t":"13:15","txt":"Almuerzo en Chinatown: Mott St y las pescaderías de la calle. El paisaje urbano es el plato fuerte.","pid":"chinatown","who":"both","kind":"comida","note":"","trav":"🚶 ~14 min a pie · 1.0 km · estimado"},{"t":"14:15","txt":"Columbus Park (tai chi y partidas de xiangqi) y Doyers Street, la cuadra torcida que era 'the Bloody Angle'. Diez minutos y de ahí se sale caminando hacia City Hall.","pid":"","who":"both","kind":"paseo","note":""},{"t":"14:45","txt":"★★ CRUZAR EL BROOKLYN BRIDGE A PIE — entrada peatonal frente a City Hall. 30-45 minutos hasta Brooklyn con paradas de foto: el skyline de Lower Manhattan de un lado y el Manhattan Bridge del otro. GRATIS y es una de las cosas que un first-timer no debería saltearse.","pid":"","who":"both","kind":"destacado","note":""},{"t":"16:00","txt":"Bajar en DUMBO: la foto del Manhattan Bridge encuadrado en Washington St, el waterfront, y una parada en TIME OUT MARKET (está ahí mismo y JP lo marcó 2): un vermut con el skyline de frente. OJO: el sábado 5 vuelven de día — no repetir de más.","pid":"dumbo","who":"both","kind":"paseo","note":""},{"t":"17:05","txt":"Subte A/C desde High St hasta Fulton St (2 paradas, ~10 min) y 5 min a pie hasta Dey St.","pid":"","who":"both","kind":"logistica","note":""},{"t":"17:30","txt":"★★ MERCER LABS (21 Dey St, frente al Oculus) — 15 salas inmersivas de arte y tecnología de Roy Nachum: proyecciones, sonido espacial, salas interactivas, a su ritmo. Hasta $57 según franja; TIMED TICKET por Fever, reservar el slot de 17:30 antes de viajar. Los domingos abre hasta las 22.","pid":"mercerlabs","who":"both","kind":"destacado","note":""},{"t":"18:50","txt":"Caminar a The Crown: 1,6 km derecho por Park Row hacia Bowery (~20 min) — o R/W City Hall → Canal St si llueve.","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:15","txt":"★ The Crown (50 Bowery, piso 21) — rooftop sin cover, EN EL ATARDECER (~19:27): el Manhattan Bridge que acaban de cruzar se enciende de frente mientras cae el sol. Es el ángulo que no da ningún observatorio pago — luz, atardecer y noche en un solo trago.","pid":"thecrown","who":"both","kind":"destacado","note":""},{"t":"20:45","txt":"Cena en el East Village / LES: Katz's abre hasta tarde (a esta hora la cola del domingo ya bajó).","pid":"katzs","who":"both","kind":"comida","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"22:15","txt":"Opcional: Nublu (Avenue C) — jazz experimental y afrobeat hasta tarde. A 14 minutos A PIE de Katz's. Lo marcaron 2 los dos.","pid":"nublu","who":"both","kind":"musica","note":"","trav":"🚶 ~14 min a pie · 1.1 km · estimado"}],"alt":"Si cambian de idea con el festival: Ravi Coltrane toca GRATIS en Tompkins Square de 15 a 19h, a cinco cuadras del almuerzo — pueden ir un rato y cruzar el puente otro día. Y ojo: hoy es la ÚLTIMA función de Moulin Rouge! en Broadway, si la quieren hay que decidir ya. // El cruce del puente conviene NO hacerlo más tarde: después de las 16h de un domingo de verano la pasarela se llena."},{"n":3,"date":"2026-08-31","dow":"Lunes","who":"jp","base":"Ink48 → JGStay SoHo (las valijas viajan con Thais)","title":"JP solo · Midtown total: MoMA, Top of the Rock y Birdland","note":"⚠️ DÍA DE JP SOLO. Thais viaja temprano a New Jersey porque EMPIEZA A TRABAJAR — trabaja del 31 de agosto al 3 de septiembre y no participa de nada de NYC en esos días. Ella hace el checkout y se lleva las dos valijas, así que JP arranca libre y sin equipaje desde las 8. El lunes, que suele ser el peor día en NYC, acá es el mejor: el lobby del Chrysler y el Ford Foundation SOLO abren días hábiles, y Birdland tiene su programa de lunes. El MoMA y Top of the Rock encajan justo hoy porque Thais los marcó 0. El 9/11 se MOVIÓ al jueves para hacerlo completo (memorial + museo + One World Observatory en una sola bajada) — se paga la entrada que el lunes era gratis, pero el circuito queda entero y este día gana el observatorio con luz de tarde. CERRADOS hoy: Morgan, Noguchi, Brooklyn Museum, Studio Museum, Transit Museum. Y LA GRAN NOVEDAD: JP ya no duerme en New Jersey — la noche termina en el JGStay SoHo, y la vuelta nocturna a NJ quedó reducida a UNA sola (el miércoles).","blocks":[{"t":"08:00","txt":"THAIS: checkout de Ink48 y tren temprano a New Jersey con LAS DOS valijas — hoy EMPIEZA A TRABAJAR. No participa de nada de este día. JP sale solo con su bolso de dos noches.","pid":"ink48","who":"th","kind":"logistica","note":""},{"t":"08:10","txt":"JP: checkout y subte N/R/W desde 49 St derecho por Broadway hasta Canal St (~15 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"08:35","txt":"Dejar el bolso en la CONSIGNA del JGSTAY SOHO (recepción 24 h; el check-in formal es a la tarde — confirmar la consigna por mensaje). Liviano el resto del día.","pid":"jgstay","who":"jp","kind":"logistica","note":""},{"t":"09:00","txt":"Subte 6 desde Canal St directo hasta Grand Central (~20 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"09:20","txt":"Desayuno adentro de Grand Central, en el dining concourse o en el Grand Central Market — ya estás dentro del edificio que venís a ver.","pid":"grandcentral","who":"jp","kind":"comida","note":""},{"t":"09:45","txt":"Grand Central Terminal: el techo celeste pintado al revés y la Whispering Gallery frente al Oyster Bar.","pid":"grandcentral","who":"jp","kind":"destacado","note":""},{"t":"10:15","txt":"Lobby del Chrysler Building — art déco puro. SOLO lun-vie 8-18h.","pid":"chrysler","who":"jp","kind":"paseo","note":"","trav":"🚶 ~4 min a pie · 0.2 km · estimado"},{"t":"11:00","txt":"Ford Foundation Atrium — jardín de 12 pisos dentro de un edificio de oficinas. PREINSCRIPCIÓN online antes de las 17h de ayer. Solo se puede del 31/8 al 3/9.","pid":"fordfoundation","who":"jp","kind":"destacado","note":"","trav":"🚶 ~9 min a pie · 0.6 km · estimado"},{"t":"11:55","txt":"New York Public Library: Rose Main Reading Room — se ve perfecta por libre (los tours gratuitos son 11:00 y 14:00 y no coinciden con esta pasada; no hacen falta).","pid":"nypl","who":"jp","kind":"paseo","note":"","trav":"🚶 ~20 min a pie (1.4 km) o 🚇 ~15 min · estimado"},{"t":"12:55","txt":"Almuerzo cerca de Bryant Park.","pid":"bryantpark","who":"jp","kind":"comida","note":""},{"t":"13:45","txt":"★ MoMA — a cinco cuadras de la biblioteca. Van Gogh, Picasso, Rothko, Warhol. El cine está INCLUIDO en la entrada.","pid":"moma","who":"jp","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"16:30","txt":"Caminar cuatro cuadras: Rockefeller Center a nivel de calle — la plaza, Atlas y St. Patrick's enfrente, sobre la Quinta.","pid":"","who":"jp","kind":"paseo","note":""},{"t":"17:15","txt":"Cena TEMPRANA en Midtown. Hoy se cena ANTES de subir: la noche está tomada por el arco del observatorio y Birdland. Las valijas viajan con Thais y el bolso ya espera en SoHo.","pid":"","who":"jp","kind":"comida","note":""},{"t":"18:15","txt":"★★ TOP OF THE ROCK — EL ARCO COMPLETO que pidieron: entrada 18:15 con luz plena, el atardecer ~19:28 desde arriba, y la ciudad encendiéndose hasta ~20:05. Es el ÚNICO observatorio con el Empire State dentro del encuadre y Central Park del otro lado. ⚠️ La franja de atardecer es la cara (~$57-65) y la que primero se agota: reservar YA. Thais lo marcó 0: es de hoy.","pid":"topofrock","who":"jp","kind":"destacado","note":""},{"t":"20:10","txt":"Caminar a Birdland: 12 minutos (50th y 6ª → 44th entre 8ª y 9ª).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"20:30","txt":"★ BIRDLAND: Vince Giordano & the Nighthawks — jazz de los años 20 y 30 con instrumentos de época. Institución de los lunes, y el lunes Broadway está oscuro. Birdland está a 8 cuadras de Penn Station.","pid":"birdland","who":"jp","kind":"destacado","note":""},{"t":"22:40","txt":"Birdland ENTERO y sin mirar el reloj: ya NO hay tren que atrapar. Subte A/C/E desde 42 St-Port Authority hasta Canal St (~15 min) y check-in en el JGStay. La noche pasó de terminar 00:35 en New Jersey a ~23:30 en SoHo.","pid":"jgstay","who":"jp","kind":"logistica","note":""}],"alt":"SIN TREN, el lunes cambió de naturaleza: Birdland completo, sobremesa incluida. Si queda pila, el JGStay está a 15-20 min a pie del Village y Smalls tiene jam de lunes hasta tarde. Y si el día pesó, SoHo a las 23:30 es una hora y cinco más de sueño que el plan viejo."},{"n":4,"date":"2026-09-01","dow":"Martes","who":"jp","base":"JGStay SoHo","title":"JP solo · el MET y The Cloisters con un solo ticket","note":"Thais marcó el MET y The Cloisters en 0, así que este es EL día para hacerlos — y el martes es de los pocos que sirven: cierran los miércoles. El mismo ticket de $30 cubre los dos museos el mismo día, así que The Cloisters sale gratis. Thais sigue trabajando en New Jersey, así que hoy también es día de JP solo. CERRADOS hoy: Whitney, Frick, Noguchi, Brooklyn Museum, 9/11, MoMA PS1, Transit Museum y Studio Museum — por eso el martes es día de MET, que abre.","blocks":[{"t":"08:20","txt":"Desayuno INCLUIDO en el JGStay (7-9 AM) — primera mañana del viaje sin tren ni madrugón: el MET abre 10:00 y Canal St está en la puerta.","pid":"jgstay","who":"jp","kind":"comida","note":""},{"t":"09:10","txt":"Subte 6 directo desde Canal St hasta 86 St (~35 min): se llega justo a la apertura del MET.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"10:00","txt":"★★ THE METROPOLITAN MUSEUM OF ART — es inagotable, así que elegí DOS alas y hacelas bien: egipcio + pintura europea, o armas y armaduras + arte islámico. $30 (el pay-what-you-wish es solo para residentes de NY y estudiantes de NY/NJ/CT).","pid":"met","who":"jp","kind":"destacado","note":""},{"t":"13:15","txt":"Almuerzo RÁPIDO cerca del MET (30-40 min): hoy la tarde tiene museo con hora de cierre.","pid":"","who":"jp","kind":"comida","note":""},{"t":"13:50","txt":"Al Cloisters: NO hay tren A en el lado este — la ruta real en subte es M86-SBS cruzando el parque + B/C hasta 168 St + A hasta 190 St (~55 min). El taxi/Uber directo (~25 min, $28-35) compra 40 minutos de museo: hoy se justifica.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"14:30","txt":"★ THE MET CLOISTERS — arte medieval en un edificio armado con claustros franceses reales, sobre un acantilado del Hudson. INCLUIDO en el ticket del MET del mismo día: guardá el sticker.","pid":"cloisters","who":"jp","kind":"destacado","note":""},{"t":"17:00","txt":"Fort Tryon Park — el Hudson y los Palisades sin un solo edificio a la vista. Media hora honesta: el parque ya rodea al Cloisters, y la noche de hoy tiene tres paradas.","pid":"forttryon","who":"jp","kind":"paseo","note":"","trav":"🚶 ~5 min a pie · 0.3 km · estimado"},{"t":"17:30","txt":"Tren A desde 190 St directo hasta W 4 St-Washington Sq (~35 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"18:10","txt":"Washington Square Park (JP lo marcó 2): el arco, los músicos y las mesas de ajedrez al caer la tarde. Veinte minutos.","pid":"washingtonsq","who":"jp","kind":"paseo","note":""},{"t":"18:35","txt":"Bajar MacDougal St — la cuadra folk de los 60s (Caffe Reggio, el viejo Gaslight) — hasta Houston: 8-10 min y es paseo, no traslado.","pid":"","who":"jp","kind":"paseo","note":""},{"t":"18:45","txt":"★★ HAMBURGER AMERICA (155 W Houston St) — MUST de JP: el counter de George Motz, el historiador de la hamburguesa americana. Pedir la fried-onion burger estilo Oklahoma y mirar el griddle trabajar. ~$15-20. SIN RESERVAS, orden de llegada — un martes 18:45 la fila es manejable, y el counter rota rápido.","pid":"hamburgerica","who":"jp","kind":"destacado","note":"","trav":"🚶 ~10 min a pie · 0.8 km · estimado"},{"t":"19:30","txt":"Caminar al Village Vanguard: 1 km derecho por 7th Av South (~15 min). Llegando 19:45 todavía hay asiento decente (la entrada abre 19:00, es por orden de llegada).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"20:00","txt":"★★ VILLAGE VANGUARD — John Patitucci Trio con Chris Potter y Brian Blade. Set de las 20:00, entrada 19:00. 123 asientos: reservar YA en vv.squadup.com.","pid":"vanguard","who":"jp","kind":"destacado","note":""},{"t":"22:15","txt":"OPCIONAL de costo cero en fricción: SMALLS o MEZZROW, a 3 minutos a pie del Vanguard — los dos los marcaron 2/2, no hay tren que atrapar y el JGStay queda a 15-20 min a pie cruzando el Village. $25 con un trago; Smalls tiene jam hasta la madrugada.","pid":"smalls","who":"jp","kind":"musica","note":""}],"alt":"El MET y The Cloisters el mismo día son ~6 horas de museo. Si es demasiado: hacé solo el MET hasta las 15h y usá la tarde para Inwood Hill Park (el único bosque primario que queda en Manhattan, con cuevas de los Lenape), que está tres paradas más al norte. El Tenement Museum quedó afuera: los dos lo bajaron a 'quizás'."},{"n":5,"date":"2026-09-02","dow":"Miércoles","who":"jp","base":"JGStay SoHo → New Jersey (la ÚNICA vuelta nocturna)","title":"JP solo · Historia Natural, Frick gratis y McBride en Central Park","note":"Thais trabaja en New Jersey hasta mañana, así que sigue siendo día de JP solo, y se aprovecha para lo que ella marcó 0: el Museo de Historia Natural y el Frick. El miércoles el Frick es pay-what-you-wish de 13:30 a 17:30, así que sale casi nada. Cierra el MET, pero hoy no hace falta: ya se hizo ayer. El teleférico a Roosevelt Island se fue al domingo: lo marcaron 2 los dos, así que corresponde a un día de a dos. ⚠️ OJO CON LA NOCHE: hoy es LA ÚNICA vuelta a New Jersey que quedó en el viaje (para volver mañana con las maletas), y mañana se madruga 5:45. Cenar TEMPRANO y no perder el tren de las 22:48.","blocks":[{"t":"08:15","txt":"Desayuno incluido en el JGStay y CHECKOUT: el bolso queda en la CONSIGNA — se retira a la tarde, en el hueco libre del día.","pid":"jgstay","who":"jp","kind":"comida","note":""},{"t":"09:15","txt":"Subte A o C desde Canal St hasta 81 St-Museum of Natural History (~30 min).","pid":"","who":"jp","kind":"logistica","note":""},{"t":"10:00","txt":"★ AMERICAN MUSEUM OF NATURAL HISTORY — dinosaurios, la ballena azul y el Gilder Center nuevo de Studio Gang. $37. Thais lo marcó 0: es de hoy.","pid":"amnh","who":"jp","kind":"destacado","note":""},{"t":"12:45","txt":"Almuerzo y cruzar Central Park de oeste a este (20 min a pie).","pid":"","who":"jp","kind":"comida","note":""},{"t":"13:45","txt":"★ THE FRICK COLLECTION — pay-what-you-wish los miércoles 13:30-17:30. Vermeer, Rembrandt y Bellini colgados como en una casa, porque era una casa. Online el mínimo es $5; para pagar menos hay que ir en persona y no hay garantía de lugar.","pid":"frick","who":"jp","kind":"destacado","note":"","trav":"🚶 ~25 min a pie (1.6 km) o 🚇 ~15 min · estimado"},{"t":"16:30","txt":"El hueco libre ahora tiene una función: subte 6 desde 68 St hasta Canal St, RETIRAR EL BOLSO de la consigna del JGStay, y 6 de vuelta hasta 68 St (~1h10 el circuito completo). El bolso viaja esta noche a New Jersey. La cena temprana de las 17:45 sigue en pie.","pid":"jgstay","who":"jp","kind":"logistica","note":""},{"t":"17:45","txt":"Subte 6 al sur. Cena TEMPRANA cerca de Central Park: hoy no hay cena tardía posible, el tren manda.","pid":"","who":"jp","kind":"comida","note":""},{"t":"18:45","txt":"Entrar a Rumsey Playfield. Puertas 18:00 y con este cartel se llena: cuanto antes, mejor lugar.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"19:00","txt":"★★ SUMMERSTAGE: Christian McBride + SAMARA JOY + Mei Semones — Verve 70 aniversario y Getz/Gilberto. GRATIS, sin ticket, Rumsey Playfield, 19:00-22:00.","pid":"summerstage","who":"jp","kind":"destacado","note":""},{"t":"22:00","txt":"Salir del parque por la 72 y subte 1/2/3 hasta 34 St-Penn Station. Son 25-30 min puerta a puerta: llegás a Penn 22:25-22:30, con 18-23 min de colchón.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"22:48","txt":"NJ Transit DIRECTO Penn → Raritan (tren 5197), llega 00:04. $18,50. ⚠️ ES EL TREN CRÍTICO: si lo perdés, la próxima llegada a Raritan es 01:31.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"00:15","txt":"Uber Raritan → Residence Inn (pedirlo antes de subir al tren). Mañana: despertador 5:45 para el tren de las 6:55 con las maletas.","pid":"residenceinn","who":"jp","kind":"logistica","note":""}],"alt":"Si el AMNH es demasiado museo dos días seguidos (ayer fueron el MET y The Cloisters), salteálo y usá la mañana para Inwood Hill Park o para caminar el Upper West Side sin plan. El Frick y el SummerStage son los dos anclas del día: uno es casi gratis solo hoy, el otro pasa una sola vez. // ⚠️ LA DECISIÓN DE LA NOCHE, con los horarios ya verificados: el directo de las 21:48 llega a Raritan 23:10 y al hotel ~23:30, o sea UNA HORA MÁS DE SUEÑO antes de un jueves que arranca 5:45 con maletas. Pero para tomarlo hay que salir del SummerStage a las 21:05 — el colchón es de 3 a 8 minutos, no hay margen — y te perdés el final de Christian McBride y Samara Joy, que es el plato fuerte y pasa una sola vez. Mi recomendación: quedate hasta el final y tomá el de las 22:48. La hora de sueño no convierte el jueves en un día fácil, y el show no se repite."},{"n":6,"date":"2026-09-03","dow":"Jueves","who":"jp","base":"New Jersey → The Beacon","title":"Traslado + World Trade Center completo + ferry con Thais","note":"La mañana y la primera tarde son el World Trade Center completo — memorial, museo y One World Observatory en una sola bajada. OJO: One World es EL MIRADOR DE DÍA a propósito — su vista es el puerto y el agua, que de noche es negra; los arcos de atardecer van en Top of the Rock (lunes) y SUMMIT (viernes). THAIS ESTÁ EN NYC CON SU EQUIPO este jueves y SE LIBERA A LAS 16:00: se encuentran por Manhattan y se van juntos al Museum of the Moving Image, que es GRATIS los jueves de 14 a 18 — estaba caído del plan y ustedes lo tienen 2/2: RECUPERADO. El día cierra con check-in, cena y Dizzy's. Siguen afuera MoMA PS1, Astoria y Gantry (no hay hueco), y el Staten Island Ferry pasó a la alternativa nocturna de hoy.","blocks":[{"t":"06:20","txt":"Uber desde el Residence Inn a la estación Raritan (~20 min, $14-20). PEDIRLO LA NOCHE ANTERIOR: Branchburg es semi-rural y a esa hora puede no haber autos.","pid":"residenceinn","who":"jp","kind":"logistica","note":""},{"t":"06:55","txt":"NJ Transit Raritan → NY Penn Station. Llega 8:20. $18,50. Con maletas, ir al vagón con espacio de equipaje.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"08:30","txt":"Subte 1/2/3 desde 34 St-Penn Station hasta 72 St. Diez minutos, directo.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"08:45","txt":"★ THE BEACON — dejar las maletas en el bell desk. El check-in formal es a la tarde, con Thais, pero el equipaje se puede dejar desde temprano. Confirmalo por mail antes de viajar.","pid":"beacon","who":"jp","kind":"destacado","note":""},{"t":"09:15","txt":"Subte 1 directo desde 72 St hasta WTC Cortlandt (~30 min). Alternativa: 2/3 express hasta Chambers St y 5 min a pie.","pid":"","who":"jp","kind":"logistica","note":""},{"t":"09:50","txt":"★ 9/11 MEMORIAL (la plaza) — las dos fuentes en las huellas de las torres y el Survivor Tree. Gratis, abierto desde las 8:00. Verlo ANTES del museo ordena la visita.","pid":"","who":"jp","kind":"destacado","note":""},{"t":"10:30","txt":"★★ 9/11 MEMORIAL MUSEUM — $36, TIMED TICKET OBLIGATORIO comprado online antes (el museo no vende en puerta sin reserva). 2 horas largas; es duro y muy bien hecho. Thais lo marcó 0: por eso va en la mañana de JP solo.","pid":"911museum","who":"jp","kind":"destacado","note":""},{"t":"12:45","txt":"Almuerzo cruzando West St: Hudson Eats o Le District, en Brookfield Place, con el yate harbor de fondo.","pid":"","who":"jp","kind":"comida","note":""},{"t":"13:45","txt":"★★ ONE WORLD OBSERVATORY — piso 102, el punto más alto del hemisferio occidental, con el puerto y Brooklyn dominando la vista. $44+fee, ventana de entrada de 15 min: sacar el timed ticket online. JP lo subió a 2 en la última pasada.","pid":"owo","who":"jp","kind":"destacado","note":"","trav":"🚶 ~4 min a pie · 0.2 km · estimado"},{"t":"15:15","txt":"El Oculus en un VISTAZO (5 min — ya estás ahí, y el tiempo no da para más) y R/W desde Cortlandt St hacia el norte.","pid":"oculus","who":"jp","kind":"paseo","note":"","trav":"🚶 ~4 min a pie · 0.3 km · estimado"},{"t":"16:00","txt":"★ ENCUENTRO CON THAIS. Lo que MÁS rinde: verse DIRECTO en la puerta del MoMI a las 16:20 (36-01 35 Ave, N/W hasta 36 Av) — cada uno llega por su lado y el museo gana 10-15 min. Si prefieren encontrarse antes en Manhattan: Lexington Av-59 St 16:00 y N/W juntos (JP puede llegar 16:05-16:10 si el WTC se estiró: avisale que es ±10).","pid":"","who":"both","kind":"destacado","note":""},{"t":"16:30","txt":"★★ MUSEUM OF THE MOVING IMAGE — GRATIS los jueves 14-18, sus únicas horas del jueves. RECUPERADO: había quedado afuera del plan y ustedes lo tienen 2/2. Una hora y media alcanza para Behind the Screen y los Muppets originales de Jim Henson. Cierra 18:00 EN PUNTO. (N/W hasta 36 Av + 8 min a pie.)","pid":"momi","who":"both","kind":"destacado","note":"","trav":"🚇 ~40 min en subte · 11.5 km (a pie 155 min) · estimado"},{"t":"18:05","txt":"Subte N/W desde 36 Av hasta Times Sq y 1/2/3 hasta 72 St (~45 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"18:55","txt":"The Beacon: check-in formal y subir las maletas.","pid":"beacon","who":"both","kind":"logistica","note":""},{"t":"19:45","txt":"Cena en el Upper West Side, bajando por Broadway o Columbus hacia los 60s — así la noche queda en línea recta hacia Lincoln Center y Dizzy's.","pid":"","who":"both","kind":"comida","note":""},{"t":"20:30","txt":"★ LINCOLN CENTER DE NOCHE (gratis, 20-25 min) — la plaza de Revson con la fuente iluminada, los chandeliers del Met Opera a través del vidrio y el espejo de agua con el Henry Moore. Las salas grandes están entre temporadas (la Filarmónica de Dudamel abre el 10/9), así que ESTO es Lincoln Center esta semana — y lo que sigue también: Dizzy's ES Jazz at Lincoln Center, a 4 cuadras.","pid":"lincolncenter","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.3 km) o 🚇 ~15 min · estimado"},{"t":"21:00","txt":"★ Dizzy's Club (Columbus Circle, a diez cuadras del hotel) — ventanales sobre Central Park detrás del escenario. SEAMOS HONESTOS: JP lleva ~17 horas en pie con 5 de sueño. Decidan A LAS 20:00, no antes: si están enteros, es un cierre precioso; si no, saltearlo es lo sensato y el viaje tiene cuatro noches de jazz más. El set Late Night (~22:45) cuesta una fracción — variante para valientes.","pid":"dizzys","who":"both","kind":"musica","note":"","trav":"🚶 ~8 min a pie · 0.6 km · estimado"}],"alt":"⚠️ EL PROBLEMA DE LA NOCHE ANTERIOR: si JP viaja desde New Jersey el jueves, significa que durmió allá el miércoles — y el miércoles el SummerStage termina a las 22:00 en Central Park. Llegando a Penn ~22:25 se toma el directo de las 22:48, que deja en Raritan ~0:04, más Uber: llegada al hotel ~0:25 y despertador a las 5:45. Son cinco horas de sueño antes de un día completo. Tres salidas: (a) salir del SummerStage a las 21:15, después del set principal; (b) quedarse una noche más en el JGStay y que Thais lleve las maletas el jueves (implica tocar la reserva); (c) tomar el tren de las 7:13 en vez del de 6:55 y arrancar 20 minutos más tarde. Verificá los horarios exactos de la tarde-noche en njtransit.com: solo tengo confirmado el directo de las 22:48. // EL FERRY, SI LES DUELE (lo tienen 2/2): al salir del MoMI, W directo hasta Whitehall (~50 min), ferry ~19:15 — el atardecer (~19:22) de ida y la Estatua y el skyline ILUMINADOS de vuelta; check-in ~21:15, cena tarde cerca del hotel, y Dizzy's tiene set Late Night los jueves ~22:45 como consuelo. Es MÁS día: elíjanlo solo si llegan enteros. // Siguen afuera: MoMA PS1, Astoria y Gantry (sin hueco); ya habían salido Noguchi, Astoria Park y Socrates por interés bajo."},{"n":7,"date":"2026-09-04","dow":"Viernes","who":"both","base":"The Beacon","title":"Vessel + High Line, SUMMIT al atardecer y Morgan gratis","note":"Salieron el West Village, Washington Square y el Whitney; entraron el High Line, THE VESSEL (al pie del arranque, $10 y 45 min), la Morgan (hoy GRATIS 17-20) y SUMMIT — que se movió AL ATARDECER por el pedido de ustedes: entrada 18:10, luz plena, la puesta ~19:21 multiplicada por los espejos de Kusama (es EL lugar de la ciudad para ese momento) y la noche encendida hasta las 20:15. EL PAGO, dicho honesto: la Morgan se hace en una hora entrando 17:00 en punto, y la cena de hoy es un bocado rápido — por eso el almuerzo en Chelsea Market es EL fuerte del día.","blocks":[{"t":"09:15","txt":"Subte a Hudson Yards.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:40","txt":"La plaza de Hudson Yards mientras abre el Vessel: The Shops y el Shed desde afuera. Sacar el timed ticket de las 10:00 online antes.","pid":"","who":"both","kind":"paseo","note":""},{"t":"10:00","txt":"★ THE VESSEL — la escalera infinita de Heatherwick: 154 tramos, 2.500 escalones, $10. Reabierto con redes; algunos tramos altos hacia el Hudson siguen cerrados, y hay ascensor cada 15 min. Subir es la única forma de entenderla. Si Thais prefiere no subir, la plaza está al pie.","pid":"vessel","who":"both","kind":"destacado","note":""},{"t":"10:50","txt":"★ THE HIGH LINE completo, de norte a sur (2,3 km) — arranca ahí mismo, en 30th y 10ª. Vía ferroviaria elevada convertida en parque lineal. Incluye el Buda de arenisca de 9 metros de Tuan Andrew Nguyen.","pid":"highline","who":"both","kind":"destacado","note":"","trav":"🚶 ~12 min a pie · 0.9 km · estimado"},{"t":"12:20","txt":"Little Island — el parque flotante de Heatherwick sobre 132 macetas de hormigón, al final del High Line. Gratis.","pid":"littleisland","who":"both","kind":"paseo","note":"","trav":"🚶 ~15 min a pie · 1.1 km · estimado"},{"t":"13:00","txt":"Galerías de Chelsea COMPLETAS — W 19th a W 27th entre la 10ª y la 11ª, concentradas en W 24th y W 21st (Gagosian, Pace, Zwirner). Gratis, se entra y se sale. El recorte del Vessel se devolvió: SUMMIT pasó al atardecer y la tarde se estiró.","pid":"","who":"both","kind":"destacado","note":"Abren mar-sáb ~10-18h."},{"t":"14:30","txt":"Almuerzo en Chelsea Market — COMER FUERTE: es la comida grande del día, la cena de hoy es un bocado entre el SUMMIT y Bill's Place. Los Tacos No.1 o Very Fresh Noodles.","pid":"chelseamarket","who":"both","kind":"comida","note":"","trav":"🚶 ~7 min a pie · 0.5 km · estimado"},{"t":"15:50","txt":"A Grand Central SIN desandar: L desde 14 St-8 Av hasta Union Sq y 4/5 exprés hasta Grand Central (~20 min puerta a puerta). Volver caminando a Hudson Yards sería 1,9 km al revés.","pid":"","who":"both","kind":"logistica","note":""},{"t":"16:20","txt":"Grand Central PARA THAIS: el techo celeste, la Whispering Gallery y el mercado — JP ya lo vio el lunes, ella no, y está literalmente abajo del SUMMIT.","pid":"grandcentral","who":"both","kind":"paseo","note":""},{"t":"17:00","txt":"★ MORGAN LIBRARY — GRATIS los viernes 17-20h: entrar 17:00 EN PUNTO y hacerla en una hora — la biblioteca son tres salas gloriosas (estanterías de nogal, la Biblia de Gutenberg): alcanza. RESERVA OBLIGATORIA, se libera el viernes 28 de agosto. Está a 8 min a pie de One Vanderbilt.","pid":"morgan","who":"both","kind":"destacado","note":"","trav":"🚶 ~9 min a pie · 0.7 km · estimado"},{"t":"18:00","txt":"Caminar de vuelta las seis cuadras a One Vanderbilt (~8-10 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"18:10","txt":"★★ SUMMIT ONE VANDERBILT — EL ARCO COMPLETO: entrada 18:10 con luz, el atardecer ~19:21 multiplicado por los espejos infinitos de Kusama, y la noche encendida hasta ~20:15. Ticket ATARDECER $57-63 — es la franja que primero se agota: reservar YA. NO está en ningún pase.","pid":"summit","who":"both","kind":"destacado","note":""},{"t":"20:20","txt":"Bocado rápido EN GRAND CENTRAL (dining concourse, están arriba — la comida grande fue el almuerzo), shuttle S a Times Sq y 2/3 exprés hasta 135 St. Así llegan 21:20-21:25; por Penn a pie llegaban 21:39 a un set de 21:30.","pid":"","who":"both","kind":"comida","note":""},{"t":"21:30","txt":"★★ BILL'S PLACE (148 W 133rd St) — speakeasy en el living de un brownstone de la vieja Swing Street. Bill Saxton & the Harlem All-Stars, viernes 21:30, BYOB (compren una botella antes). MOVIDO acá desde el sábado por la reserva de Hudson VU. COMPRAR EL SET ONLINE: la sala es diminuta.","pid":"billsplace","who":"both","kind":"destacado","note":"","trav":"🚇 ~35 min en subte · 9.8 km (a pie 135 min) · estimado"}],"alt":"El Whitney es gratis hoy de 17 a 22h, pero choca con la Morgan y ustedes lo bajaron a 'quizás' mientras que la Morgan quedó en 2. Si igual lo prefieren, el ticket gratis es OBLIGATORIO y el Whitney ahora cierra los martes. ALTERNATIVAS DE NOCHE si Bill's Place se agota o Harlem queda lejos: Mezzrow o Smalls en el West Village ($25 con bebida, Smalls tiene jam de madrugada los viernes desde la 1:00), o el Blue Note — el 4 y 5 de septiembre toca Chief Adjuah."},{"n":8,"date":"2026-09-05","dow":"Sábado","who":"both","base":"The Beacon","title":"Brooklyn, Peter Luger, un PLAY y Café Wha hasta la madrugada","note":"La gran noche del viaje, rearmada a pedido: el musical SALIÓ y entraron un PLAY de Broadway a las 19:30 y el CAFÉ WHA a las 23:45 — el sótano del Village donde debutaron Dylan y Hendrix, con reserva gratis ya pedida por Eventbrite. La cena temprana en Peter Luger (17:00) ahora existe exactamente para esto: porterhouse → telón → medianoche de soul y funk. Frankel's sigue afuera (a un porterhouse no se llega con un pastrami encima) y Westlight sigue opcional. ⚠️ La noche termina ~1:15-1:30: el domingo no tiene NADA fijo hasta las 16:00.","blocks":[{"t":"08:15","txt":"Salir 8:15: 1/2/3 desde 72 St + transbordo a A/C hasta High St son ~40-45 min REALES. Llegar temprano a DUMBO es la diferencia entre la foto y la cola de fotos.","pid":"","who":"both","kind":"logistica","note":""},{"t":"09:00","txt":"★ Brooklyn Bridge Park y DUMBO — muelles reconvertidos con el skyline de Lower Manhattan de frente, y la foto del Manhattan Bridge encuadrado en Washington y Water.","pid":"brooklynbridgepark","who":"both","kind":"destacado","note":""},{"t":"10:30","txt":"Brooklyn Heights Promenade — la postal clásica del skyline sobre el BQE.","pid":"bhpromenade","who":"both","kind":"paseo","note":"","trav":"🚶 ~8 min a pie · 0.6 km · estimado"},{"t":"11:15","txt":"★ NEW YORK TRANSIT MUSEUM — una estación de subte clausurada de 1936 con 20 vagones históricos en las vías originales; se puede subir a todos. $10. Cierra lunes y martes, así que hoy es el día.","pid":"transitmuseum","who":"both","kind":"destacado","note":""},{"t":"12:45","txt":"Almuerzo en Downtown Brooklyn.","pid":"","who":"both","kind":"comida","note":""},{"t":"13:45","txt":"Subte a Williamsburg.","pid":"","who":"both","kind":"logistica","note":""},{"t":"14:15","txt":"★ Domino Park — ex refinería de azúcar; el paseo elevado pasa entre la maquinaria industrial conservada, con el Williamsburg Bridge y Midtown enfrente.","pid":"domino","who":"both","kind":"destacado","note":""},{"t":"15:15","txt":"Paseo por Williamsburg: Bedford Ave, disquerías y vintage. OPCIONAL si quieren la panorámica: Westlight (piso 22, sin cover, un trago) — lo bajaron a 'quizás', así que es prescindible. NO comer nada: lo que viene lo merece.","pid":"","who":"both","kind":"paseo","note":""},{"t":"16:45","txt":"Caminar por Bedford/Driggs hasta el pie del Williamsburg Bridge (~15 min).","pid":"","who":"both","kind":"logistica","note":""},{"t":"17:00","txt":"★★ PETER LUGER (178 Broadway) — el porterhouse for two de 1887, dry-aged en el sótano, con la tocineta gruesa de entrada. ~$160-200 los dos con sides y propina. ⚠️ SIN TARJETAS DE CRÉDITO: efectivo, débito US o cheque — llevar cash. Cena temprana a propósito: el teatro espera. RESERVA EN RESY YA.","pid":"peterluger","who":"both","kind":"destacado","note":""},{"t":"18:45","txt":"A la zona de teatros: subte J desde Marcy Av hasta Essex St y F hasta 42 St-Bryant Park (~35 min con transbordo), o directamente Uber al teatro (~20-25 min, $25-35 — un sábado a la noche el puente puede estar cargado).","pid":"","who":"both","kind":"logistica","note":""},{"t":"19:30","txt":"★★ PLAY DE BROADWAY — mi recomendación: STRANGER THINGS: THE FIRST SHADOW (Marquis, desde ~$76): la maquinaria escénica que ganó el Tony — para quien viene de Mercer Labs, el mismo músculo llevado al teatro. Alternativas esa semana: Harry Potter and the Cursed Child, Paranormal Activity, The Imaginary Invalid. COMPRA FIRME esta semana y verificar el horario real de la función (19:00/19:30/20:00): tiene que terminar ~22:00 para lo que sigue.","pid":"strangerthings","who":"both","kind":"destacado","note":""},{"t":"22:00","txt":"Subte 1 desde Times Sq hasta Christopher St (~15 min) y caminar al corazón del Village.","pid":"","who":"both","kind":"logistica","note":""},{"t":"22:30","txt":"Paseo sin apuro por Bleecker y MacDougal — la esquina folk de los 60s de noche, un café o un trago corto. El único objetivo real: estar en la puerta del Wha a las 23:10.","pid":"","who":"both","kind":"paseo","note":""},{"t":"23:15","txt":"★★ CAFÉ WHA — LLEGAR 23:10-23:15: la reserva de Eventbrite NO garantiza admisión y a las 23:30 EN PUNTO liberan los asientos vacíos al standby. TODOS los de la reserva presentes. Set 2 de la house band 23:45-~1:15: soul y funk a máquina en el sótano donde debutaron Dylan, Hendrix y Springsteen. $20 por cabeza van a la cuenta + consumo. Vuelta: subte 1 Christopher St → 72 St (~25 min) o taxi.","pid":"cafewha","who":"both","kind":"destacado","note":""}],"alt":"SOBRE PETER LUGER: la mesa de las 17:00 es la realista — y ahora es la única que funciona: el play manda. PLAN B si no hay mesa: correr Peter Luger al ALMUERZO del mismo día (12:45). // SI EL CANSANCIO GANA A LAS 22:00: el Café Wha es la pieza sacrificable — la reserva es gratis y no penaliza no ir; el play, pagado, no. // Sigue afuera: Bar LunÀtico y Barbès (Bed-Stuy/Park Slope), sin noche posible."},{"n":9,"date":"2026-09-06","dow":"Domingo","who":"both","base":"The Beacon (checkout) → EWR","title":"Checkout, Central Park, Roosevelt Island y vuelo","note":"El día arranca con el CHECKOUT de The Beacon: hacerlo temprano y dejar las valijas en el bell desk libera el día entero. El vuelo sale 23:40, así que hay margen — pero es el domingo del fin de semana largo de Labor Day, la noche de mayor tráfico del año, y EWR va a estar cargado. Por eso todo queda dentro del eje Central Park - Upper East Side, a diez minutos de subte del hotel, y se sale con 2h45 de anticipación.","blocks":[{"t":"09:00","txt":"Desayuno SIN despertador temprano: anoche terminó ~1:30 en el Village y lo único con hora fija hoy es el Guggenheim a las 16:00. Dormir un poco más está permitido.","pid":"","who":"both","kind":"comida","note":""},{"t":"09:45","txt":"★ CHECKOUT de The Beacon y dejar las valijas en el bell desk. El checkout formal suele ser 11:00-12:00, pero hacerlo antes libera el día.","pid":"beacon","who":"both","kind":"destacado","note":""},{"t":"10:15","txt":"★ CENTRAL PARK cruzando de oeste a este: Bethesda Terrace, el Ramble, Bow Bridge. Se entra por la 72 desde Broadway, a tres cuadras del hotel.","pid":"centralpark","who":"both","kind":"destacado","note":"","trav":"🚶 ~20 min a pie (1.5 km) o 🚇 ~15 min · estimado"},{"t":"12:30","txt":"Almuerzo en el Upper East Side, saliendo del parque por la Quinta.","pid":"","who":"both","kind":"comida","note":""},{"t":"13:30","txt":"Bajar a 59 St y 2ª Av: subte 6 desde 68 St-Hunter College (el 4/5 exprés NO para ahí), o caminando por la Quinta si el día está lindo.","pid":"","who":"both","kind":"logistica","note":""},{"t":"13:50","txt":"★ ROOSEVELT ISLAND TRAMWAY ($3, OMNY) — cruza el East River a 76 metros de altura con el Queensboro Bridge al lado. Es la vista de $50 por el precio de un viaje de subte.","pid":"tram","who":"both","kind":"destacado","note":""},{"t":"14:25","txt":"FDR Four Freedoms Park — del teleférico son ~20 min a pie por el borde del río. La última obra de Louis Kahn: granito, plátanos y una sala abierta al río apuntando a Manhattan. Gratis y vacía. Se pasa por las ruinas del Smallpox Hospital.","pid":"fdrpark","who":"both","kind":"paseo","note":""},{"t":"15:05","txt":"SALIR 15:05 (no más tarde): caminata al teleférico + cruce + subte 4/5/6 de 59 St a 86 St suman ~50 min, y la ventana pay-what-you-wish del Guggenheim arranca 16:00 y el museo cierra 17:30 — llegar puntuales ES la visita.","pid":"","who":"both","kind":"logistica","note":""},{"t":"16:00","txt":"★ GUGGENHEIM — pay-what-you-wish domingos 16:00-17:30 (sugerido $10, mínimo $1). El edificio de Frank Lloyd Wright vale la visita solo: se sube en ascensor y se baja caminando la rampa. ⚠️ LLAMAR ANTES: la rotonda estaría en montaje hasta el 18 de septiembre y el pay-what-you-wish no está confirmado en fuente oficial.","pid":"guggenheim","who":"both","kind":"destacado","note":""},{"t":"17:45","txt":"Volver caminando por Central Park hasta el hotel (~25 min) o subte 86 St → 1 a 79 St.","pid":"beacon","who":"both","kind":"logistica","note":""},{"t":"18:30","txt":"Retirar las valijas del bell desk. Cena tranquila cerca del hotel: es la última.","pid":"","who":"both","kind":"comida","note":""},{"t":"19:40","txt":"Salir de The Beacon. Subte 1/2/3 desde 72 St hasta 34 St-Penn Station: ~10 min, $3.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:14","txt":"NJ Transit Penn Station → EWR, llega 20:38. $17,25 (incluye el AirTrain). VERIFICAR el horario dominical en njtransit.com unos días antes.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:45","txt":"AirTrain hasta la terminal: 10-15 min.","pid":"","who":"both","kind":"logistica","note":""},{"t":"20:55","txt":"En terminal. Faltan 2h45 para el vuelo de las 23:40 — correcto para un internacional en el domingo de Labor Day, que es la noche de más tráfico del año en EWR.","pid":"","who":"both","kind":"logistica","note":""}],"alt":"COLCHÓN: si algo se atrasa, el tren siguiente sale 20:55 y llega a EWR 21:16, o sea terminal ~21:35 y 2h05 antes del vuelo. Es el último que yo tomaría. // Si prefieren un último día sin moverse, salteen el teleférico y estiren Central Park hasta el Guggenheim: el parque solo da para toda la mañana y la tarde. Y si el Guggenheim tiene la rotonda cerrada, el Whitney abre los domingos. Lo que NO conviene hoy es meter algo nuevo y grande."}],"extras":{"transport":{"ewr_llegada":{"titulo":"EWR → Ink48 · sábado 29 de agosto, 6:00 AM","reco":"AirTrain + NJ Transit","opciones":[{"m":"AirTrain + NJ Transit ✅","costo":"$17,25","tiempo":"~55-70 min desde terminal","det":"Precio ÚNICO: ya incluye el fee de AirTrain de $8,75, no se compra aparte. Trenes sábado desde EWR: 6:00, 6:07, 6:43, 7:04, 7:15, 7:25, 7:39. Viaje 26-31 min. Comprar en la app MyTix o en máquina — a bordo cobran $5 de recargo.","total":"~$30-35 p/p con el taxi de Penn Station al hotel"},{"m":"Taxi oficial de EWR","costo":"~$78-90","tiempo":"45-60 min","det":"Tarifa fija por zona: Ink48 está en la calle 48 = Zona 2 = $65 fijo, + $2 de airport fee + $6,75-15,75 de peajes + $1 por valija. El recargo de hora pico ($10) rige sáb-dom 12-21h, así que a las 6-7 AM NO aplica."},{"m":"Uber / Lyft","costo":"$70-110 (estimado)","tiempo":"45-60 min","det":"A las 7 AM de un sábado el tráfico es liviano. Ink48 está dentro de la zona de congestion pricing (sur de la calle 60): hay recargo adicional."},{"m":"Newark Airport Express ❌","costo":"$18-19 (NO CONFIRMADO)","tiempo":"60-80 min","det":"No aporta nada frente al tren: más caro, más lento, sujeto al tráfico del Lincoln Tunnel, y deja en Port Authority a 15 min caminando del hotel. Las fuentes se contradicen sobre el precio."}],"secuencia":"Aterrizan 6:00 → migraciones y equipaje 45-75 min → AirTrain ~10-12 min → tren de 7:25 o 7:39 → Penn Station 7:51/8:07 → hotel 8:15-8:30. Total ≈ 2h15-2h30 desde que tocan pista.","alerta":"El AirTrain de Newark está en obra de reemplazo hasta 2030. El servicio por bus solo aplica días de semana de 5:00 a 15:00 — sus dos vuelos caen en fin de semana, así que están cubiertos. Igual reverifiquen 2-3 días antes en njtransit.com."},"ewr_salida":{"titulo":"The Beacon → EWR · domingo 6 de septiembre, vuelo 23:40","reco":"Subte 1/2/3 + NJ Transit — $20,25 total","opciones":[{"m":"Subte + NJ Transit ✅","costo":"$20,25","tiempo":"~55 min + AirTrain","det":"1/2/3 desde 72 St (a 3 cuadras del hotel) hasta 34 St-Penn Station, directo, ~10 min, $3. Después NJ Transit a EWR, $17,25. Trenes domingo: 19:51→20:12, 20:03→20:26, 20:07→20:31, 20:14→20:38, 20:55→21:16.","total":"Salir del hotel 19:40 → tren de 20:14 (llega 20:38) → AirTrain → en terminal ~20:55, con 2h45 de margen. Colchón: el de 20:55 deja en terminal ~21:35, 2h05 antes."},{"m":"Taxi amarillo desde Manhattan","costo":"$95-120","tiempo":"50-75 min","det":"OJO: saliendo de Manhattan NO rige la tarifa fija por zonas (esa es solo para taxis que salen de EWR). Se cobra medidor + recargo Newark de $20 + peajes + congestion charge."},{"m":"Uber / Lyft","costo":"$70-110 + riesgo alto de surge","tiempo":"50-75 min","det":"El domingo 6/9 es el domingo del fin de semana largo de Labor Day: el día de mayor tráfico de retorno del año. Riesgo real de surge y de demora."}],"alerta":"El domingo 6 es el domingo del fin de semana largo de Labor Day: la noche de mayor tráfico de retorno del año. Eso castiga fuerte a todo lo que vaya en auto y no afecta al tren, así que esta noche puntual el tren no es solo más barato sino más confiable. Pero EWR va a estar cargado: por eso salimos con 2h45 y no con las 2h de siempre."},"nj_nyc":{"titulo":"Bridgewater/Branchburg NJ ↔ Manhattan · 31 ago al 3 sep","reco":"Estación RARITAN + pasajes sueltos + Uber al tren","hotel":"Residence Inn Bridgewater Branchburg, 3241 US-22 East. NO TIENE SHUTTLE (confirmado por Marriott). Estacionamiento propio gratis.","estaciones":[{"e":"Raritan ✅","dist":"6,4 km / 4,0 mi","park":"$4/día","serv":"Completo. Es cabecera: siempre hay asiento."},{"e":"Somerville","dist":"8,1 km / 5,0 mi","park":"$5/día (garage Robeson St)","serv":"Completo. Resta 3 min de viaje pero está 1 milla más lejos."},{"e":"North Branch ❌","dist":"1,7 km / 1,0 mi","park":"GRATIS, 40 lugares","serv":"SOLO horas pico. Es la más cercana pero no sirve."},{"e":"Bridgewater","dist":"13,2 km / 8,2 mi","park":"$4/día","serv":"Completo, pero es la más lejana del hotel."}],"tarifas":[{"t":"Pasaje suelto Raritan → NY Penn","p":"$18,50","nota":"PLAN CONFIRMADO: JP hace 4 tramos = $74 (ida el 1, vuelta el 2, ida el 3, más la vuelta del 31). Thais hace 2 = $37. Total $111 ← LA OPCIÓN MÁS BARATA"},{"t":"Round-trip","p":"$37,00","nota":"Exactamente 2 × $18,50. NO hay descuento."},{"t":"10-trip","p":"$185,00","nota":"Exactamente 10 × $18,50. Más caro y sobran 2 viajes."},{"t":"Pase semanal","p":"$164,00","nota":"Más caro que 8 pasajes sueltos."},{"t":"FlexPass (20 viajes one-way)","p":"$314,50","nota":"El ÚNICO producto con descuento real: 15% off, válido 30 días. Pero son 20 viajes y ustedes hacen 8 — no sirve para este viaje."},{"t":"Bus 114/117 a Port Authority","p":"$15,80","nota":"$22 más barato en total, pero 45 min más por tramo. No compensa."}],"horarios":"MAÑANA (Raritan → NY Penn, todos con transbordo en Newark): 4:31→5:59, 6:23→7:37, 6:42→8:05, 6:55→8:20, 7:13→8:31. NOCHE (NY Penn → Raritan), verificado para el miércoles 2/9/2026: 19:42 con transbordo → 21:12 · 20:48 DIRECTO → 22:04 · 21:48 DIRECTO → 23:10 · 22:48 DIRECTO → 00:04 · 00:05 con transbordo → 01:31 · 01:00 con transbordo → 02:35 (último). Viaje 75-90 min.","oneseat":"8 trenes DIRECTOS por sentido, solo días hábiles. HACIA EL ESTE (Raritan → NY Penn), llegadas a Penn: 10:06, 11:11, 12:07, 13:08, 14:10, 20:14, 21:16, 22:10. HACIA EL OESTE (NY Penn → Raritan), salidas: 10:40, 11:40, 12:45, 13:40, 14:40 y 20:48, 21:48, 22:48. CORRECCIÓN: yo había dicho que los directos eran solo de valle — es falso, los TRES trenes de la noche son directos y son justo los que ustedes van a usar. El resto del día (pico y madrugada) todos los trenes del RVL nacen o terminan en Newark Penn y hay que transbordar. El motivo: el RVL no está electrificado al oeste de Newark. Los fines de semana NO hay directo. Verificado en el PDF oficial de NJ Transit y en el feed GTFS para el 2 de septiembre de 2026.","aviso_variantes":"Esta comparativa asume el escenario máximo (ida y vuelta los 4 días). EL PLAN CONFIRMADO es más chico: JP hace 4 tramos de tren y 4 Ubers (~$146), Thais 2 y 2 (~$73). La tabla sirve para elegir ENTRE opciones, no para el total.","comparativa":[{"esc":"① Uber ↔ Raritan + tren ✅ (PLAN REAL)","calc":"$111 tren (6 tramos entre los dos) + $108 Uber (6 tramos)","tot":"~$219 los dos"},{"esc":"② Bus 114/117 + Uber","calc":"$126,40 bus + $128-176 Uber","tot":"$254-302 (pero +45 min por tramo)"},{"esc":"③ Auto de alquiler + park&ride","calc":"$160-300 alquiler + $16 parking + nafta + $148 tren","tot":"$329-469 ❌"},{"esc":"④ Auto hasta Newark Penn + PATH","calc":"$160-300 alquiler + $80-120 parking + $26 PATH","tot":"$266-446 ❌"}],"letra_chica":"Desde julio de 2026 los pasajes one-way de NJ Transit VENCEN a los 30 días de comprados. Y la mayoría de los trenes del Raritan Valley Line terminan en Newark Penn: el pasaje cubre el transbordo, pero el tiempo real de puerta a puerta es 70-90 minutos, no el de un tren directo.","veredicto_auto":"NO conviene alquilar auto solo para llegar a la estación: sale $70-160 más caro que el Uber y sumás manejar, estacionar y devolver. Solo tiene sentido si van a usar el auto para otra cosa. Y NO manejes hasta PATH: son ~35 millas por la Ruta 78/22 en hora pico (45-70 min por tramo, o sea 1,5-2,5 h diarias al volante) y PATH te deja en downtown, no en Midtown.","riesgo":"DOS RIESGOS. (1) EL HUECO DE LAS 22:48: si perdés ese tren, la próxima llegada a Raritan es a la 01:31, o sea 87 minutos después. No hay NADA en el medio. El de las 22:48 es el tren crítico de las dos noches que volvés a New Jersey. (2) Branchburg es zona semi-rural: la disponibilidad de Uber a las 6-7 AM puede ser baja y las esperas largas. Pedí el auto la noche anterior y tené plan B. AVISO: NJ Transit publica cambios por obras con ~2 semanas de anticipación — revisá njtransit.com/travel-alerts-to unos días antes."},"nyc_interno":{"titulo":"Moverse dentro de NYC","cambio_clave":"EL METROCARD SE ELIMINÓ. Desde el 1 de enero de 2026 no se puede comprar ni recargar, y los pases de 7 y 30 días ilimitados ya no existen. No hay decisión que tomar: se usa OMNY.","tarifa":"$3,00 por viaje de subte o bus local (subió de $2,90 en enero 2026). Bus express $7,25.","capping":"Fare capping de OMNY: una vez que gastaste $35 en pasajes dentro de una ventana móvil de 7 días, el resto de esos 7 días viajás gratis. La regla es el MONTO ($35), no la cantidad de viajes — que den ~12 es aritmética ($3 × 11 = $33 y el viaje 12 cobra $2 hasta llegar a $35). La ventana arranca con el PRIMER tap, no el lunes. Los buses express, el AirTrain de JFK y los transbordos NO suman al tope.","critico":"Hay que usar SIEMPRE EL MISMO plástico o dispositivo los 7 días. Si un día tapean con el celular y otro con la tarjeta física, el contador se parte en dos y nunca llegan al tope. Cada persona necesita su propio medio: no se puede tapear dos veces con la misma tarjeta. Y ojo con la tarjeta extranjera: cada tap puede generar comisión por consumo en el exterior — conviene una tarjeta sin esa comisión, o crear una cuenta OMNY.","cuenta":"9 días en NYC = dos períodos de 7 días. Con uso intensivo, el techo es $35 + $35 = $70 por persona en todo el viaje. Con uso liviano pagan solo lo que usan: OMNY nunca cobra de más.","hoteles":[{"h":"Ink48 (48th & 11th Ave)","s":"50 St (C,E) a ~12 min caminando hacia el este. Es un hotel notoriamente lejos del subte."},{"h":"The Beacon (Broadway & 75th)","s":"72 St (1,2,3) a 3 cuadras, 79 St (1) a 4. Directo a Penn Station en 10 min."}]}},"passes":{"veredicto":"TICKETS INDIVIDUALES. Ningún pase les cierra con este itinerario, y el ahorro real está en el calendario gratuito, no en los pases.","razones":["El itinerario está construido sobre días gratis y pay-what-you-wish (Whitney viernes, MCNY miércoles, Frick miércoles, Guggenheim domingo, MoMA PS1, MoMI jueves). Nada de eso está en ningún pase, y los pases no lo compensan.","SUMMIT One Vanderbilt y el MET — dos de los ítems más caros y deseados — NO están en NINGÚN pase. Se pagan aparte siempre.","Los precios 'desde' oficiales son bajos si se compra con anticipación (Edge $34 con Advance Saver a 14+ días, Top of the Rock $42, ESB $44). Los pases se calculan contra los precios PICO ($57-69), no contra estos.","El Go City All-Inclusive es de días CONSECUTIVOS: necesitarían ~7 atracciones en 3 días seguidos para amortizarlo, lo que choca de frente con los días de cierre (miércoles cierra el MET, martes cierran Frick y 9/11).","Thais ya conoce los clásicos y va a hacer bastante menos atracciones pagas. Para ella ningún pase se acerca a amortizar."],"opciones":[{"p":"New York CityPASS C3","c":"$116 (con fee)","v":"9 días desde el primer uso","inc":"Elegís 3 de 10: Empire State, Top of the Rock, Statue of Liberty+Ellis, 9/11 Museum, Edge, AMNH, Circle Line, MoMA, Intrepid, Guggenheim","an":"Con ESB + 9/11 + AMNH cubre $117 a precio 'desde'. Ahorro ≈ $1. Solo conviene si compran a último momento a precio pico (ahorro ~$20)."},{"p":"New York CityPASS (5 atracciones)","c":"$164","v":"9 días desde el primer uso","inc":"Obligatorias: Empire State + AMNH. Después 3 de 6: Top of the Rock, 9/11, Statue of Liberty, Circle Line, Intrepid, Guggenheim","an":"El único con ahorro defendible: ~$28 a precio 'desde', ~$47 a precio pico. PERO solo si Circle Line y la Estatua ya estaban en el plan — y en este itinerario no están."},{"p":"Go City Explorer (5 atracciones)","c":"$179","v":"30 días desde la primera atracción","inc":"Elegís entre ~90 atracciones. NO incluye SUMMIT, MET, Tenement, Frick, Vessel.","an":"Ahorro ~$22 + Big Bus Tour gratis (valor hasta $81, promo hasta el 7 de septiembre). Solo vale si de verdad van a usar el bus turístico. Si no, el ahorro es marginal."},{"p":"Go City All-Inclusive (3 días)","c":"$269","v":"3 días CONSECUTIVOS","inc":"Todo lo del Explorer, ilimitado en 3 días seguidos","an":"❌ Necesita ~7 atracciones en 3 días consecutivos. Ritmo agotador y choca con los cierres semanales. No para este viaje."},{"p":"The Sightseeing Pass","c":"—","v":"—","inc":"—","an":"🚫 NO EXISTE MÁS. La empresa suspendió operaciones en junio de 2025; el AMNH le ganó un juicio de $508.474 en marzo de 2026 por entradas impagas. El sitio sigue online. NO COMPRAR."}],"gratis_valor":[{"d":"Miércoles 2/9","q":"MCNY gratis + Frick pay-what-you-wish","v":"$106 (2 personas)"},{"d":"Viernes 4/9","q":"Whitney gratis 17-22h","v":"$60 (2 personas)"},{"d":"Viernes 4/9","q":"Morgan Library gratis 17-20h (reserva el 28/8)","v":"$50 (2 personas)"},{"d":"Viernes 4/9","q":"Noguchi gratis (primer viernes)","v":"$32 (2 personas)"},{"d":"Domingo 6/9","q":"Guggenheim pay-what-you-wish 16-17:30","v":"~$32-60 (2 personas)"},{"d":"Jueves 3/9","q":"Museum of the Moving Image gratis 14-18h","v":"$40 (2 personas)"},{"d":"Todo 2026","q":"MoMA PS1 gratis para todos","v":"~$40 (2 personas)"},{"d":"Sáb 29 y dom 30/8","q":"Charlie Parker Jazz Festival","v":"$240+ (equivalente en club)"},{"d":"Miércoles 2/9","q":"SummerStage: Christian McBride","v":"$120+ (equivalente en club)"}],"total_gratis":"El calendario gratuito de este itinerario vale aproximadamente $700-780 para los dos. Ningún pase se acerca.","comprar_ahora":["Edge con tarifa Advance Saver ($34): exige 14+ días de anticipación. Si lo quieren, hay que comprarlo ya.","Village Vanguard (Patitucci/Potter/Blade, 1-6 sep): 123 asientos, se agota.","Tenement Museum: los tours se agotan y no hay reembolso ni cambio.","Estatua de la Libertad corona: se agota MESES antes. Para Labor Day weekend probablemente ya no haya.","Morgan Library viernes gratis: la reserva se abre el viernes 28 de agosto, una semana antes."]},"reservas":[{"q":"Village Vanguard — Patitucci/Potter/Blade","cuando":"YA","url":"vv.squadup.com","por":"123 asientos. Es lo mejor del viaje musicalmente. Sin cambios ni transferencias.","urg":3},{"q":"Birdland LUNES 31/8 — Vince Giordano & the Nighthawks, set 20:30","cuando":"YA","url":"birdlandjazz.com","por":"Es ancla fija del lunes y era la ÚNICA ancla sin ítem en este checklist (lo detectó la auditoría). Los lunes de Giordano se llenan.","urg":3},{"q":"PLAY de Broadway sáb 5/9 — COMPRA FIRME esta semana (Stranger Things: The First Shadow, o HP/Paranormal Activity/Imaginary Invalid)","cuando":"esta semana","url":"Telecharge / TodayTix","por":"Reemplaza al musical (pedido de Juan). Desde ~$76. ⚠️ Al comprar, VERIFICAR el horario de la función del sábado (19:00/19:30/20:00): tiene que TERMINAR ~22:00 para llegar al Café Wha 23:10.","urg":3},{"q":"CAFÉ WHA sáb 5/9 — reserva GRATIS por Eventbrite (Set 2, 23:45)","cuando":"YA (la venta cierra el 5/9 y los cupos antes)","url":"eventbrite.com (The Cafe Wha? House Band - Saturday Set 2)","por":"Es SOLO reserva, no entrada: TODOS presentes a las 23:30 o liberan los asientos al standby. $20 de music charge por cabeza en la cuenta + consumo. Grupos >10: contact@cafewha.com.","urg":3},{"q":"Dizzy's JUEVES 3/9 21:00 — solo si deciden mantenerlo","cuando":"2-3 días antes","url":"jazz.org/dizzys","por":"Entradas con horario. CONDICIONAL: es la noche del día de ~17 horas con 5 de sueño — decidan a las 20:00 de ese día; la reserva flexible o el set Late Night (~22:45) son las opciones de bajo riesgo.","urg":1},{"q":"Dos mails operativos: early check-in Ink48 (para el sáb 29) y luggage drop en The Beacon desde las 8:45 (jue 3)","cuando":"esta semana","url":"mail a cada hotel","por":"El día 1 y el día 6 dependen de que los dos hoteles digan que sí. Un mail de dos líneas cada uno.","urg":2},{"q":"Orden de artistas del festival Charlie Parker (¿a qué hora toca Joshua Redman?)","cuando":"vie 28/8","url":"cityparksfoundation.org","por":"La salida obligada de las 18:30 puede o no cortar el set de cierre. Saberlo el día antes permite decidir el plan B del subte (salir 18:10) con datos.","urg":2},{"q":"Tenement Museum — SOLO SI deciden sumarlo (quedó FUERA del plan)","cuando":"solo si lo suman","url":"tenement.org","por":"Los dos lo bajaron a 'quizás' y no está en ningún día. OJO: es sin reembolso — no reservar algo que no está agendado.","urg":1},{"q":"Edge — tarifa Advance Saver $34","cuando":"YA (exige 14+ días)","url":"edgenyc.com","por":"FUERA del plan (lo marcaron 0/0 en la última pasada). Solo si cambian de idea; con SUMMIT y Top of the Rock ya se solapa mucho.","urg":1},{"q":"SUMMIT — VIERNES 4/9, slot ATARDECER ~18:00-18:15","cuando":"YA","url":"summitov.com","por":"$57-63 la franja de atardecer y es LA que primero se agota. Pedido de ustedes: luz + atardecer (~19:21) + noche en un solo ticket, con los espejos de Kusama en el momento justo.","urg":3},{"q":"Ford Foundation Atrium","cuando":"Antes de las 17h del día anterior","url":"fordfoundation.org","por":"Preinscripción obligatoria. Solo se puede entrar del 31/8 al 3/9 — cierra el 5, 6, 7 y 9 de septiembre.","urg":3},{"q":"Morgan Library — viernes gratis 17-20h","cuando":"VIERNES 28 DE AGOSTO","url":"themorgan.org","por":"Las reservas se liberan exactamente una semana antes. Si no la sacan ese día, no entran gratis.","urg":3},{"q":"Whitney — viernes gratis 17-22h","cuando":"YA (se liberan hasta 5 semanas antes)","url":"whitney.org","por":"OBLIGATORIA: el museo dice explícitamente que se necesita ticket y el cupo es limitado. No se entra caminando. OJO ADEMÁS: desde el 19 de agosto el Whitney volvió a su horario regular y CIERRA LOS MARTES.","urg":3},{"q":"Noguchi Museum — FUERA del plan (0/0)","cuando":"solo si lo suman","url":"noguchi.org","por":"Lo marcaron 0/0: no reservar salvo cambio de idea. (El primer viernes del mes es gratis hasta las 20h, por si acaso.)","urg":1},{"q":"Broadway — loterías digitales","cuando":"TODOS LOS DÍAS desde ya","url":"Broadway Direct, Telecharge, LuckySeat, TodayTix","por":"Entrar es GRATIS. Hamilton $10, Maybe Happy Ending $20,64, MJ/Hadestown/Moulin Rouge $49. Anotarse a 5-6 por día no cuesta nada.","urg":2},{"q":"Moulin Rouge! — última function fresh(){
  const it = JSON.parse(JSON.stringify(BASE_ITIN));
